<!DOCTYPE html>
<html lang="fi" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polku hoitoon – ammattilaisille</title>
<meta name="description" content="Polku hoitoon ammattilaisnäkymä: potilaan oirevastaukset ja Kannan tiedot yhdessä näkymässä.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213D;--muted:#4A5872;--blue:#1F5FD6;--blue-d:#123E91;--sky:#EAF1FF;--bg:#F5F7FB;--line:#E3E8F0;--orange:#D9730D;--orange-bg:#FFF3E6;--orange-ink:#8A3B00}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.55;font-size:17px}
a{color:var(--blue)}a:hover{color:var(--blue-d)}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;line-height:1.15;margin:0;letter-spacing:-.01em}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;flex-wrap:wrap;padding:8px 0}
.logo{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:24px;color:var(--ink);text-decoration:none}
.bar-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
select{font:inherit;font-size:15px;min-height:44px;padding:0 12px;border:1px solid #C9D2E0;border-radius:10px;background:#fff;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;font-size:16px;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--blue-d);color:#fff}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px}
.hero{background:var(--bg);padding:56px 0 48px}
.hero-g{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center}
.badge{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--orange-bg);color:var(--orange-ink);font-weight:700;font-size:14px;margin-bottom:16px}
.hero h1{font-size:clamp(34px,5vw,54px)}
.lead{font-size:19px;color:var(--muted);margin:18px 0 26px;max-width:36em}
.bus{width:100%;height:auto}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:-28px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 2px 8px rgba(20,33,61,.05)}
.faq{border-bottom:1px solid var(--line);padding:14px 0}.faq summary{font-weight:600;cursor:pointer;font-size:17px}.faq p{margin:8px 0 0;color:var(--muted)}
.stat-cap{grid-column:1/-1;justify-self:start;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.stat b{display:block;font-family:"Space Grotesk",sans-serif;font-size:34px;color:var(--blue-d)}
.stat span{font-size:15px;color:var(--muted)}
section{padding:56px 0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}
.list{margin:16px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.list li{display:flex;gap:12px;align-items:flex-start}
.dot{flex:none;width:10px;height:10px;border-radius:5px;background:var(--blue);margin-top:9px}
.uk{background:var(--ink);color:#fff}
.uk h2{color:#fff}
.uk p{color:#DCE3F0}
.uk .src{font-size:14px;color:#AAB6CC}
.uk a{color:#9EC1FF}
.warn{background:var(--orange-bg);border:1px solid #F5B97A;border-radius:18px;padding:22px 24px;color:var(--orange-ink)}
.warn h3{color:var(--orange-ink);font-size:22px;margin-bottom:6px}
form{display:flex;flex-direction:column;gap:16px}
label{font-weight:600;font-size:15px;display:block;margin-bottom:6px}
input[type=text],input[type=tel]{width:100%;font:inherit;min-height:48px;padding:0 14px;border:1px solid #C9D2E0;border-radius:10px;color:var(--ink)}
input:focus,select:focus,.btn:focus,.opt:focus-within{outline:3px solid #9EC1FF;outline-offset:2px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid #C9D2E0;border-radius:10px;font-weight:500;cursor:pointer}
.opt input{width:18px;height:18px;accent-color:var(--blue)}
.consent{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:15px}
.consent input{width:20px;height:20px;margin-top:2px;accent-color:var(--blue);flex:none}
.msg{padding:14px 16px;border-radius:12px;font-size:16px}
.msg.ok{background:var(--sky);color:var(--blue-d)}
.msg.err{background:#FDECEC;color:#9B1C1C}
.msg.demo{background:var(--orange-bg);color:var(--orange-ink)}
.team{background:var(--bg)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line)}
footer{padding:32px 0 48px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
footer p{margin:0;max-width:46em;padding:16px 18px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:16px;color:var(--ink)}
.hidden{display:none}
[dir=rtl] .list li,[dir=rtl] .consent{flex-direction:row}
@media (max-width:780px){.hero-g,.g2{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:minmax(0,1fr);margin-top:20px}.hero{padding:36px 0}.bus{max-width:360px}}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}.tab{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted);text-decoration:none}.tab:hover{color:var(--ink)}.tab.on{background:#fff;color:var(--blue-d);box-shadow:0 1px 3px rgba(20,33,61,.12)}
@media (max-width:780px){.tabs{order:3;width:100%}.tab{flex:1;justify-content:center}}

.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:22px}
.feat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
.feat h3{font-size:20px;margin-bottom:6px}.feat p{margin:0;color:var(--muted)}
.dash{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(20,33,61,.10);overflow:hidden;margin-top:28px}
.dash-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;background:var(--ink);color:#fff;font-size:14px;font-weight:600}
.dash-top span{opacity:.75;font-weight:500}
.dash-g{display:grid;grid-template-columns:240px minmax(0,1fr)}
.plist{border-inline-end:1px solid var(--line);background:var(--bg);padding:14px}
.plist h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.pr{display:block;padding:10px 12px;border-radius:12px;margin-bottom:6px;font-size:15px}
.pr b{display:block}.pr small{color:var(--muted);font-size:13px}
.pr.on{background:#fff;border:1px solid var(--line);box-shadow:0 1px 3px rgba(20,33,61,.08)}
.pr .fl{color:#8A3B00;font-weight:700}
.pd{padding:20px 22px;display:grid;gap:16px}
.pd h3{font-size:22px}
.meta{color:var(--muted);font-size:14px}
.flag{background:var(--orange-bg);border:1px solid #F5B97A;border-radius:14px;padding:14px 16px;color:var(--orange-ink)}
.flag b{display:block;margin-bottom:4px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.box{border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.box h5{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:600}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:14px}
.tl li{display:grid;grid-template-columns:54px 70px minmax(0,1fr);gap:8px;align-items:start}
.tl time{color:var(--muted);font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;text-align:center}
.chip.k{background:#EEF0F4;color:#4A5872}.chip.a{background:var(--sky);color:var(--blue-d)}
.tl .hot{font-weight:600}
.fb{font-style:italic}
.demo{font-size:13px;color:var(--muted);margin-top:10px}
.techbox{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:22px}
.techbox p{margin:0 0 10px}
@media (max-width:860px){.dash-g{grid-template-columns:minmax(0,1fr)}.plist{border-inline-end:0;border-bottom:1px solid var(--line)}.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:780px){.tabs{display:grid;grid-template-columns:1fr 1fr}.tab{padding:0 8px;font-size:14px;min-height:38px}}
.rgk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.kp{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.kp b{display:block;font-family:"Space Grotesk",sans-serif;font-size:32px;color:var(--blue-d);line-height:1.1}
.kp span{display:block;font-size:15px;margin-top:4px}.kp small{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.rb2{display:grid;grid-template-columns:150px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:13px;padding:2px 0;cursor:pointer}
.rb2 .t{height:14px;background:var(--bg);border-radius:4px;position:relative}
.rb2 .f{position:absolute;inset:0 auto 0 0;border-radius:4px;background:#9AA6BA}
.rb2 .m{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);left:66.67%}
.rb2.on{font-weight:700}.rb2.on .f{background:var(--orange)}
@media (max-width:860px){.rgk{grid-template-columns:minmax(0,1fr)}.rb2{grid-template-columns:120px minmax(0,1fr) 36px}}
.menu{position:relative}.menu summary{list-style:none;cursor:pointer;min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;border:1px solid #C9D2E0;border-radius:10px;font-size:20px;background:#fff;color:var(--ink)}.menu summary::-webkit-details-marker{display:none}
.menu-p{position:absolute;inset-inline-end:0;top:52px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(20,33,61,.14);padding:8px;min-width:230px;display:flex;flex-direction:column;z-index:20}
.menu-p a{padding:11px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;font-size:16px}.menu-p a:hover{background:var(--bg)}
/* spacing v2 */
body{line-height:1.6}
.wrap{padding:0 24px}
header .bar{padding:12px 24px;gap:16px;min-height:72px}
.bar-r{gap:12px}
section{padding:80px 0}
.hero{padding:72px 0 64px}
.lead{margin:20px 0 30px}
.g2{gap:48px}
.card{padding:28px}
form{gap:20px}
.stats{gap:20px}
.list{gap:14px;margin-top:20px}
.faq{padding:18px 0}
footer{padding:40px 0 56px}
@media (max-width:780px){.wrap{padding:0 20px}header .bar{padding:12px 20px;gap:12px}.bar-r{display:contents}.logo{order:1;flex:1;font-size:22px}header select{order:2;padding:0 8px;font-size:14px}.menu{order:3}.tabs{order:4;width:100%}header .btn.sm{display:none}section{padding:56px 0}.hero{padding:40px 0 44px}.g2{gap:32px}}
</style>
</head>
<body data-languages="fi,sv,en">
<div id="site-header"></div><script src="/layout.js"></script>

<main id="top">
  <div class="hero">
    <div class="wrap">
      <span class="badge" data-t="badge"></span>
      <h1 data-t="h1" style="max-width:18em"></h1>
      <p class="lead" data-t="lead"></p>
      <a class="btn" href="mailto:info@polkuhoitoon.fi?subject=Polku%20hoitoon%20pilotti" data-t="cta"></a>

      <div class="dash" role="img" aria-label="Polku hoitoon professional dashboard example">
        <div class="dash-top"><div>Polku hoitoon · <span data-t="d_title"></span></div><span data-t="demo_note"></span></div>
        <div class="dash-g">
          <div class="plist">
            <h4 data-t="d_list"></h4>
            <div class="pr on"><b data-t="p1"></b><small class="fl" data-t="p1s"></small></div>
            <div class="pr"><b data-t="p2"></b><small data-t="p2s"></small></div>
            <div class="pr"><b data-t="p3"></b><small data-t="p3s"></small></div>
          </div>
          <div class="pd">
            <div><h3 data-t="p1"></h3><div class="meta" data-t="d_meta"></div></div>
            <div class="flag"><b data-t="flag_h"></b><span data-t="flag_p"></span></div>
            <div class="two">
              <div class="box">
                <h5 data-t="chart_h"></h5>
                <svg viewBox="0 0 300 110" width="100%" role="img" aria-label="Cough trend rising over 6 weeks">
                  <line x1="10" y1="100" x2="290" y2="100" stroke="#E3E8F0"/>
                  <line x1="10" y1="55" x2="290" y2="55" stroke="#F1F4F8"/>
                  <line x1="10" y1="10" x2="290" y2="10" stroke="#F1F4F8"/>
                  <polyline fill="none" stroke="#1F5FD6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="20,82 74,73 128,73 182,55 236,46 280,28"/>
                  <circle cx="280" cy="28" r="5" fill="#D9730D"/>
                  <text x="20" y="96" font-size="10" fill="#4A5872">0</text>
                  <text x="20" y="18" font-size="10" fill="#4A5872">10</text>
                </svg>
                <div class="meta" data-t="chart_x"></div>
              </div>
              <div class="box">
                <h5 data-t="tl_h"></h5>
                <ul class="tl">
                  <li><time>12.9.</time><span class="chip k" data-t="src_k"></span><span data-t="t1"></span></li>
                  <li><time>3.10.</time><span class="chip k" data-t="src_k"></span><span data-t="t2"></span></li>
                  <li><time>20.10.</time><span class="chip k" data-t="src_k"></span><span data-t="t3"></span></li>
                  <li><time>28.10.</time><span class="chip a" data-t="src_a"></span><span class="hot" data-t="t4"></span></li>
                  <li><time>6.11.</time><span class="chip a" data-t="src_a"></span><span class="hot" data-t="t5"></span></li>
                </ul>
              </div>
            </div>
            <div class="two">
              <div class="box"><h5 data-t="path_h"></h5><div data-t="path_p"></div></div>
              <div class="box"><h5 data-t="fb_h"></h5><div class="fb" data-t="fb_p"></div></div>
            </div>
          </div>
        </div>
      </div>
      <p class="demo" data-t="demo_note"></p>
    </div>
  </div>

  <section id="alue" style="padding-bottom:24px">
    <div class="wrap">
      <h2 style="font-size:30px" data-t="rg_h"></h2>
      <p style="color:var(--muted);margin:8px 0 16px;max-width:46em" data-t="rg_p"></p>
      <label for="rgSel" data-t="rg_sel"></label>
      <select id="rgSel" style="max-width:420px;width:100%"></select>
      <div class="rgk">
        <div class="kp"><b id="rgSmr"></b><span data-t="rg_k1"></span><small id="rgCi"></small></div>
        <div class="kp"><b id="rgDeaths"></b><span data-t="rg_k2"></span><small id="rgExp"></small></div>
        <div class="kp"><b id="rgRank"></b><span data-t="rg_k3"></span><small id="rgSig"></small></div>
      </div>
      <div class="flag" style="margin-top:16px;background:#E7F6EC;border-color:#9BD3AE;color:#14532D"><b data-t="rec_h"></b><span id="recT"></span><small style="display:block;margin-top:6px;opacity:.85" data-t="rec_rule"></small></div>
      <div class="two" style="margin-top:16px;align-items:start">
        <div class="box"><h5 data-t="rg_chart"></h5><div id="rgBars"></div></div>
        <div class="box" style="background:var(--sky);border-color:#C9D9FA">
          <h3 style="font-size:22px;margin-bottom:6px" data-t="ai_h"></h3>
          <p style="margin:0 0 12px;font-size:15px;color:var(--blue-d)" data-t="ai_p"></p>
          <button class="btn sm" id="aiBtn" type="button" data-t="ai_btn"></button>
          <div style="margin-top:14px"><label for="aiQ" data-t="ai_q"></label>
            <div style="display:flex;gap:8px"><input id="aiQ" type="text" maxlength="300" style="flex:1;background:#fff"><button class="btn sm" id="aiAsk" type="button" data-t="ai_ask" style="background:#fff;color:var(--blue-d);border:1px solid #C9D2E0"></button></div></div>
          <div id="aiOut" class="hidden" style="margin-top:14px;background:#fff;border-radius:12px;padding:14px 16px;white-space:pre-wrap;font-size:15.5px" role="status" aria-live="polite"></div>
          <p id="aiNote" class="hidden" style="font-size:13px;color:var(--muted);margin:8px 0 0" data-t="ai_note"></p>
        </div>
      </div>
      <p class="demo" data-t="rg_src"></p>
    </div>
  </section>

  <section>
    <div class="wrap">
      <h2 style="font-size:30px" data-t="feat_h"></h2>
      <div class="feats">
        <div class="feat"><h3 data-t="g1h"></h3><p data-t="g1p"></p></div>
        <div class="feat"><h3 data-t="g2h"></h3><p data-t="g2p"></p></div>
        <div class="feat"><h3 data-t="g3h"></h3><p data-t="g3p"></p></div>
        <div class="feat"><h3 data-t="g4h"></h3><p data-t="g4p"></p></div>
        <div class="feat"><h3 data-t="g5h"></h3><p data-t="g5p"></p></div>
      </div>
    </div>
  </section>

  <section style="background:var(--bg)">
    <div class="wrap g2">
      <div>
        <h2 style="font-size:30px" data-t="why_h"></h2>
        <ul class="list">
          <li><span class="dot" aria-hidden="true"></span><span data-t="w1"></span></li>
          <li><span class="dot" aria-hidden="true"></span><span data-t="w2"></span></li>
          <li><span class="dot" aria-hidden="true"></span><span data-t="w3"></span></li>
        </ul>
        <p style="font-size:14px;color:var(--muted);margin-top:14px" data-t="w_src"></p>
      </div>
      <div class="techbox">
        <h2 style="font-size:24px;margin-bottom:12px" data-t="tech_h"></h2>
        <p data-t="tech1"></p><p data-t="tech2"></p><p data-t="tech3"></p>
        <p style="font-size:14px;color:var(--muted);margin:0" data-t="tech_src"></p>
      </div>
    </div>
  </section>

  <section id="pilot">
    <div class="wrap">
      <div class="card" style="max-width:720px">
        <h2 style="font-size:28px;margin-bottom:8px" data-t="pilot_h"></h2>
        <p style="color:var(--muted);margin:0 0 16px" data-t="pilot_p"></p>
        <a class="btn" href="mailto:info@polkuhoitoon.fi?subject=Polku%20hoitoon%20pilotti">info@polkuhoitoon.fi</a>
      </div>
    </div>
  </section>
</main>

<script>

kuksen kuolemansyytilastosta 2021–2025 ja suhteutettu alueen ikärakenteeseen.", "rg_sel": "Hyvinvointialue", "rg_k1": "kuolemia suhteessa odotettuun", "rg_k2": "keuhkosyöpäkuolemaa 2021–2025", "rg_k3": "sijoitus 22 alueen joukossa (1 = suurin kuolleisuus)", "rg_over": "enemmän kuin odotettu", "rg_under": "vähemmän kuin odotettu", "rg_exp": "odotettu", "rg_ci": "95 %:n luottamusväli", "rg_sig": "Ero koko maahan on tilastollisesti merkitsevä.", "rg_nosig": "Ero koko maahan ei ole tilastollisesti merkitsevä.", "rg_chart": "Kaikki alueet (1,0 = koko maan taso)", "ai_h": "Tekoälyanalyytikko", "ai_p": "Analyytikko selittää alueen eron: mikä se on, mitä valtakunnallinen näyttö kertoo viiveistä ja mitä alueesta ei vielä tiedetä. Se käyttää vain tämän sivuston lähteitä ja merkitsee lähteen jokaisen väitteen perään. Suositukset tekee Polku Labs, ei tekoäly.", "ai_btn": "Selitä alueen ero", "ai_q": "Tai kysy oma kysymys", "ai_ph": "Esim. Mitä viiveistä tiedetään?", "ai_ask": "Kysy", "ai_wait": "Analyytikko kirjoittaa…", "ai_err": "Analyytikko ei ole nyt käytettävissä. Yritä hetken päästä uudelleen.", "ai_note": "Tekoälyn tuottama teksti. Tarkista luvut lähteistä ennen päätöksiä.", "rg_src": "Lähteet: Tilastokeskus StatFin 13u5, 11az ja 11s1; laskenta Polku Labs. Syy 11 sisältää kurkunpään, henkitorven ja keuhkon syövät (C32–C34). Viivetietoja ei ole saatavilla alueittain.", "rec_h": "Polku Labsin suositus alueelle", "rec_hi": "Kuolleisuus on merkitsevästi koko maata suurempi. Suosittelemme: 1) alue etusijalle riskiryhmän seulontabussin pilottiin, mittarina varhaisvaiheen (1–2) osuus, ja 2) huomiolippu ja suora kuvauslähete terveysasemille, mittarina päivät ensikäynnistä kuvaukseen.", "rec_mid": "Kuolleisuus ei eroa merkitsevästi koko maasta. Suosittelemme aloittamaan kevyimmistä toimista: 1) huomiolippu ja suora kuvauslähete terveysasemille ja 2) sovellus oireseurantaan omalla kielellä, mittarina aika oireista ensikäyntiin.", "rec_lo": "Kuolleisuus on merkitsevästi koko maata pienempi. Emme suosittele erityistoimia. Seuratkaa mittareita ja jakakaa toimivat käytännöt muille alueille.", "rec_rule": "Suositus perustuu sääntöön: verrataan alueen kuolleisuuden luottamusväliä koko maan tasoon (1,0). Toimenpiteitä ei ole vielä pilotoitu."}, "sv": {"brand": "Polku hoitoon", "nav_bus": "Screeningbussen", "nav_app": "Appen", "nav_pro": "För vårdpersonal", "badge": "Vy för vårdpersonal · koncept", "h1": "Helheten om patienten i en blick", "lead": "Polku hoitoon samlar patientens egna symtomsvar och uppgifterna i Kanta i en vy. Utspridda symtom syns tillsammans, även om läkaren byts.", "cta": "Intresserad av en pilot? Kontakta oss", "demo_note": "Exempel. Alla uppgifter är påhittade.", "d_title": "Vy för vårdpersonal · Hälsostation", "d_list": "Patienter", "p1": "Patient A, 63 år", "p1s": "3 observationer", "p2": "Patient B, 58 år", "p2s": "Stabilt", "p3": "Patient C, 71 år", "p3s": "Nytt svar", "d_meta": "63 år · röker · svarar på arabiska, översatt till svenska", "flag_h": "Observera", "flag_p": "Hosta över 3 veckor, rökare, 3:e besöket på 8 veckor. Överväg vidare undersökningar enligt lokal vårdanvisning.", "chart_h": "Hosta enligt patientens egna svar (0–10)", "chart_x": "6 veckor", "tl_h": "Tidslinje", "src_k": "Kanta", "src_a": "Appen", "t1": "Hälsostation, läkare 1: övre luftvägsinfektion", "t2": "Lungröntgen: normal", "t3": "Företagshälsa, läkare 2: långvarig hosta", "t4": "Hostan värre, trötthet, viktnedgång 3 kg", "t5": "Blod i upphostningar en gång", "path_h": "Vårdväg", "path_p": "Nästa steg är inte överenskommet. Patienten vet inte om hen själv ska boka tid.", "fb_h": "Patientens respons", "fb_p": "”Jag visste inte om jag skulle ringa eller vänta på att någon kontaktar mig.”", "feat_h": "Vad får vårdpersonalen?", "g1h": "Samlad vy", "g1p": "Besök och svar från Kanta och patientens egna svar på samma tidslinje. Ingen behöver leta i olika system.", "g2h": "Observationsflaggor", "g2p": "Utifrån överenskomna kriterier lyfter vyn fram återko  oss", "rg_h": "Regionvy: var är dödligheten i lungcancer högre än väntat?", "rg_p": "Välj välfärdsområde. Siffrorna är beräknade ur Statistikcentralens dödsorsaksstatistik 2021–2025 och justerade för områdets åldersstruktur.", "rg_sel": "Välfärdsområde", "rg_k1": "dödsfall i förhållande till väntat", "rg_k2": "dödsfall i lungcancer 2021–2025", "rg_k3": "placering bland 22 områden (1 = högst dödlighet)", "rg_over": "fler än väntat", "rg_under": "färre än väntat", "rg_exp": "väntat", "rg_ci": "95 % konfidensintervall", "rg_sig": "Skillnaden mot hela landet är statistiskt signifikant.", "rg_nosig": "Skillnaden mot hela landet är inte statistiskt signifikant.", "rg_chart": "Alla områden (1,0 = hela landets nivå)", "ai_h": "AI-analytiker", "ai_p": "Analytikern förklarar skillnaden i området: vad den är, vad nationell evidens säger om fördröjningar och vad man ännu inte vet om området. Den använder bara källorna på den här webbplatsen och anger källan efter varje påstående. Rekommendationerna görs av Polku Labs, inte av AI.", "ai_btn": "Förklara skillnaden i området", "ai_q": "Eller ställ en egen fråga", "ai_ph": "T.ex. Vad vet man om fördröjningarna?", "ai_ask": "Fråga", "ai_wait": "Analytikern skriver…", "ai_err": "Analytikern är inte tillgänglig just nu. Försök igen om en stund.", "ai_note": "AI-genererad text. Kontrollera siffrorna i källorna före beslut.", "rg_src": "Källor: Statistikcentralen StatFin 13u5, 11az och 11s1; beräkning Polku Labs. Orsak 11 omfattar cancer i struphuvud, luftstrupe och lunga (C32–C34). Uppgifter om fördröjningar finns inte per område.", "rec_h": "Polku Labs rekommendation för området", "rec_hi": "Dödligheten är signifikant högre än i hela landet. Vi rekommenderar: 1) prioritera området för en pilot med screeningbuss för riskgruppen, med andelen fall i tidigt skede (1–2) som mått, och 2) flagga och direkt bildremiss på hälsostationerna, med dagar från första besök till bildundersökning som mått.", "rec_mid": "Dödligheten avviker inte signifikant från hela landet. Vi rekommenderar att börja med de lättaste åtgärderna: 1) flagga och direkt bildremiss på hälsostationerna och 2) appen för symtomuppföljning på eget språk, med tid från symtom till första besök som mått.", "rec_lo": "Dödligheten är signifikant lägre än i hela landet. Vi rekommenderar inga särskilda åtgärder. Följ måtten och dela fungerande arbetssätt med andra områden.", "rec_rule": "Rekommendationen bygger på en regel: områdets konfidensintervall jämförs med hela landets nivå (1,0). Åtgärderna har ännu inte pilottestats."}, "en": {"brand": "Polku hoitoon", "nav_bus": "Screening bus", "nav_app": "App", "nav_pro": "For professionals", "badge": "Professional view · concept", "h1": "The whole patient picture at a glance", "lead": "Polku hoitoon brings the patient's own symptom reports and their Kanta records into one view. Scattered symptoms show up together, even when the doctor changes.", "cta": "Interested in a pilot? Get in touch", "demo_note": "Example. All data is fictional.", "d_title": "Professional view · Health centre", "d_list": "Patients", "p1": "Patient A, 63", "p1s": "3 flags", "p2": "Patient B, 58", "p2s": "Stable", "p3": "Patient C, 71", "p3s": "New report", "d_meta": "63 · smoker · answers in Arabic, translated to English", "flag_h": "Flag", "flag_p": "Cough over 3 weeks, smoker, 3rd visit in 8 weeks. Consider further investigation according to local guidelines.", "chart_h": "Cough from the patient's own reports (0–10)", "chart_x": "6 weeks", "tl_h": "Timeline", "src_k": "Kanta", "src_a": "App", "t1": "Health centre, doctor 1: upper respiratory infection", "t2": "Chest X-ray: normal", "t3": "Occupational health, doctor 2: prolonged cough", "t4": "Cough worse, fatigue, lost 3 kg", "t5": "Blood in sputum once", "path_h": "Care path", "path_p": "No next step agreed. The patient doesn't know whether to book an appointment.", "fb_h": "Patient feedback", "fb_p": "“I didn't know whether to call or wait to be contacted.”", "feat_h": "What do professionals get?", "g1h": "One combined view", "g1p": "Kanta visits and results and the patient's own reports on the same timeline. No one has to search through different systems.", "g2h": "Flags", "g2p": "Based on agreed criteria, the view highlights recurring symptoms, such as a cough over 3 weeks in a smoker. Flags support decisions; they don't diagnose.", "g3h": "Translated reports", "g3p": "The patient answers in their own language, the professional reads it in Finnish or English. The original answer is always kept.", "g4h": "A visible care path", "g4p": "Everyone sees the next step and who is responsible. Fewer calls and gaps.", "g5h": "Feedback on care", "g5p": "Patient feedback is visible to the unit, so bottlenecks can be found.", "why_h": "Why is this needed?", "w1": "Cancer is not always suspected at the health centre, because information is scattered and symptoms are vague.", "w2": "Doctors change and the same patient may see several doctors. No one sees the whole picture.", "w3": "For lung cancer in Finland, primary care accounts for 41 days of the delay on average. The full delay from symptoms to treatment is 155 days; in Denmark it is 67.", "w_src": "Sources: AstraZeneca expert interview, Junction 2026; Yle MOT 2026 (Kuittinen et al., unpublished study).", "tech_h": "Technical basis", "tech1": "Through Kanta Services' interface for wellbeing apps, patients can, with their own permission, fetch their patient records into the app: for example diagnoses, lab and imaging results, and care plans.", "tech2": "The interface requires security certification. Passing the data on to the professional view requires separate, explicit consent from the patient.", "tech3": "The first version of the concept writes nothing into the patient record system. It is a read-only view opened with the patient's permission.", "tech_src": "Source: Kela, Kanta Services, Wellbeing app interface: service description for app vendors (11 June 2026).", "pilot_h": "Interested in a pilot?", "pilot_p": "We are looking for a health centre or wellbeing services county that wants to try the view. Tell us what your biggest bottleneck is.", "note": "This is not a real service yet but a concept made at the Junction 2026 hackathon. The data in the view is fictional.", "nav_dm": "For decision-makers", "priv": "Privacy notice", "about": "About us", "rg_h": "Regional view: where is lung cancer mortality higher than expected?", "rg_p": "Choose a wellbeing services county. Figures are calculated from Statistics Finland's causes of death 2021–2025 and adjusted for the region's age structure.", "rg_sel": "Wellbeing services county", "rg_k1": "deaths compared with expected", "rg_k2": "lung cancer deaths 2021–2025", "rg_k3": "rank among 22 regions (1 = highest mortality)", "rg_over": "more than expected", "rg_under": "fewer than expected", "rg_exp": "expected", "rg_ci": "95% confidence interval", "rg_sig": "The difference from the national level is statistically significant.", "rg_nosig": "The difference from the national level is not statistically significant.", "rg_chart": "All regions (1.0 = national level)", "ai_h": "AI analyst", "ai_p": "The analyst explains the region's gap: what it is, what national evidence says about delays, and what is not yet known about the region. It uses only the sources on this site and cites the source after every claim. Recommendations are made by Polku Labs, not by AI.", "ai_btn": "Explain this region's gap", "ai_q": "Or ask your own question", "ai_ph": "E.g. What is known about the delays?", "ai_ask": "Ask", "ai_wait": "The analyst is writing…", "ai_err": "The analyst is not available right now. Please try again in a moment.", "ai_note": "AI-generated text. Check the figures against the sources before making decisions.", "rg_src": "Sources: Statistics Finland StatFin 13u5, 11az and 11s1; calculation by Polku Labs. Cause 11 covers cancers of the larynx, trachea and lung (C32–C34). Delay data is not available by region.", "rec_h": "Polku Labs recommendation for this region", "rec_hi": "Mortality is significantly higher than the national level. We recommend: 1) prioritise the region for a risk-group screening bus pilot, measured by the share diagnosed at stage 1–2, and 2) a flag and direct imaging referral at health centres, measured by days from first visit to imaging.", "rec_mid": "Mortality does not differ significantly from the national level. We recommend starting with the lightest measures: 1) a flag and direct imaging referral at health centres, and 2) the app for symptom tracking in the patient's own language, measured by time from symptoms to first visit.", "rec_lo": "Mortality is significantly lower than the national level. We recommend no extra measures. Follow the metrics and share working practices with other regions.", "rec_rule": "The recommendation follows a rule: the region's confidence interval is compared with the national level (1.0). The measures have not been piloted yet."}};
var lang = "fi";
function apply(l){
  lang = T[l] ? l : "en";
  var t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.brand + " – " + t.nav_pro;
  document.querySelectorAll("[data-t]").forEach(function(el){ var k = el.getAttribute("data-t"); if (t[k] != null) el.textContent = t[k]; });
  try { localStorage.setItem("vayla-lang", lang); } catch (e) {}
}
var sel = document.getElementById("lang");
var start = "";
try { start = localStorage.getItem("vayla-lang") || ""; } catch (e) {}
if (!start) { start = (navigator.language || "fi").slice(0, 2); }
if (!T[start]) start = "en";
sel.value = start;
apply(start);
sel.addEventListener("change", function(){ apply(sel.value); });
var RG = [], rgCur = null;
function fmt(n){ return String(n).replace(".", lang === "en" ? "." : ","); }
function renderRegion(){
  if (!RG.length) return;
  var t = T[lang], r = RG.find(function(x){ return x.name === rgCur; }) || RG[0];
  rgCur = r.name; document.getElementById("rgSel").value = r.name;
  var pct = Math.round(Math.abs(r.smr - 1) * 100);
  document.getElementById("rgSmr").textContent = (r.smr >= 1 ? "+" : "−") + pct + " %";
  document.getElementById("rgCi").textContent = "SMR " + fmt(r.smr) + " · " + t.rg_ci + " " + fmt(r.lo) + "–" + fmt(r.hi);
  document.getElementById("rgDeaths").textContent = r.deaths;
  document.getElementById("rgExp").textContent = t.rg_exp + " " + fmt(Math.round(r.expected)) + " · " + pct + " % " + (r.smr >= 1 ? t.rg_over : t.rg_under);
  document.getElementById("rgRank").textContent = r.rank + " / " + RG.length;
  document.getElementById("rgSig").textContent = (r.lo > 1 || r.hi < 1) ? t.rg_sig : t.rg_nosig;
  document.getElementById("recT").textContent = r.lo > 1 ? t.rec_hi : (r.hi < 1 ? t.rec_lo : t.rec_mid);
  var box = document.getElementById("rgBars"); box.textContent = "";
  RG.forEach(function(x){
    var row = document.createElement("div"); row.className = "rb2" + (x.name === r.name ? " on" : "");
    var n = document.createElement("span"); n.textContent = x.name.replace(" hyvinvointialue", "").replace("Helsingin kaupunki", "Helsinki");
    var tr = document.createElement("div"); tr.className = "t";
    var f = document.createElement("div"); f.className = "f"; f.style.width = Math.min(100, x.smr / 1.5 * 100) + "%";
    var mk = document.createElement("div"); mk.className = "m"; tr.appendChild(f); tr.appendChild(mk);
    var v = document.createElement("b"); v.textContent = fmt(x.smr);
    row.appendChild(n); row.appendChild(tr); row.appendChild(v);
    row.addEventListener("click", function(){ rgCur = x.name; clearAi(); renderRegion(); });
    box.appendChild(row);
  });
}
function clearAi(){ document.getElementById("aiOut").classList.add("hidden"); document.getElementById("aiNote").classList.add("hidden"); }
var aiBusy = false;
async function askAi(question){
  if (aiBusy || !rgCur) return;
  aiBusy = true;
  var out = document.getElementById("aiOut"), t = T[lang];
  out.classList.remove("hidden"); out.textContent = t.ai_wait; document.getElementById("aiNote").classList.add("hidden");
  try {
    var res = await fetch("/api/analyst", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ region: rgCur, lang: lang, question: question || "" }) });
    if (!res.ok) throw new Error("fail");
    var d = await res.json(); if (!d.text) throw new Error("empty"); out.textContent = d.text; document.getElementById("aiNote").classList.remove("hidden");
  } catch (e) { out.textContent = t.ai_err; }
  aiBusy = false;
