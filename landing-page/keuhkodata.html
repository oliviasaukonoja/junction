<!DOCTYPE html>
<html lang="fi" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polku hoitoon – Keuhkodata</title>
<meta name="description" content="Keuhkosyöpä Suomessa julkisen datan valossa: kuolleisuus, alue-erot, viiveet ja seulonnan osallistuminen hyvinvointialueittain. Polku hoitoon, Junction 2026.">
<meta property="og:title" content="Polku hoitoon – Keuhkodata">
<meta property="og:description" content="Missä keuhkosyövän hoitopolku eriarvoistuu? Avoin data hyvinvointialueittain, suositukset ja lähteet.">
<meta property="og:type" content="website">
<link href="/fonts/fonts.css" rel="stylesheet">
<script src="/vendor/chart.umd.js"></script>
<link href="/site.css" rel="stylesheet">
<style>
/* Keuhkodata. System: /site.css. Chart colours: validated with the dataviz checker (men/women vs #FFFFFF). */
:root{--grid:#E3E6E6;--men:#2BA39A;--women:#E39A2D;--total:#0F1A24;--edu-low:#1D7C75;--edu-mid:#2BA39A;--edu-high:#A6DAD4;
  --bar:#B5BCBF;--hi:var(--worse);--lo:var(--better);--mid:#B5BCBF;--neutral:#B5BCBF;--neutral2:#8A9195;--neutral3:#5B6670}
main{padding-bottom:var(--s10)}
.navbar{display:none}

/* band: overview hero with the 3D map, or a step header */
.kband{padding:0}
.kband .wrap{position:relative}
.ovhead{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--s4);align-items:stretch;min-height:min(760px,calc(100vh - 64px))}
.ovtext{padding:var(--s10) 0 var(--s8);display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2}
.ovtext h1{font-size:clamp(32px,3.2vw,46px);max-width:17ch}
.headline{margin:var(--s5) 0 0;padding:0;list-style:none;display:grid;gap:0;max-width:30em}
.hl{display:grid;grid-template-columns:128px 1fr;column-gap:var(--s3);padding:var(--s2) 0;border-top:1px solid var(--on-ink-line)}
.hl:last-child{border-bottom:1px solid var(--on-ink-line)}
@media (max-width:640px){.hl{grid-template-columns:1fr}.hl .v{grid-row:auto;margin-bottom:4px}}
.hl .v{grid-row:span 2;font-size:28px;font-weight:600;line-height:1.1;color:var(--on-ink);letter-spacing:-.01em;white-space:nowrap}
.hl.worse .v{color:var(--worse)}
.hl .l{font-size:15px;line-height:1.45;color:var(--on-ink)}
.hl .s{font-family:var(--mono);font-size:11.5px;color:var(--on-ink-2);margin-top:4px}
.globe{position:relative;display:flex;flex-direction:column;margin-inline-end:calc(-1 * max(var(--s4), (100vw - var(--wrap)) / 2 + var(--s4)))}
.globe .stage{position:relative;flex:1;min-height:560px}
.globe canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.globe .still{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center}
.globe .stage.is-still{flex:none;aspect-ratio:6/7;height:auto;min-height:0;max-height:none;width:min(100%,600px);margin-inline:auto}
.globe .lbl{position:absolute;transform:translate(-50%,calc(-100% - 10px));pointer-events:none;white-space:nowrap;text-align:center;opacity:0;transition:opacity .4s var(--ease)}
.globe .lbl.on{opacity:1}
.globe .lbl{background:rgba(255,255,255,.94);border:1px solid var(--on-ink-line);border-radius:2px;padding:4px 8px}
.globe .lbl b{display:block;font-size:13px;font-weight:600;color:var(--on-ink);line-height:1.3}
.globe .lbl span{display:block;font-family:var(--mono);font-size:11.5px;color:var(--on-ink-2)}
.globe .lbl[data-h=HVA01]{transform:translate(-100%,8px)}
.globe .lbl[data-h=HVA10]{transform:translate(4px,calc(-100% - 6px))}
.globe .lbl[data-h=HVA06]{transform:translate(-100%,calc(-100% - 6px))}
.mapcap{position:relative;z-index:2;max-width:52ch;margin:0 var(--s4) var(--s5) 0;font-size:13px;line-height:1.5;color:var(--on-ink-2)}
.mapcap .key{display:flex;flex-wrap:wrap;gap:4px var(--s2);margin-bottom:6px;color:var(--on-ink)}
.mapcap .key i{display:inline-block;width:10px;height:10px;margin-inline-end:6px;vertical-align:-1px}
.mapcap .src{color:var(--on-ink-2);display:block;margin-top:6px}
@media (max-width:900px){
  .ovhead{grid-template-columns:1fr;min-height:0;gap:0}
  .ovtext{display:contents}
  .ovtext h1{padding-top:var(--s6)}
  .ovtext .lead{margin-bottom:var(--s2)}
  .globe{order:2}
  .headline{order:3;margin:0 0 var(--s6)}
  .globe{margin-inline:calc(-1 * var(--s2))}
  .globe .stage{flex:none;min-height:0;height:min(118vw,560px)}
  .mapcap{margin:0 var(--s2) var(--s5);max-width:none}
}
/* ---- one dashboard: region brief + 3D map ---- */
.ovhead{align-items:start}
.ovtext{justify-content:flex-start;padding:var(--s8) 0 var(--s8)}
.ovtext h1{font-size:clamp(28px,2.6vw,40px);max-width:20ch}
.ovtext .lead{font-size:17px;max-width:34em}
.globe{position:sticky;top:64px;height:calc(100vh - 64px);min-height:560px}
.globe .stage{min-height:0}
.globe .hint{position:absolute;left:50%;top:var(--s3);transform:translateX(-50%);font-size:13px;color:var(--sec);background:rgba(255,255,255,.9);padding:6px 10px;border:1px solid var(--line);border-radius:999px;pointer-events:none;white-space:nowrap;transition:opacity .4s}
.globe .lbl.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.regpick{margin:var(--s4) 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1)}
.regpick label{font-size:13px;color:var(--sec);font-weight:500;width:100%}
.regpick select{min-height:44px;font-size:16px;min-width:240px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:14px;min-height:36px;padding:0 12px;border:1px solid var(--line-2);background:#fff;border-radius:999px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chips button i{width:8px;height:8px;border-radius:50%;background:var(--worse)}
.chips button[aria-pressed=true]{border-color:var(--ink);background:var(--surf-2)}
.brief{margin-top:var(--s3);border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;overflow:hidden}
.brief.swap{animation:briefin .45s var(--ease)}
@keyframes briefin{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s1) var(--s2);padding:var(--s3) var(--s3) var(--s2);border-bottom:1px solid var(--line)}
.bhead h2{font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:-.01em}
.verdict{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid}
.verdict i{width:9px;height:9px;border-radius:50%;background:currentColor}
.verdict.bus{color:#8A5A12;background:#FBF0DF;border-color:#F0D2A2}
.verdict.hosp{color:var(--accent-d);background:var(--accent-t);border-color:#A9DBD5}
.verdict.watch{color:#9B2318;background:var(--worse-t);border-color:#F2BDB7}
.verdict.none{color:var(--sec);background:var(--surf-2);border-color:var(--line)}
.verdict.low{color:#1F4E86;background:var(--better-t);border-color:#C3D6EE}
.brow{display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 var(--s2);padding:var(--s3);border-bottom:1px solid var(--line)}
.brow:last-of-type{border-bottom:0}
.brow .n{font-family:var(--serif);font-size:28px;line-height:1;color:var(--teal)}
.brow h3{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--sec);margin:4px 0 var(--s1)}
.brow .big{font-size:34px;font-weight:600;line-height:1.05;letter-spacing:-.02em}
.brow .big.w{color:var(--worse)}.brow .big.b{color:var(--better)}
.brow p{margin:6px 0 0;font-size:15px;line-height:1.5}
.brow .s{font-family:var(--mono);font-size:11.5px;color:var(--sec);margin-top:6px}
.brow .s a{color:inherit}
.ci{position:relative;height:28px;margin:var(--s2) 0 4px}
.ci .ax{position:absolute;left:0;right:0;top:13px;height:2px;background:var(--line)}
.ci .one{position:absolute;top:2px;bottom:2px;width:1px;background:var(--ink)}
.ci .one span{position:absolute;top:-16px;left:4px;font-family:var(--mono);font-size:11px;color:var(--sec);white-space:nowrap}
.ci .rng{position:absolute;top:9px;height:10px;border-radius:5px;opacity:.28}
.ci .pt{position:absolute;top:6px;width:16px;height:16px;border-radius:50%;margin-left:-8px;border:3px solid #fff;box-shadow:0 0 0 1px rgba(15,26,36,.2)}
.path3{display:flex;height:30px;border-radius:4px;overflow:hidden;margin:var(--s2) 0 4px;font-size:12px;font-weight:600;color:#fff}
.path3 div{display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden}
.path3 .p1{background:var(--worse)}.path3 .p2{background:#E8574B}.path3 .p3{background:#B5BCBF;color:var(--ink)}
.pathlbl{display:flex;font-size:12px;color:var(--sec)}
.pathlbl div{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-inline-end:6px}
.dk{height:10px;border-radius:3px;background:var(--teal);margin-top:10px}
.dkl{font-size:12px;color:var(--sec);margin-top:3px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px var(--s2);margin-top:var(--s2);font-size:14px;align-items:center}
.cmp .bar{grid-column:1/-1;height:6px;background:var(--surf-3);border-radius:3px;position:relative;margin-bottom:6px}
.cmp .bar b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink)}
.cmp .bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--amber)}
.cmp .v{font-variant-numeric:tabular-nums;font-weight:600}
.cmp .v small{font-weight:400;color:var(--sec)}
.act{background:var(--surf-2)}
.act .who{display:grid;grid-template-columns:auto 1fr;gap:6px var(--s2);margin:var(--s2) 0 0;font-size:14.5px}
.act .who dt{color:var(--sec)}.act .who dd{margin:0}
.act .go{display:flex;flex-wrap:wrap;gap:var(--s1);margin-top:var(--s2)}
.ask{padding:var(--s3);border-top:1px solid var(--line);background:#fff}
.ask h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.ask h3 i{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px var(--accent-t)}
.ask .qs{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s1)}
.ask .qs button{font:inherit;font-size:14px;text-align:start;min-height:36px;padding:6px 12px;border:1px solid var(--line-2);background:#fff;border-radius:var(--r);cursor:pointer;color:var(--ink)}
.ask .qs button:hover{border-color:var(--ink)}
.ask form{display:flex;gap:var(--s1);margin-top:var(--s1)}
.ask form input{flex:1;min-width:0}
.ask .out{margin-top:var(--s2);font-size:15px;line-height:1.6;white-space:pre-wrap;border-inline-start:3px solid var(--teal);padding:2px 0 2px var(--s2)}
.ask .out.err{border-color:var(--line-2);color:var(--sec)}
.ask .out .q{display:block;font-size:13px;color:var(--sec);margin-bottom:4px}
.ask .note2{font-size:12.5px;color:var(--sec);margin-top:var(--s1)}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:dot 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
.natl{padding:var(--s8) 0 var(--s4)}
.natl h2{margin-bottom:var(--s3)}
.natl .headline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 var(--s4);max-width:none;margin:0}
.natl .hl{grid-template-columns:1fr;border-bottom:1px solid var(--line)}
.natl .hl .v{grid-row:auto;margin-bottom:6px}
.lib{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:var(--s4) 0 0}
.lib summary{min-height:56px;display:flex;align-items:center;font-weight:600;font-size:16px;gap:10px}
.lib summary::before{content:"+";font-family:var(--mono);color:var(--teal);font-size:18px}
.lib[open] summary::before{content:"–"}
.libp{color:var(--sec);font-size:15px;max-width:60ch}
.libbtns{display:flex;flex-wrap:wrap;gap:var(--s1);padding-bottom:var(--s3)}
.libbtns button{font:inherit;font-size:15px;min-height:44px;padding:0 16px;border:1px solid var(--line-2);background:#fff;border-radius:var(--r);cursor:pointer}
.libbtns button:hover{border-color:var(--ink)}
@media (max-width:900px){
  .globe{position:relative;top:auto;height:auto;min-height:0}
  .regpick{order:2;margin-bottom:var(--s2)}
  .globe{order:3}
  .brief{order:4;margin-bottom:var(--s4)}
  .natl .headline{grid-template-columns:1fr}
  .bhead h2{font-size:26px}
}
@media (prefers-reduced-motion:reduce){.brief.swap{animation:none}.dots i{animation:none}}

.stephead{padding:var(--s8) 0 var(--s6);display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:var(--s4);align-items:start}
.stephead .no{font-family:var(--serif);font-size:clamp(56px,7vw,96px);line-height:.85;color:var(--accent-l);font-variant-numeric:lining-nums}
.stephead .no small{font-family:var(--mono);font-size:12px;color:var(--on-ink-2);display:block;margin-top:var(--s1);letter-spacing:0}
.stephead h1{font-size:clamp(32px,3.6vw,48px)}
.stephead .lead{margin-top:var(--s2)}
.stephead .back{grid-column:1/-1;margin:0 0 var(--s4);font-size:15px}
.stephead .mapbtn{margin-top:var(--s3)}
@media (max-width:640px){.stephead{padding:var(--s5) 0 var(--s4);column-gap:var(--s2)}}

/* overview: the four steps */
.stepcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:0 0 var(--s6);border-top:1px solid var(--ink)}
.stc{font:inherit;text-align:start;color:var(--ink);background:none;border:0;border-inline-end:1px solid var(--line);padding:var(--s3) var(--s3) var(--s4);cursor:pointer;display:flex;flex-direction:column;gap:var(--s1);position:relative;transition:background-color .3s var(--ease)}
.stc:last-child{border-inline-end:0}
.stc::before{content:"";position:absolute;inset-inline:0;top:-1px;height:3px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
[dir=rtl] .stc::before{transform-origin:right}
.stc:hover{background:var(--sheet)}.stc:hover::before,.stc:focus-visible::before{transform:scaleX(1)}
.stc .num{font-family:var(--serif);font-size:44px;line-height:1;color:var(--accent);margin-bottom:var(--s1)}
.stc h3{font-size:19px}
.stc p{margin:0;font-size:15px;line-height:1.5;color:var(--sec);flex:1}
.stc .open{margin-top:var(--s2);font-weight:600;font-size:15px;color:var(--accent)}
.stc.dark .num{color:var(--ink)}
.stc.dark{background:var(--accent-t)}
.stc.dark:hover{background:#D6E5E5}
@media (max-width:900px){.stepcards{grid-template-columns:1fr 1fr}.stc:nth-child(2){border-inline-end:0}.stc:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:560px){.stepcards{grid-template-columns:1fr}.stc{border-inline-end:0;border-bottom:1px solid var(--line);padding:var(--s3) 0}.stc.dark{padding-inline:var(--s2)}}
#pg-ov{padding-top:var(--s8)}
.ovintro{font-family:var(--serif);font-size:clamp(22px,2.2vw,28px);line-height:1.35;max-width:36ch;margin:0 0 var(--s5)}

/* area snapshot + AI analyst */
.areapanel{display:grid;grid-template-columns:1.1fr 1fr;gap:var(--s3);margin:0 0 var(--s5)}
@media(max-width:780px){.areapanel{grid-template-columns:1fr}}
.snap{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s3);font-size:15px}
.snap>b{font-size:19px;font-weight:600}
.snap ul{margin:var(--s1) 0 0;padding-inline-start:18px}.snap li{margin:4px 0}
.ai{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s3)}
.ai button{font:inherit;font-size:15px;font-weight:600;min-height:44px;padding:0 18px;border:1px solid var(--accent);background:none;color:var(--accent);border-radius:var(--r);cursor:pointer}
.ai button:hover{background:var(--accent);color:#fff}.ai button[disabled]{opacity:.5;cursor:wait}
.aihint{display:block;margin-top:var(--s1);font-size:13px;color:var(--sec)}
#aiout{display:none;margin-top:var(--s2);white-space:pre-wrap;font-size:15px;line-height:1.6;border-top:1px solid var(--line);padding-top:var(--s2)}
#aiout.on{display:block}

/* step pages: views */
#pg-v{padding-top:var(--s6)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,540px),1fr));gap:var(--s3)}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s3) var(--s3) var(--s2);display:flex;flex-direction:column;min-width:0}
.card.wide{grid-column:1/-1}
.card h2{font-size:20px;line-height:1.3;display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1)}
.card .sub{color:var(--sec);font-size:14px;margin:6px 0 var(--s2)}
.keymsg{font-family:var(--serif);font-size:20px;line-height:1.4;margin:0 0 var(--s2);max-width:46ch;color:var(--ink)}
.chartbox{position:relative;height:300px}
.chartbox.tall{height:540px}
.foot{display:flex;justify-content:space-between;gap:var(--s2);align-items:flex-end;margin-top:var(--s2);padding-top:var(--s1);border-top:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--sec)}
.foot a{color:var(--sec)}
.foot button{font:inherit;font-family:var(--sans);font-size:13px;font-weight:500;min-height:36px;border:1px solid var(--line-2);background:none;color:var(--ink);border-radius:var(--r);padding:0 12px;cursor:pointer;white-space:nowrap}
.foot button:hover{border-color:var(--ink)}
.note{font-size:14.5px;color:var(--ink);margin-top:var(--s2);max-width:72ch}
.tbl{margin-top:var(--s2)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:end;padding:8px 10px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:start}
th{color:var(--sec);font-weight:500;font-size:13px}
.tablewrap{max-height:320px;overflow:auto}
.dot{display:inline-block;width:10px;height:10px;margin-inline-end:6px}
.empty{text-align:center;color:var(--sec);padding:var(--s8) 0}

/* key figures */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 var(--s3)}
@media(max-width:780px){.tiles{grid-template-columns:1fr 1fr}}
.tile{border-top:1px solid var(--line);padding:var(--s2) 0 var(--s3)}
.tile .v{font-size:30px;font-weight:600;line-height:1.1;color:var(--ink)}
.tile .l{font-size:14.5px;margin-top:6px}
.tile .s{font-family:var(--mono);font-size:11.5px;color:var(--sec);margin-top:var(--s1)}

/* care pathway */
.steps{list-style:none;margin:var(--s1) 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}
@media(max-width:900px){.steps{grid-template-columns:1fr 1fr}}@media(max-width:560px){.steps{grid-template-columns:1fr}}
.step{border-top:1px solid var(--line-2);padding-top:var(--s2)}
.step.gap{border-top:3px solid var(--ink)}
.step.na{border-top:1px dashed var(--line-2)}
.sh{display:flex;align-items:center;gap:var(--s1);font-size:13px;font-weight:500;color:var(--sec)}
.step.gap .stl{color:var(--ink);font-weight:600}
.sn{font-family:var(--serif);font-size:22px;line-height:1;color:var(--accent);min-width:18px}
.step h3{font-size:17px;margin:var(--s1) 0 var(--s1)}
.si{padding:var(--s1) 0;border-top:1px solid var(--line)}
.sv{font-size:22px;font-weight:600;line-height:1.2;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
.sv small{font-size:13px;font-weight:400;color:var(--sec)}
.sm{font-size:14px;margin-top:2px}.sc{font-family:var(--mono);font-size:11.5px;color:var(--sec);margin-top:4px}

/* recommendations */
.reco-card{background:var(--sheet)}
.reco{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}

const SOURCES = {
 fi:`<h2>Mistä data tulee</h2><ul>
 <li><b>Tilastokeskus, kuolemansyytilasto</b>: taulukot 11ay, 11be ja 13u5, haettu suoraan rajapinnasta.</li>
 <li><b>Ikävakioitu SMR</b>: Polku Labsin laskelma Tilastokeskuksen taulukoista 13u5, 11az ja 11s1 (epäsuora ikävakiointi kansallisilla ikäryhmäkohtaisilla kuolleisuuksilla).</li>
 <li><b>THL Sotkanet</b>: tupakointi-indikaattorit 4404–4410, haettu suoraan rajapinnasta.</li>
 <li><b>Syöpärekisterin seulontatilastot 2024</b>: osallistuminen alueittain, kielen ja koulutuksen mukaan, luettu suoraan tilastotaulukoista (Polku Labs, ct-sim).</li>
 <li><b>Riskiryhmäarvio</b>: Polku Labsin arvio, THL Sotkanet 4405/4406 × oletettu kerroin. CT-paikkakunnat ovat tiimin selvittämä lista (36 paikkakuntaa, 24 vahvistettu), eivät virallinen rekisteri.</li>
 <li><b>Syöpärekisteri</b>: Syöpä 2022 ja keuhkosyöpäraportti, luvut <a href="https://www.filha.fi/wp-content/uploads/2026/05/Valtakunnallinen-keuhkosyopaohjelma-2026-2035_180526_preprint.pdf">Valtakunnallisesta keuhkosyöpäohjelmasta 2026–2035</a>.</li>
 <li><b>Yle MOT 2026</b>: <a href="https://yle.fi/a/74-20251023">viive oireista hoitoon</a> (julkaisematon tutkimus neljästä sairaalasta).</li>
 <li><b>ECIS/OECD</b>: <a href="https://cancer-inequalities.jrc.ec.europa.eu/sites/default/files/docs/ccp2025/ec-oecd-2024-1666-fi.pdf">Syöpäprofiilit 2025 – Suomi</a>.</li>
 <li><b>IHE Cancer Dashboard Finland 2026</b>: pohjoismainen elossaolo tiimin muistiinpanojen kautta, ei tarkistettu uudelleen.</li></ul>
 <h2>Merkinnät</h2><ul><li><span class="tag S">S</span> julkinen lähde</li><li><span class="tag N">N</span> tiimin muistiinpanot tai asiantuntijahaastattelu, ei tarkistettu uudelleen</li><li><span class="tag A">A</span> oletus tai välillinen arvio</li></ul>
 <h2>Rajoitukset</h2><ul>
 <li>Tilastokeskuksen aikasarja ja alueluvut käyttävät ryhmää C32–C34 (sisältää kurkunpään syövän). Lukumäärät ja ikäryhmät ovat pelkkää keuhkosyöpää (C34).</li>
 <li>Alueellisia tietoja levinneisyydestä, oireista diagnoosiin kuluvasta ajasta tai CT-jonoista ei ole julkisesti saatavilla.</li>
 <li>Riskiryhmäarvio perustuu oletettuun kertoimeen, koska suomalaista askivuosidataa ei löytynyt.</li>
 <li>Syöpärekisterin, ECIS:n ja NORDCANin sovelluksia ei voitu hakea suoraan; luvut on poimittu julkaistuista raporteista.</li></ul>`,
 sv:`<h2>Varifrån data kommer</h2><ul>
 <li><b>Statistikcentralen, dödsorsaksstatistik</b>: tabellerna 11ay, 11be och 13u5, hämtade direkt via API.</li>
 <li><b>Åldersstandardiserad SMR</b>: Polku Labs beräkning från Statistikcentralens tabeller 13u5, 11az och 11s1 (indirekt åldersstandardisering med nationella åldersspecifika dödstal).</li>
 <li><b>THL Sotkanet</b>: rökindikatorerna 4404–4410, hämtade direkt via API.</li>
 <li><b>Cancerregistrets screeningstatistik 2024</b>: deltagande per område, språk och utbildning, läst direkt ur statistiktabellerna (Polku Labs, ct-sim).</li>
 <li><b>Uppskattad riskgrupp</b>: Polku Labs uppskattning, THL Sotkanet 4405/4406 × antagen faktor. Orterna med CT är teamets egen lista (36 orter, 24 bekräftade), inget officiellt register.</li>
 <li><b>Cancerregistret</b>: Cancer 2022 och lungcancerrapporten, siffror ur <a href="https://www.filha.fi/wp-content/uploads/2026/05/Valtakunnallinen-keuhkosyopaohjelma-2026-2035_180526_preprint.pdf">Nationella lungcancerprogrammet 2026–2035</a>.</li>
 <li><b>Yle MOT 2026</b>: <a href="https://yle.fi/a/74-20251023">fördröjning från symtom till behandling</a> (opublicerad studie från fyra sjukhus).</li>
 <li><b>ECIS/OECD</b>: <a href="https://cancer-inequalities.jrc.ec.europa.eu/sites/default/files/docs/ccp2025/ec-oecd-2024-1666-fi.pdf">Cancerprofiler 2025 – Finland</a>.</li>
 <li><b>IHE Cancer Dashboard Finland 2026</b>: nordisk överlevnad via teamets anteckningar, inte omkontrollerat.</li></ul>
 <h2>Märkningar</h2><ul><li><span class="tag S">S</span> offentlig källa</li><li><span class="tag N">N</span> teamets anteckningar eller expertintervju, inte omkontrollerat</li><li><span class="tag A">A</span> antagande eller indirekt uppskattning</li></ul>
 <h2>Begränsningar</h2><ul>
 <li>Statistikcentralens tidsserie och regionala siffror använder gruppen C32–C34 (inkluderar struphuvudcancer). Antal och åldersgrupper gäller enbart lungcancer (C34).</li>
 <li>Regionala data om stadium, tid från symtom till diagnos eller CT-köer finns inte offentligt.</li>
 <li>Riskgruppsuppskattningen bygger på en antagen faktor, eftersom finländska paketårsdata inte hittades.</li>
 <li>Cancerregistrets, ECIS och NORDCANs applikationer kunde inte läsas direkt; siffrorna kommer ur publicerade rapporter.</li></ul>`,
 en:`<h2>Where the data comes from</h2><ul>
 <li><b>Statistics Finland, causes of death</b>: tables 11ay, 11be and 13u5, read directly from the API.</li>
 <li><b>Age-standardised SMR</b>: Polku Labs calculation from Statistics Finland tables 13u5, 11az and 11s1 (indirect standardisation with national age-specific rates).</li>
 <li><b>THL Sotkanet</b>: smoking indicators 4404–4410, read directly from the API.</li>
 <li><b>Finnish Cancer Registry screening statistics 2024</b>: participation by county, language and education, read directly from the statistics tables (Polku Labs, ct-sim).</li>
 <li><b>High-risk group estimate</b>: Polku Labs estimate, THL Sotkanet 4405/4406 × an assumed factor. CT towns are the team's researched list (36 towns, 24 confirmed), not an official register.</li>
 <li><b>Finnish Cancer Registry</b>: Cancer 2022 and the lung cancer report, figures from the <a href="https://www.filha.fi/wp-content/uploads/2026/05/Valtakunnallinen-keuhkosyopaohjelma-2026-2035_180526_preprint.pdf">National Lung Cancer Programme 2026–2035</a>.</li>
 <li><b>Yle MOT 2026</b>: <a href="https://yle.fi/a/74-20251023">delay from symptoms to treatment</a> (unpublished study in four hospitals).</li>
 <li><b>ECIS/OECD</b>: <a href="https://cancer-inequalities.jrc.ec.europa.eu/sites/default/files/docs/ccp2025/ec-oecd-2024-1666-fi.pdf">Country Cancer Profile 2025 – Finland</a>.</li>
 <li><b>IHE Cancer Dashboard Finland 2026</b>: Nordic survival via team notes, not re-verified.</li></ul>

    spec.data.datasets[0].backgroundColor=spec.codes.map(c=>HI.has(c)?css('--hi'):css('--bar'));

function setRegion(c){

function ciBar(S){
  const lo=.7,hi=1.45,X=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));
  const col=S[2]>1?'var(--worse)':S[3]<1?'var(--better)':'#8A9195';
  return `<div class="ci" aria-hidden="true"><div class="ax"></div><div class="one" style="left:${X(1)}%"><span>${B().nat}</span></div><div class="rng" style="left:${X(S[2])}%;width:${X(S[3])-X(S[2])}%;background:${col}"></div><div class="pt" style="left:${X(S[1])}%;background:${col}"></div></div>`;
}
function cmp(label,v,nat,max,unit){
  const vv=v==null?'–':f1(v)+unit,nn=f1(nat)+unit;
  return `<div>${label}</div><div class="v">${pc(vv)} <small>· ${B().natl} ${pc(nn)}</small></div><div class="bar"><b style="width:${v==null?0:Math.min(100,v/max*100)}%"></b><u style="left:${Math.min(100,nat/max*100)}%"></u></div>`;
}

async function askAI(question,label){
  const out=document.getElementById('askO');if(!out)return;const my=++aiSeq;
  out.className='out';out.innerHTML=`<span class="q">${esc2(label)}</span><span class="dots"><i></i><i></i><i></i></span>`;
  try{
    const r=await fetch('/api/analyst',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({region:REGNAME(REG),lang,question})});
    if(my!==aiSeq)return;
    if(r.status===503){out.className='out err';out.innerHTML=`<span class="q">${esc2(label)}</span>${B().aiOff}`;return;}
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();if(my!==aiSeq)return;
    out.innerHTML=`<span class="q">${esc2(label)}</span>`;const tx=document.createElement('span');out.appendChild(tx);
    typeOut(tx,j.text,my);
  }catch(e){if(my!==aiSeq)return;out.className='out err';out.innerHTML=`<span class="q">${esc2(label)}</span>${B().aiErr}`;}
}
function typeOut(node,text,my){let i=0;const step=()=>{if(my!==aiSeq)return;i=Math.min(text.length,i+Math.max(2,Math.round(text.length/90)));node.textContent=text.slice(0,i);if(i<text.length)requestAnimationFrame(step);};
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){node.textContent=text;return;}step();}

  const ls=document.getElementById('libSum');if(ls)ls.textContent=b.libSum;
  const lp=document.getElementById('libP');if(lp)lp.textContent=b.libP;
  const lb=document.getElementById('libbtns');if(lb){lb.innerHTML=['gap','where','who','do','src'].map(k=>`<button type="button" data-go="${k}">${b.lib[k]}</button>`).join('');lb.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));}
  const h=document.getElementById('globeHint');if(h)h.textContent=b.hint;
}
function headline(){
  const top=D.smr[0],pct=Math.round((top[1]-1)*100);
  const X={fi:[['155 pv','oireista hoidon alkuun Suomessa. Tanskassa 67.','Yle MOT 2026'],[`+${pct} %`,`enemmän keuhkosyöpäkuolemia ${nm(top[0])} alueella kuin ikärakenne ennustaa`,'Tilastokeskus, Polku Labs -laskelma'],['2,7×','yleisempi perusasteen kuin korkea-asteen koulutuksen saaneilla miehillä','Syöpärekisteri, Syöpä 2022']],
           sv:[['155 d','från symtom till behandling i Finland. I Danmark 67.','Yle MOT 2026'],[`+${pct} %`,`fler lungcancerdödsfall i ${nm(top[0])} välfärdsområde än åldersstrukturen förutsäger`,'Statistikcentralen, Polku Labs beräkning'],['2,7×','vanligare bland män med grundutbildning än med högre utbildning','Cancerregistret, Cancer 2022']],
           en:[['155 days','from symptoms to treatment in Finland. Denmark: 67.','Yle MOT 2026'],[`+${pct}%`,`more lung cancer deaths in ${nm(top[0])} than its age structure predicts`,'Statistics Finland, Polku Labs calculation'],['2.7×','more common in men with basic than with higher education','Finnish Cancer Registry, Cancer 2022']]}[lang];
  document.getElementById('headline').innerHTML=X.map((x,i)=>`<li class="hl${i===1?' worse':''}"><span class="v">${x[0]}</span><span class="l">${x[1]}</span><span class="s">${x[2]}</span></li>`).join('');
}
function go(t,s){try{history.pushState(null,'',location.href)}catch(e){}cur={t,s:s||null};render();window.scrollTo({top:0});}   // own history entry, so Back returns to the previous step
window.addEventListener('popstate',()=>{try{const h=new URLSearchParams(location.hash.slice(1));const tt=h.get('t');cur=NAV.some(n=>n.id===tt)?{t:tt,s:h.get('s')}:{t:'ov',s:null};}catch(e){cur={t:'ov',s:null}}render();});
function buildNav(pg){
  const nav=document.getElementById('mainnav');
  nav.innerHTML='';nav.closest('.navbar').classList.add('hidden');   // pilot map link lives in the shared top navigation
}

/* ---- 3D hero: Finland from 308 municipalities; significantly high SMR areas rise in red ---- */
const HERO={started:false,labels:{}};
const STILL_POS={"HVA21":[49.8,25.3],"HVA01":[62.9,89.6],"HVA10":[70.8,86.8],"HVA06":[34.7,80.7]};   // label positions (%) in /assets/finland_3d.webp (600x700 render of the settled scene)
function heroCaption(){
  const W={fi:{h:'Korkeus: keuhkosyöpäkuolemat suhteessa siihen, mitä alueen ikärakenne ennustaa (SMR 2021–2025, 1,0 = maan taso).',w:'Merkitsevästi yli maan tason',b:'Merkitsevästi alle',n:'Ei merkitsevää eroa'},
           sv:{h:'Höjd: lungcancerdödsfall i förhållande till vad områdets åldersstruktur förutsäger (SMR 2021–2025, 1,0 = riksnivå).',w:'Signifikant över riksnivån',b:'Signifikant under',n:'Ingen signifikant skillnad'},
           en:{h:'Height: lung cancer deaths relative to what each area\'s age structure predicts (SMR 2021–2025, 1.0 = national level).',w:'Significantly above the national level',b:'Significantly below',n:'No significant difference'}}[lang];
  document.getElementById('mapcap').innerHTML=`<span class="key"><span><i style="background:var(--worse)"></i>${W.w}</span><span><i style="background:var(--better)"></i>${W.b}</span><span><i style="background:#DFE3E3;outline:1px solid #CDD2D3"></i>${W.n}</span></span>${W.h} ${tagHTML('S')}<span class="src">${src(['smr'])}</span>`;
  const box=document.getElementById('globeLabels');
  D.smr.forEach(r=>{
    const show=r[2]>1||r[0]===REG;let el=HERO.labels[r[0]];
    if(!el&&!show)return;
    if(!el){el=document.createElement('div');el.className='lbl';el.dataset.h=r[0];box.append(el);HERO.labels[r[0]]=el;}
    el.innerHTML=`<b>${nmN(r[0])}</b><span>SMR ${fmt(r[1])}</span>`;
    el.classList.toggle('sel',r[0]===REG);if(HERO.on)el.classList.add('on');
    const still=document.getElementById('globe').classList.contains('is-still');el.style.display=show&&(!still||STILL_POS[r[0]])?'':'none';
  });
}
function placeLabels(list){list.forEach(p=>{const el=HERO.labels[p.hva];if(el){el.style.left=p.x+'%';el.style.top=p.y+'%';}});}
function hero3d(){
  heroCaption();
  if(HERO.started) return; HERO.started=true;
  const box=document.getElementById('globe'), still=document.getElementById('globeStill');
  const showStill=()=>{HERO.on=true;still.src=still.dataset.src;still.classList.remove('hidden');box.classList.add('is-still');placeLabels(Object.entries(STILL_POS).map(([hva,v])=>({hva,x:v[0],y:v[1]})));Object.values(HERO.labels).forEach(l=>l.classList.add('on'));};
  let gl=false;try{const c=document.createElement('canvas');gl=!!(c.getContext('webgl2')||c.getContext('webgl'));}catch(e){}
  if(!gl||matchMedia('(prefers-reduced-motion: reduce)').matches){showStill();return;}
  const start=()=>Promise.all([import('/assets/hero3d.js'),fetch('/assets/finland_3d.json').then(r=>r.json())]).then(([m,data])=>{
    const areas={};D.smr.forEach(r=>{areas[r[0]]={smr:r[1],sig:r[2]>1?'hi':(r[3]<1?'lo':'')};});
    HERO.view=m.mount(box,{data,areas,onLabels:placeLabels,onPick:setRegion,selected:REG});
    setTimeout(()=>{HERO.on=true;Object.values(HERO.labels).forEach(l=>l.classList.add('on'))},1300);
  }).catch(showStill);
  if(document.readyState==='complete') setTimeout(start,50); else addEventListener('load',()=>setTimeout(start,50),{once:true});
}
const glue = x => String(x).replace(/ (\S+ ?[→←])$/,'\u00a0$1').replace(/ ([→←])/g,'\u00a0$1');
function stephead(pg){
  const back={fi:'← Yleiskuva',sv:'← Översikt',en:'← Overview'}[lang];
  const map=pg.id==='do'?`<p style="margin:0"><a class="mapbtn" href="/kartta?county=HVA21">${glue(L({fi:'Avaa Lapin pilottikartta →',sv:'Öppna pilotkartan för Lappland →',en:'Open the pilot map for Lapland →'}))}</a></p>`:'';
  const no=pg.n?`<div class="no" aria-hidden="true">${pg.n}<small>/ 4</small></div>`:'<div></div>';
  document.getElementById('pghead').innerHTML=`<p class="back"><a href="#t=ov" data-back>${back}</a></p>${no}<div><h1>${pg.n?`<span class="sr">${pg.n} / 4. </span>`:''}${L(pg.t)}</h1>${pg.d?`<p class="lead">${L(pg.d)}</p>`:''}${map}</div>`;
  document.querySelector('#pghead [data-back]').onclick=e=>{e.preventDefault();go('ov');};
}
function stepcards(){
  const hi=D.smr.filter(r=>r[2]>1).map(r=>nmN(r[0])).join(', ');
  const b=D.scr_lang.breast,gp=fmt(Math.round((b.Domestic-b['Other/missing'])*10)/10);
  const F={gap:{fi:`Kuolleisuus on merkitsevästi koholla neljällä alueella: ${hi}.`,sv:`Dödligheten är signifikant förhöjd i fyra områden: ${hi}.`,en:`Mortality is significantly raised in four areas: ${hi}.`},
    where:{fi:'Ennen diagnoosia: potilasviive ja perusterveydenhuolto. Hoidon aloitus on pääosin ajallaan.',sv:'Före diagnos: patientfördröjning och primärvård. Behandlingen startar oftast i tid.',en:'Before diagnosis: patient delay and primary care. Treatment mostly starts on time.'},
    who:{fi:`Matalasti koulutetut ja muuta kieltä puhuvat. Seulontaan osallistuu ${gp} prosenttiyksikköä vähemmän.`,sv:`Lågutbildade och personer med annat språk. Deltagandet i screening är ${gp} procentenheter lägre.`,en:`People with less education or another language. Screening participation is ${gp} points lower.`},
    do:{fi:'Bussipilotti Lapissa, sairaalan TT-kutsut ensin Kymenlaaksossa ja Satakunnassa, ja pilottikartta, joka näyttää, missä sairaalan TT riittää ja missä tarvitaan bussia.',sv:'En busspilot i Lappland, inbjudningar till sjukhusets DT först i Kymmenedalen och Satakunta, och en pilotkarta som visar var sjukhusets DT räcker och var en buss behövs.',en:'A bus pilot in Lapland, hospital-CT invitations first in Kymenlaakso and Satakunta, and a pilot map that shows where a hospital CT is enough and where a bus is needed.'}};
  const open={fi:'Avaa',sv:'Öppna',en:'Open'}[lang];
  document.getElementById('stepcards').innerHTML=NAV.filter(n=>n.n).map(n=>`<button class="stc${n.id==='do'?' dark':''}" data-go="${n.id}"><span class="num">${n.n}</span><h3>${L(n.t)}</h3><p>${L(F[n.id])}</p><span class="open">${open}&nbsp;→</span></button>`).join('');
  document.querySelectorAll('#stepcards [data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
}
function render(){
  const pg=NAV.find(n=>n.id===cur.t)||NAV[0]; cur.t=pg.id;
  if(pg.subs){const sb=pg.subs.find(x=>x.id===cur.s)||pg.subs[0];cur.s=sb.id;selected=sb.v.slice();}else{cur.s=null;selected=[];}
  buildNav(pg); snapHTML(); syncHash(); headline();
  document.getElementById('ovhead').classList.toggle('hidden',pg.id!=='ov');
  document.getElementById('pghead').classList.toggle('hidden',pg.id==='ov');
  if(pg.id==='ov') hero3d();
  Object.values(charts).forEach(c=>c.destroy()); for(const k in charts) delete charts[k];
  document.getElementById('pg-ov').classList.toggle('hidden',pg.id!=='ov');
  document.getElementById('pg-v').classList.toggle('hidden',!pg.subs);
  document.getElementById('tab-src').classList.toggle('hidden',pg.id!=='src');
  if(pg.id==='ov'){return;}
  if(pg.id==='src'){stephead(pg);return;}
  if(!pg.subs) return;
  stephead(pg);
  const grid=document.getElementById('grid');
  const RANK={kpi:-3,smr:-2,pathway:-1,reco:999};
  const vs=selected.map(id=>VIEWS.find(v=>v.id===id)).filter(Boolean);
  const EB={smr:{fi:'1 · Mikä on ero',sv:'1 · Vad är skillnaden',en:'1 · What is the gap'},pathway:{fi:'2 · Missä kohtaa polkua',sv:'2 · Var i vårdkedjan',en:'2 · Where on the pathway'},risk:{fi:'3 · Ketä se koskee',sv:'3 · Vem det gäller',en:'3 · Who it affects'},reco:{fi:'4 · Mitä tehdään',sv:'4 · Vad gör vi',en:'4 · What to do'}};
  document.getElementById('empty').classList.toggle('hidden',vs.length>0);
  grid.innerHTML=vs.map(v=>{
    const charty=!v.kind||v.kind==='smr';
    return `<div class="card${(v.wide||v.tall)?' wide':''}${v.id==='reco'?' reco-card':''}"><h2>${L(v.title)}${tagHTML(v.tag)}</h2>${v.sub?`<div class="sub">${L(v.sub)}</div>`:'<div class="sub"></div>'}${MSG(v)}${body(v)}${v.note?`<div class="note">${L(v.note)}</div>`:''}${v.src||charty?`<div class="foot"><span>${v.src?t('source')+': '+src(v.src):''}</span>${charty?`<button data-t2="${v.id}">${t('show')}</button>`:''}</div>`:''}</div>`;
  }).join('');
  vs.filter(v=>!v.kind||v.kind==='smr').forEach(v=>{const spec=v.kind==='smr'?smrSpec():v.chart();v._spec=spec;charts[v.id]=makeChart(document.getElementById('cv-'+v.id),spec);});
  grid.querySelectorAll('button[data-t2]').forEach(b=>b.onclick=()=>{const v=VIEWS.find(x=>x.id===b.dataset.t2);const tb=document.getElementById('tb-'+v.id);const show=tb.classList.contains('hidden');tb.innerHTML=show?tableHTML(v,v._spec):'';tb.classList.toggle('hidden',!show);b.textContent=show?t('hide'):t('show');});
}
function apply(l){
  lang=T[l]?l:'en';
  document.documentElement.lang=lang;
  document.title=T[lang].brand+' – '+{fi:'Keuhkodata',sv:'Lungdata',en:'Lung data'}[lang];
  document.querySelectorAll('[data-t]').forEach(e=>{const k=e.getAttribute('data-t');if(T[lang][k]!=null)e.textContent=T[lang][k];});
  document.querySelectorAll('[data-m]').forEach(a=>a.textContent=MT[lang][a.getAttribute('data-m')]);
  const menuBtn=document.getElementById('menuBtn');if(menuBtn)menuBtn.setAttribute('aria-label',MT[lang].menu);
  document.getElementById('sources').innerHTML=SOURCES[lang];
  try{localStorage.setItem('vayla-lang',lang)}catch(e){}
  buildArea(); buildPicker(); render();
}
document.addEventListener('click',ev=>{const d=document.querySelector('details.menu');if(d&&d.open&&!d.contains(ev.target))d.open=false;});
const sel=document.getElementById('lang'); let start='';
try{start=localStorage.getItem('vayla-lang')||''}catch(e){}
if(!start) start=(navigator.language||'fi').slice(0,2);
if(!T[start]) start='en';
sel.value=start; Chart.defaults.font.family='"Golos Text", sans-serif'; apply(start);
if(document.fonts&&document.fonts.status!=='loaded') document.fonts.ready.then(()=>render());   // charts measure labels after the web font loads
sel.addEventListener('change',()=>apply(sel.value));
</script>
