 en:`<h2>Where the data comes from</h2><ul>

 <li><b>THL Sotkanet</b>: smoking indicators 4404–4410, read directly from the API.</li>
 <li><b>Finnish Cancer Registry screening statistics 2024</b>: participation by county, language and education, read directly from the statistics tables (Polku Labs, ct-sim).</li>
 <li><b>High-risk group estimate</b>: Polku Labs estimate, THL Sotkanet 4405/4406 × an assumed factor. CT towns are the team's researched list (36 towns, 24 confirmed), not an official register.</li>

 <li><b>ECIS/OECD</b>: <a href="https://cancer-inequalities.jrc.ec.europa.eu/sites/default/files/docs/ccp2025/ec-oecd-2024-1666-fi.pdf">Country Cancer Profile 2025 – Finland</a>.</li>
 <li><b>IHE Cancer Dashboard Finland 2026</b>: Nordic survival via team notes, not re-verified.</li></ul>
 <h2>Tags</h2><ul><li><span class="tag S">S</span> public source</li><li><span class="tag N">N</span> team notes or expert interview, not re-verified</li><li><span class="tag A">A</span> assumption or indirect estimate</li></ul>
 <h2>Limitations</h2><ul>
 <li>The Statistics Finland time series and regional figures use group C32–C34 (includes laryngeal cancer). Counts and age groups are lung cancer only (C34).</li>
 <li>Regional data on stage, symptom-to-diagnosis time or CT queues is not publicly available.</li>
 <li>The high-risk group estimate relies on an assumed factor, because no Finnish pack-year data was found.</li>
 <li>The Cancer Registry, ECIS and NORDCAN applications could not be read directly; figures come from published reports.</li></ul>`

function buildPicker(){

  document.querySelectorAll('#groups input').forEach(i=>i.addEventListener('change',()=>{selected=VIEWS.map(v=>v.id).filter(id=>document.querySelector(`#groups input[value="${id}"]`).checked);save();render();}));
  document.getElementById('legendtags').innerHTML=['S','N','A'].map(k=>`<span><span class="tag ${k}" style="margin:0 4px 0 0">${k}</span>${t('tag'+k).slice(4)}</span>`).join('');

    return `<div class="tablewrap"><table><thead><tr><th>${t('area')}</th>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${D.risk.map(r=>`<tr><td>${nm(r[0])}</td><td>${fmt(r[1])}</td><td>${fmt(r[2])}</td><td>${fmt(r[4])}</td><td style="text-align:start">${r[6].join(', ')||'–'}</td></tr>`).join('')}</tbody></table></div>`;}
  const ds=spec.data.datasets;
  return `<div class="tablewrap"><table><thead><tr><th></th>${ds.map(d=>`<th>${d.label}</th>`).join('')}</tr></thead><tbody>${spec.data.labels.map((l,i)=>`<tr><td>${l}</td>${ds.map(d=>`<td>${fmt(d.data[i])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const tagHTML = k => k?`<span class="tag ${k}" title="${t('tag'+k)}" aria-label="${t('tag'+k)}" role="img">${k}</span>`:'';
function body(v){
  if(v.kind==='tiles') return `<div class="tiles">${TILES().map(x=>`<div class="tile"><div class="v">${pc(x.v)}</div><div class="l">${L(x.l)}</div><div class="s">${L(x.s)}</div></div>`).join('')}</div>`;
  if(v.kind==='pathway'){const col={true:'var(--hi)',false:'var(--total)',null:'var(--mid)'};const hd={fi:['Vaihe','Mittari','Suomi','Vertailu','Lähde'],sv:['Fas','Mått','Finland','Jämförelse','Källa'],en:['Stage','Measure','Finland','Comparison','Source']}[lang];
    return `<div class="tablewrap" style="max-height:none"><table class="ptable"><thead><tr>${hd.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${PATH.map(p=>p.items.map((it,i)=>`<tr${i===0?' class="first"':''}>${i===0?`<td class="stage" rowspan="${p.items.length}"><span class="dot" style="background:${col[p.gap]}"></span>${L(p.st)}</td>`:''}<td data-l="${hd[1]}">${L(it.m)}</td><td data-l="${hd[2]}"><b>${pc(L(it.f))}</b></td><td data-l="${hd[3]}">${L(it.c)}</td><td data-l="${hd[4]}">${tagHTML(it.tag)}</td></tr>`).join('')).join('')}</tbody></table></div>`;}
  if(v.kind==='reco'){
    const hi=D.smr.filter(r=>r[2]>1).map(r=>nm(r[0])).join(', ');
    const R={
     fi:[['Seulontabussi','Kohdista alueille, joilla keuhkosyöpäkuolleisuus on merkitsevästi maan tason yläpuolella: '+hi+'. Kohderyhmä: 50–74-vuotiaat tupakoivat ja tupakoineet.','Ida: bussi ei ole halvempi kuin sairaalan TT, ja seulontaerot seuraavat kieltä ja koulutusta enemmän kuin etäisyyttä. Siksi pilotti satunnaistettuna.'],
         ['Potilassovellus','Näkyvä hoitopolku, tekoälykäännökset ja selkokieli. Kohdistuu vaiheeseen, jossa ero syntyy: oireista ensikäyntiin (potilasviive yli 50 päivää) ja perusterveydenhuolto.','Kieli- ja koulutuserot osallistumisessa viittaavat viestinnän esteisiin, joihin käännökset vastaavat.'],
         ['Mittarit','Aika oireesta TT:hen; I–II-vaiheessa todettujen osuus (nyt 42 %, tavoite 70 %); seulontaan osallistuminen kielen ja koulutuksen mukaan.','Seurataan alueittain, jotta ero näkyy.']],
     sv:[['Screeningbuss','Rikta mot områden där lungcancerdödligheten är signifikant över riksnivån: '+hi+'. Målgrupp: rökare och tidigare rökare, 50–74 år.','Ida: bussen är inte billigare än sjukhusets DT, och screeningskillnaderna följer språk och utbildning mer än avstånd. Därför en randomiserad pilot.'],
         ['Patientapp','Synlig vårdkedja, AI-översättningar och lättläst språk. Riktas mot steget där skillnaden uppstår: från symtom till första besök (patientfördröjning över 50 dagar) och primärvård.','Språk- och utbildningsskillnader i deltagande tyder på kommunikationshinder som översättningar möter.'],
         ['Mått','Tid från symtom till DT; andel upptäckta i stadium I–II (nu 42 %, mål 70 %); screeningdeltagande per språk och utbildning.','Följs upp per område så att skillnaden syns.']],
     en:[['Screening bus','Target areas where lung cancer mortality is significantly above the national level: '+hi+'. Target group: current and former smokers aged 50–74.','Ida: the bus is not cheaper than a hospital CT, and screening gaps follow language and education more than distance. Hence a randomised pilot.'],
         ['Patient app','A visible care pathway, AI translations and plain language. Aimed at the stage where the gap forms: symptoms to first visit (patient delay over 50 days) and primary care.','Language and education gaps in participation point to communication barriers that translations address.'],
         ['Measures','Time from symptoms to CT; share found at stage I–II (now 42%, target 70%); screening participation by language and education.','Tracked by area so the gap stays visible.']]}[lang];
    return `<div class="reco">${R.map((r,i)=>`<div class="rc"><h3>${i+1}. ${r[0]}</h3><p>${r[1]}</p><p class="why">${r[2]}</p></div>`).join('')}</div>`;}
  if(v.kind==='goal3') return `<div class="goal">${GOAL3.map(x=>`<div><b>${L(x.b)} ${tagHTML(x.tag)}</b><span>${L(x.s)}</span></div>`).join('')}</div>`;
  return `<div class="chartbox${v.tall?' tall':''}"><canvas id="cv-${v.id}" role="img" aria-label="${L(v.title)}"></canvas></div><div class="tbl hidden" id="tb-${v.id}"></div>`;
}

function MSG(v){
  const f1=x=>fmt(Math.round(x*10)/10);
  let m=null;
  if(v.id==='smr'){const top=D.smr[0],n=D.smr.filter(r=>r[2]>1).length,pct=Math.round((top[1]-1)*100);
    m={fi:`${nm(top[0])} alueella keuhkosyöpään kuolee ${pct} % enemmän kuin ikärakenteen perusteella odottaisi. ${n} aluetta on merkitsevästi maan tason yläpuolella.`,
       sv:`I ${nm(top[0])} välfärdsområde dör ${pct} % fler i lungcancer än åldersstrukturen förutsäger. ${n} områden ligger signifikant över riksnivån.`,
       en:`In ${nm(top[0])}, ${pct}% more people die of lung cancer than its age structure would predict. ${n} areas are significantly above the national level.`}[lang];}
  if(v.id==='scrlang'){const b=D.scr_lang.breast,d=Math.round((b.Domestic-b['Other/missing'])*10)/10;
    m={fi:`Rintasyöpäseulontaan osallistuu ${f1(b.Domestic)} % kotimaisen äidinkielen puhujista mutta ${f1(b['Other/missing'])} % muun kielen puhujista: ero on ${f1(d)} prosenttiyksikköä.`,
       sv:`${f1(b.Domestic)} % med inhemskt modersmål deltar i bröstcancerscreeningen men ${f1(b['Other/missing'])} % med annat språk: skillnaden är ${f1(d)} procentenheter.`,
       en:`${f1(b.Domestic)}% of domestic-language speakers attend breast screening versus ${f1(b['Other/missing'])}% of other-language speakers: a gap of ${f1(d)} percentage points.`}[lang];}
  if(v.id==='smokeedu'){const i=D.smoke_edu.low.length-1,lo=D.smoke_edu.low[i],hi=D.smoke_edu.high[i],y=D.smoke_edu.years[i],r=Math.round(lo/hi*10)/10;
    m={fi:`Vuonna ${y} matalasti koulutetuista tupakoi päivittäin ${f1(lo)} %, korkeasti koulutetuista ${f1(hi)} %: noin ${f1(r)}-kertainen ero.`,
       sv:`År ${y} rökte ${f1(lo)} % av de lågutbildade dagligen mot ${f1(hi)} % av högutbildade: ungefär ${f1(r)} gånger fler.`,
       en:`In ${y}, ${f1(lo)}% of people with low education smoked daily versus ${f1(hi)}% of the highly educated: roughly ${f1(r)} times as many.`}[lang];}
  if(v.id==='nordsurv'){const a=D.nordsurv.men;
    m={fi:`Miehistä keuhkosyövästä on viiden vuoden kuluttua elossa ${a.Finland} % Suomessa, ${a.Norway} % Norjassa.`,
       sv:`Fem år efter diagnos lever ${a.Finland} % av männen i Finland men ${a.Norway} % i Norge.`,
       en:`Five years after diagnosis, ${a.Finland}% of men with lung cancer are alive in Finland versus ${a.Norway}% in Norway.`}[lang];}
  if(v.id==='delay'){m={fi:'Oireista hoidon alkuun kuluu Suomessa keskimäärin 155 päivää, Ruotsissa 107 ja Tanskassa 67.',sv:'Från symtom till behandling går i genomsnitt 155 dagar i Finland, 107 i Sverige och 67 i Danmark.',en:'From symptoms to treatment takes on average 155 days in Finland, 107 in Sweden and 67 in Denmark.'}[lang];}
  return m?`<p class="keymsg">${m}</p>`:'';
}
function buildArea(){
  const el=document.getElementById('area');
  const codes=Object.keys(D.names).sort((a,b)=>nm(a).localeCompare(nm(b),LOC[lang]));
  el.innerHTML=`<option value="">${t('area_none')}</option>`+codes.map(c=>`<option value="${c}"${c===myArea?' selected':''}>${nm(c)}</option>`).join('');
  el.onchange=()=>{myArea=el.value;try{localStorage.setItem('keuhkodata-area',myArea)}catch(e){}render();};
}
const REGNAME=c=>c==='HVA90'?'Helsingin kaupunki':(D.names[c]&&c!=='HVA91'?D.names[c].fi+' hyvinvointialue':null);
let aiFor='';
async function runAI(){
  const out=document.getElementById('aiout'),btn=document.getElementById('aibtn');
  out.className='on';out.textContent=t('ai_wait');btn.disabled=true;
  try{
    const r=await fetch('/api/analyst',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({region:REGNAME(myArea),lang,question:''})});
    if(!r.ok) throw new Error(r.status);
    const j=await r.json(); out.textContent=j.text;
  }catch(e){out.textContent=t('ai_err')}
  btn.disabled=false;
}
document.getElementById('aibtn').onclick=runAI;
function snapHTML(){
  const c=myArea,box=document.getElementById('snap');
  const ab=document.getElementById('aibox'),has=!!(c&&REGNAME(c));
  ab.classList.toggle('hidden',!has);
  if(aiFor!==c+lang){aiFor=c+lang;const o=document.getElementById('aiout');o.className='';o.textContent='';}
  if(!c){box.classList.add('hidden');return;}
  const S=D.smr.find(r=>r[0]===c),R=D.risk.find(r=>r[0]===c),K=D.smoke_reg.find(r=>r[0]===c),C=D.scr_county.find(r=>r[0]===c),M=D.region.find(r=>r[0]===c);
  const f1=x=>fmt(Math.round(x*10)/10), sg=S?(S[2]>1?{fi:'merkitsevästi yli maan tason',sv:'signifikant över riksnivån',en:'significantly above national'}[lang]:S[3]<1?{fi:'merkitsevästi alle maan tason',sv:'signifikant under riksnivån',en:'significantly below national'}[lang]:{fi:'ei merkitsevästi maan tasosta',sv:'inte signifikant skild från riksnivån',en:'not significantly different from national'}[lang]):'';
  const lab={fi:['Kuolleisuus (SMR)','Riskiryhmä (arvio)','Päivittäin tupakoivat','Seulonnan osallistuminen (rinta / suolisto / kohdunkaula)','CT-paikkakunnat'],
             sv:['Dödlighet (SMR)','Riskgrupp (uppskattning)','Dagligrökare','Screeningdeltagande (bröst / tarm / livmoderhals)','Orter med CT'],
             en:['Mortality (SMR)','Risk group (estimate)','Daily smokers','Screening participation (breast / colorectal / cervical)','CT towns']}[lang];
  const li=[];
  if(S) li.push(`${lab[0]}: <b>${fmt(S[1])}</b> (${fmt(S[2])}–${fmt(S[3])}), ${sg}`);
  if(R) li.push(`${lab[1]}: <b>${fmt(R[1])}</b>`);
  if(K) li.push(`${lab[2]}: <b>${f1(K[1])} %</b> (${t('national')}: ${f1(D.smoke_fi)} %)`);
  if(C) li.push(`${lab[3]}: <b>${[C[1],C[2],C[3]].map(x=>x==null?'–':f1(x)+' %').join(' / ')}</b>`);
  if(R) li.push(`${lab[4]}: ${R[6].join(', ')||'–'}`);
  box.innerHTML=`<b>${nm(c)}</b><ul>${li.map(x=>`<li>${lang==='en'?x.replace(/ %/g,'%'):x}</li>`).join('')}</ul>`;
  box.classList.remove('hidden');
}
function render(){
  markPre(); snapHTML();
  Object.values(charts).forEach(c=>c.destroy()); for(const k in charts) delete charts[k];
  const grid=document.getElementById('grid');
  const vs=VIEWS.filter(v=>selected.includes(v.id));
  document.getElementById('empty').classList.toggle('hidden',vs.length>0);
  grid.innerHTML=vs.map(v=>{
    const charty=!v.kind||v.kind==='smr';
    return `<div class="card${(v.wide||v.tall)?' wide':''}"><h2>${L(v.title)}${tagHTML(v.tag)}</h2>${v.sub?`<div class="sub">${L(v.sub)}</div>`:'<div class="sub"></div>'}${MSG(v)}${body(v)}${v.note?`<div class="note">${L(v.note)}</div>`:''}${v.src||charty?`<div class="foot"><span>${v.src?t('source')+': '+src(v.src):''}</span>${charty?`<button data-t2="${v.id}">${t('show')}</button>`:''}</div>`:''}</div>`;
  }).join('');
  vs.filter(v=>!v.kind||v.kind==='smr').forEach(v=>{const spec=v.kind==='smr'?smrSpec():v.chart();v._spec=spec;charts[v.id]=makeChart(document.getElementById('cv-'+v.id),spec);});
  grid.querySelectorAll('button[data-t2]').forEach(b=>b.onclick=()=>{const v=VIEWS.find(x=>x.id===b.dataset.t2);const tb=document.getElementById('tb-'+v.id);const show=tb.classList.contains('hidden');tb.innerHTML=show?tableHTML(v,v._spec):'';tb.classList.toggle('hidden',!show);b.textContent=show?t('hide'):t('show');});
}
function apply(l){
  lang=T[l]?l:'en';
  document.documentElement.lang=lang;
  document.title=T[lang].brand+' – '+{fi:'Keuhkodata',sv:'Lungdata',en:'Lung data'}[lang];
  document.querySelectorAll('[data-t]').forEach(e=>{const k=e.getAttribute('data-t');if(T[lang][k]!=null)e.textContent=T[lang][k];});
  document.querySelectorAll('[data-m]').forEach(a=>a.textContent=MT[lang][a.getAttribute('data-m')]);
  document.getElementById('menuBtn').setAttribute('aria-label',MT[lang].menu);
  document.getElementById('sources').innerHTML=SOURCES[lang];
  try{localStorage.setItem('vayla-lang',lang)}catch(e){}
  buildArea(); buildPicker(); render();
}
document.querySelectorAll('.ptabs .tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.ptabs .tab').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-selected',on);});document.getElementById('tab-dash').classList.toggle('hidden',b.dataset.tab!=='dash');document.getElementById('tab-src').classList.toggle('hidden',b.dataset.tab!=='src');});
document.addEventListener('click',ev=>{const d=document.querySelector('details.menu');if(d&&d.open&&!d.contains(ev.target))d.open=false;});
const sel=document.getElementById('lang'); let start='';
try{start=localStorage.getItem('vayla-lang')||''}catch(e){}
if(!start) start=(navigator.language||'fi').slice(0,2);
if(!T[start]) start='en';
sel.value=start; apply(start);
sel.addEventListener('change',()=>apply(sel.value));
</script>
</body>
</html>
