<!DOCTYPE html>
<html lang="fi" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polku hoitoon – Keuhkodata</title>
<meta name="description" content="Keuhkosyöpä Suomessa: missä ero on, ketä se koskee ja mitä tehdään. Tekoälyanalyytikko ja 3D-kartta hyvinvointialueittain.">
<meta property="og:title" content="Polku hoitoon – Keuhkodata">
<meta property="og:type" content="website">
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/site.css" rel="stylesheet">
<style>
main.dash{padding-bottom:var(--s8)}
.hidden{display:none!important}

/* ---- top: title + AI prompt ---- */
.top{padding:var(--s5) var(--s4) var(--s3);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:var(--s2) var(--s5);align-items:end;max-width:none}
.top h1{font-size:clamp(28px,2.6vw,40px);max-width:22ch}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin:0 0 var(--s1)}
.ask{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:999px;padding:6px 6px 6px 18px;background:#fff;box-shadow:0 10px 30px -20px rgba(15,26,36,.35);transition:border-color .2s,box-shadow .2s}
.ask:focus-within{border-color:var(--teal);box-shadow:0 0 0 4px var(--accent-t),0 10px 30px -20px rgba(15,26,36,.35)}
.ask input{flex:1;min-width:0;border:0!important;box-shadow:none!important;outline:none;min-height:44px;padding:0;font-size:17px;background:none}
.ask .btn{border-radius:999px;min-height:44px}
.brain{width:22px;height:22px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 35%,#7FD1C9,var(--teal) 55%,var(--accent-d));box-shadow:0 0 0 0 rgba(43,163,154,.45);animation:breathe 2.6s ease-in-out infinite}
.brain.think{animation:think .9s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(43,163,154,.35)}50%{box-shadow:0 0 0 8px rgba(43,163,154,0)}}
@keyframes think{0%,100%{transform:scale(1)}50%{transform:scale(.82)}}
.chips{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:14px;min-height:34px;padding:0 13px;border:1px solid var(--line-2);background:#fff;border-radius:999px;cursor:pointer;color:var(--ink)}
.chips button:hover{border-color:var(--ink)}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---- stage: AI answer | 3D map | region card ---- */
.stage{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr) minmax(320px,380px);gap:var(--s2);padding:0 var(--s4);height:calc(100vh - 64px - 40px);min-height:640px;max-height:900px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:var(--s3);overflow:auto;box-shadow:0 1px 0 rgba(15,26,36,.03)}
.mapbox{position:relative;border-radius:14px;overflow:hidden;background:#fff}
.mapbox canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.mapbox .still{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.lbl{position:absolute;transform:translate(-50%,calc(-100% - 8px));pointer-events:none;white-space:nowrap;background:rgba(255,255,255,.95);border:1px solid var(--line-2);border-radius:6px;padding:4px 8px;font-size:13px;font-weight:600;opacity:0;transition:opacity .4s}
.lbl.on{opacity:1}
.lbl small{display:block;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--sec)}
.lbl .rk{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;margin-inline-end:5px;vertical-align:-3px}
.lbl.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.lbl.mk{border-color:var(--teal)}
.legend{position:absolute;left:var(--s2);bottom:var(--s2);display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--sec);background:rgba(255,255,255,.9);padding:6px 10px;border-radius:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px;vertical-align:-1px}
.maphint{position:absolute;left:50%;top:var(--s2);transform:translateX(-50%);font-size:13px;color:var(--sec);background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:6px 12px;pointer-events:none;transition:opacity .5s}

/* AI answer */
.ai h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sec);display:flex;align-items:center;gap:8px}
.ticker{margin-top:var(--s2);font-family:var(--mono);font-size:12.5px;color:var(--sec);min-height:22px;display:flex;align-items:center;gap:8px}
.ticker .sp{width:12px;height:12px;border-radius:50%;border:2px solid var(--teal);border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
.ticker .ok{width:14px;height:14px;border-radius:50%;background:var(--teal);flex:none;display:grid;place-items:center;color:#fff;font-size:9px}
@keyframes spin{to{transform:rotate(360deg)}}
.answer{font-family:var(--serif);font-size:21px;line-height:1.38;margin:var(--s2) 0 0;min-height:3em}
.ranked{list-style:none;margin:var(--s3) 0 0;padding:0;display:grid;gap:8px}
.ranked button{width:100%;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;text-align:start;font:inherit;background:var(--surf-2);border:1px solid transparent;border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink);opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s,border-color .2s}
.ranked button.in{opacity:1;transform:none}
.ranked button:hover,.ranked button[aria-current=true]{border-color:var(--ink)}
.ranked .n{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:700}
.ranked b{font-weight:600}
.ranked span.v{font-size:12.5px;color:var(--sec)}
.ranked em{font-style:normal;font-variant-numeric:tabular-nums;font-weight:600}
.unk{margin-top:var(--s3);font-size:13.5px;color:var(--sec);line-height:1.5}

/* region card */
.card h2{font-family:var(--serif);font-weight:400;font-size:32px;letter-spacing:-.01em;line-height:1.1}
.chead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.verdict{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;padding:5px 11px;border-radius:999px}
.verdict i{width:8px;height:8px;border-radius:50%;background:currentColor}
.verdict.bus{color:#8A5A12;background:#FBF0DF}.verdict.hosp{color:var(--accent-d);background:var(--accent-t)}
.verdict.watch{color:#9B2318;background:var(--worse-t)}.verdict.none{color:var(--sec);background:var(--surf-2)}.verdict.low{color:#1F4E86;background:var(--better-t)}
.cpick{margin-top:6px}
.cpick select{min-height:36px;font-size:14px;padding-block:0;border-color:var(--line-2)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:var(--s3)}
.kpi{background:#fff;padding:14px 14px 12px}
.kpi b{display:block;font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi b.w{color:var(--worse)}.kpi b.b{color:var(--better)}
.kpi span{display:block;font-size:13px;color:var(--sec);margin-top:4px;line-height:1.35}
.cov{margin-top:var(--s3)}
.cov .row{display:grid;grid-template-columns:96px 1fr 42px;align-items:center;gap:10px;font-size:13px;margin:6px 0}
.cov .tr{height:10px;border-radius:5px;background:var(--surf-3);overflow:hidden}
.cov .tr i{display:block;height:100%;border-radius:5px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.cov .row b{text-align:end;font-variant-numeric:tabular-nums}
.act{margin-top:var(--s3);font-size:15.5px;line-height:1.5}
.cbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--s2)}
.cbtns .btn{min-height:44px}
.cbtns .btn.line{background:#fff}

/* ---- insight tiles with 3D bars ---- */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2);padding:var(--s5) var(--s4) 0;max-width:none}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:var(--s3) var(--s3) var(--s2);display:flex;flex-direction:column}
.tile .eyebrow{margin-bottom:6px}
.tile .big{font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1}
.tile .big.w{color:var(--worse)}
.tile p{font-size:14.5px;line-height:1.45;margin:8px 0 0;color:var(--ink)}
.b3{position:relative;height:230px;margin-top:auto}
.b3 canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.b3v,.b3n,.b3g{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap}
.b3v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;transition:opacity .3s}
.b3n{font-size:11.5px;color:var(--sec)}
.b3g{font-size:11.5px;color:var(--ink);font-weight:600;margin-top:16px}
.key{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sec);margin-top:8px}
.key i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px}
.flat{display:flex;align-items:flex-end;gap:10px;height:180px;margin-top:auto;padding-top:24px}
.flat div{flex:1;border-radius:4px 4px 0 0;position:relative}
.flat div span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700}
.srcline{padding:var(--s4) var(--s4) 0;font-size:12.5px;color:var(--sec);max-width:none}

@media (max-width:1180px){
  .top{grid-template-columns:1fr;padding:var(--s4) var(--s2) var(--s2)}
  .chips{grid-column:auto}
  .stage{grid-template-columns:1fr;height:auto;max-height:none;padding:0 var(--s2)}
  .mapbox{order:1;height:min(120vw,620px)}
  .ai{order:2}.card{order:3}
  .tiles{grid-template-columns:1fr 1fr;padding:var(--s4) var(--s2) 0}
  .srcline{padding:var(--s3) var(--s2) 0}
}
@media (max-width:640px){.tiles{grid-template-columns:1fr}.top h1{font-size:28px}}
@media (prefers-reduced-motion:reduce){.brain,.ticker .sp{animation:none}.ranked button{transition:none}.cov .tr i{transition:none}}
</style>
</head>

    pilot=`<div class="cov"><div class="row"><span>${L.cov[0]}</span><div class="tr"><i data-w="${h}" style="background:#9AA3A8"></i></div><b>${pc(h+' %')}</b></div><div class="row"><span>${L.cov[1]}</span><div class="tr"><i data-w="${b}" style="background:var(--amber)"></i></div><b>${pc(b+' %')}</b></div></div><p class="unk" style="margin-top:6px">${pc(L.far(far,fmt(T2.additional)))}</p>`;}
  el.innerHTML=`<div class="chead"><h2>${esc(nmN(c))}</h2><span class="verdict ${vd}"><i></i>${L.v[vd]}</span></div>
   <div class="cpick"><label class="sr" for="regSel">${L.chg}</label><select id="regSel">${opts}</select></div>
   <div class="kpis">
    <div class="kpi"><b class="${sg==='hi'?'w':sg==='lo'?'b':''}">${pc((pct>=0?'+':'−')+Math.abs(pct)+' %')}</b><span>${L.k.smr}</span></div>
    <div class="kpi"><b>${fmt(Math.round(S[4]-S[5]))}</b><span>${L.k.ex}</span></div>
    <div class="kpi"><b>${K?pc(f1(K[1])+' %'):'–'}</b><span>${L.k.sm(pc(f1(D.smoke_fi)+' %'))}</span></div>
    <div class="kpi"><b>${R?fmt(R[1]):'–'}</b><span>${L.k.rk}</span></div>
   </div>${pilot}
   <p class="act">${L.act[vd]}</p>
   <div class="cbtns">${vd==='bus'||vd==='hosp'?`<a class="btn" href="/kartta?county=${c}">${L.plan}</a>`:''}<button class="btn line" type="button" id="askReg">${esc(L.ask(nmN(c)))}</button></div>`;
  document.getElementById('regSel').onchange=e=>setRegion(e.target.value);
  document.getElementById('askReg').onclick=()=>runAI({question:L.askQ(nmN(c)),region:c});
  requestAnimationFrame(()=>el.querySelectorAll('.tr i').forEach(i=>i.style.width=i.dataset.w+'%'));
  if(anim){el.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)'});}
}
function setRegion(c){
  if(!c)return;REG=c;try{localStorage.setItem('keuhkodata-area',c)}catch(e){}
  if(VIEW)VIEW.select(c);labels();card(true);
  document.querySelectorAll('#ranked button').forEach(b=>b.setAttribute('aria-current',b.dataset.c===c));
  const h=document.getElementById('hint');if(h)h.style.opacity=0;
}

/* ---------- 3D map ---------- */
const LBL={};let POS={};
const STILL_POS={"HVA21":[49.8,25.3],"HVA01":[62.9,89.6],"HVA10":[70.8,86.8],"HVA06":[34.7,80.7]};
function labels(){
  const box=document.getElementById('labels');
  SIGN.forEach(r=>{const c=r[0],hk=HL.indexOf(c),show=r[2]>1||c===REG||hk>=0;let el=LBL[c];
    if(!el&&!show)return;
    if(!el){el=document.createElement('div');el.className='lbl';box.append(el);LBL[c]=el;}
    el.innerHTML=`${hk>=0?`<span class="rk">${hk+1}</span>`:''}${esc(nmN(c))}<small>SMR ${fmt(r[1])}</small>`;
    el.classList.toggle('sel',c===REG);el.classList.toggle('mk',hk>=0);if(HERO_ON)el.classList.add('on');
    const p=POS[c];el.style.display=show&&p?'':'none';if(p){el.style.left=p[0]+'%';el.style.top=p[1]+'%';}
  });
}
function legend(){const L=t();document.getElementById('legend').innerHTML=`<span><i style="background:var(--worse)"></i>${L.lg[0]}</span><span><i style="background:var(--better)"></i>${L.lg[1]}</span><span><i style="background:#DFE3E3"></i>${L.lg[2]}</span>`;}
function map3d(){
  const box=document.getElementById('globe'),still=document.getElementById('globeStill');
  const showStill=()=>{still.src=still.dataset.src;still.classList.remove('hidden');HERO_ON=true;POS={};Object.entries(STILL_POS).forEach(([k,v])=>POS[k]=v);labels();};
  let gl=false;try{const c=document.createElement('canvas');gl=!!(c.getContext('webgl2')||c.getContext('webgl'));}catch(e){}
  if(!gl||matchMedia('(prefers-reduced-motion: reduce)').matches){showStill();return;}
  Promise.all([import('/assets/hero3d.js'),fetch('/assets/finland_3d.json').then(r=>r.json())]).then(([m,data])=>{
    const areas={};SIGN.forEach(r=>{areas[r[0]]={smr:r[1],sig:r[2]>1?'hi':(r[3]<1?'lo':'')};});
    VIEW=m.mount(box,{data,areas,selected:REG,onPick:setRegion,onLabels:list=>{list.forEach(p=>POS[p.hva]=[p.x,p.y]);labels();}});
    if(HL.length)VIEW.mark(HL);
    setTimeout(()=>{HERO_ON=true;labels();},1300);
  }).catch(showStill);
}

/* ---------- AI analyst ---------- */
const IND={fi:{smr:'kuolleisuus',daily_smokers:'tupakointi',screening_breast:'seulontaan osallistuminen',risk_group_share:'riskiryhmä',excess_deaths:'ylikuolleisuus'},sv:{smr:'dödlighet',daily_smokers:'rökning',screening_breast:'screeningdeltagande',risk_group_share:'riskgrupp',excess_deaths:'överdödlighet'},en:{smr:'mortality',daily_smokers:'smoking',screening_breast:'screening uptake',risk_group_share:'risk group',excess_deaths:'excess deaths'}};
function stepText(st){const I=IND[lang]||IND.en,cs=(st.codes||[]).map(nmN).join(', ');
  return ({fi:{rank_regions:`Järjestää ${st.n} aluetta: ${I[st.ind]||st.ind}`,region_profile:`Avaa: ${cs}`,compare_regions:`Vertaa: ${cs}`,national_facts:'Lukee koko maan luvut'},
    sv:{rank_regions:`Rangordnar ${st.n} områden: ${I[st.ind]||st.ind}`,region_profile:`Öppnar: ${cs}`,compare_regions:`Jämför: ${cs}`,national_facts:'Läser nationella siffror'},
    en:{rank_regions:`Ranking ${st.n} regions by ${I[st.ind]||st.ind}`,region_profile:`Opening ${cs}`,compare_regions:`Comparing ${cs}`,national_facts:'Reading national figures'}}[lang]||{})[st.tool]||st.label;}
function chips(){const L=t();document.getElementById('chips').innerHTML=Object.entries(L.p).map(([k,v])=>`<button type="button" data-p="${k}" aria-pressed="${k===aiPreset}">${esc(v)}</button>`).join('');
  document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>runAI({preset:b.dataset.p}));}
async function runAI(req){
  const L=t(),my=++aiRun,brain=document.getElementById('brain'),tk=document.getElementById('ticker'),an=document.getElementById('answer'),rk=document.getElementById('ranked'),un=document.getElementById('unk');
  aiPreset=req.preset||null;document.querySelectorAll('#chips button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===aiPreset));
  brain.classList.add('think');tk.innerHTML=`<span class="sp"></span>${L.run}`;an.textContent='';rk.innerHTML='';un.textContent='';
  let j;try{const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...req,lang})});
    if(my!==aiRun)return;if(!r.ok)throw 0;j=await r.json();}catch(e){if(my!==aiRun)return;brain.classList.remove('think');tk.textContent='';an.textContent=L.off;return;}
  if(my!==aiRun)return;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,STEP=reduce?0:420;
  j.steps.forEach((st,i)=>setTimeout(()=>{if(my===aiRun)tk.innerHTML=`<span class="sp"></span>${esc(stepText(st))}`;},i*STEP));
  setTimeout(()=>{if(my!==aiRun)return;brain.classList.remove('think');
    const n=Math.max(0,...j.steps.map(s=>s.n||0));
    tk.innerHTML=`<span class="ok">✓</span>${L.done(n,j.steps.length,j.seconds<0.1?(lang==='en'?'0.1':'0,1'):String(j.seconds).replace('.',lang==='en'?'.':','))}`;
    HL=j.highlight||[];if(VIEW)VIEW.mark(HL);labels();
    if(j.select)setRegion(j.select);
    type(an,j.answer,my,()=>{
      rk.innerHTML=HL.map((c,i)=>{const S=SIGN.find(r=>r[0]===c);return `<li><button type="button" data-c="${c}" aria-current="${c===REG}"><span class="n">${i+1}</span><span><b>${esc(nmN(c))}</b><br><span class="v">${L.v[verdict(c)]}</span></span><em>${S?'SMR '+fmt(S[1]):''}</em></button></li>`;}).join('');
      rk.querySelectorAll('button').forEach((b,i)=>{b.onclick=()=>setRegion(b.dataset.c);setTimeout(()=>b.classList.add('in'),reduce?0:i*110);});
      un.textContent=(j.unknowns||[]).slice(0,1).join(' ');
    });
  },j.steps.length*STEP);
}
function type(node,text,my,done){if(matchMedia('(prefers-reduced-motion: reduce)').matches){node.textContent=text;done();return;}
  let i=0;const st=()=>{if(my!==aiRun)return;i=Math.min(text.length,i+Math.max(2,Math.round(text.length/60)));node.textContent=text.slice(0,i);if(i<text.length)requestAnimationFrame(st);else done();};st();}

/* ---------- insight tiles (3D bars) ---------- */
let B3=null;
function tiles(){
  const L=t(),el=document.getElementById('tiles'),sl=D.scr_lang,ns=D.nordsurv.men;
  const RED='#D92D20',GREY='#B5BCBF',TEAL='#2BA39A',AMB='#E39A2D',INK='#0F1A24';
  const defs=[
   {d:L.t1,max:170,bars:[{v:155,color:RED,top:'155',label:L.t1[3][0],group:0},{v:107,color:GREY,top:'107',label:L.t1[3][1],group:0},{v:67,color:TEAL,top:'67',label:L.t1[3][2],group:0}]},
   {d:L.t2,max:140,key:[[AMB,L.t2[4][0]],[TEAL,L.t2[4][1]]],bars:[{v:128.7,color:AMB,top:f1(128.7),group:0,gname:L.t2[3][0]},{v:48.5,color:TEAL,top:f1(48.5),group:0,gname:L.t2[3][0]},{v:108.1,color:AMB,top:f1(108.1),group:1,gname:L.t2[3][1]},{v:39.2,color:TEAL,top:f1(39.2),group:1,gname:L.t2[3][1]}]},
   {d:L.t3,max:100,key:[[TEAL,L.t3[4][0]],[AMB,L.t3[4][1]]],bars:['breast','colorectal','cervical'].flatMap((k,i)=>[{v:sl[k].Domestic,color:TEAL,top:pc(Math.round(sl[k].Domestic)+' %'),group:i,gname:L.t3[3][i]},{v:sl[k]['Other/missing'],color:AMB,top:pc(Math.round(sl[k]['Other/missing'])+' %'),group:i,gname:L.t3[3][i]}])},
   {d:L.t4,max:34,bars:[['Finland',RED],['Denmark',GREY],['Sweden',GREY],['Norway',TEAL]].map(([k,c],i)=>({v:ns[k],color:c,top:pc(ns[k]+' %'),label:L.t4[3][i],group:0}))}
  ];
  el.innerHTML=defs.map((x,i)=>`<article class="tile"><p class="eyebrow">${x.d[0]}</p><div class="big${i===0||i===3?' w':''}">${x.d[1]}</div><p>${x.d[2]}</p>${x.key?`<div class="key">${x.key.map(k=>`<span><i style="background:${k[0]}"></i>${esc(k[1])}</span>`).join('')}</div>`:''}<div class="b3" id="b3-${i}"></div></article>`).join('');
  let gl=false;try{const c=document.createElement('canvas');gl=!!(c.getContext('webgl2')||c.getContext('webgl'));}catch(e){}
  const flat=()=>defs.forEach((x,i)=>{document.getElementById('b3-'+i).outerHTML=`<div class="flat">${x.bars.map(b=>`<div style="height:${b.v/x.max*100}%;background:${b.color}"><span>${esc(b.top)}</span></div>`).join('')}</div>`;});
  if(!gl){flat();return;}
  const go=m=>defs.forEach((x,i)=>m.mount(document.getElementById('b3-'+i),{bars:x.bars,max:x.max}));
  if(B3)go(B3);else import('/assets/bars3d.js').then(m=>{B3=m;go(m);}).catch(flat);
}

/* ---------- language ---------- */
function apply(l){
  lang=T[l]?l:'en';document.documentElement.lang=lang;
  const L=t();document.title='Polku hoitoon – '+{fi:'Keuhkodata',sv:'Lungdata',en:'Lung data'}[lang];
  document.querySelectorAll('[data-k]').forEach(e=>{const v=L[e.dataset.k];if(typeof v==='string')e.textContent=v;});
  const i=document.getElementById('askI');i.placeholder=L.ph;i.setAttribute('aria-label',L.ph);
  try{localStorage.setItem('vayla-lang',lang)}catch(e){}
  chips();legend();card();labels();tiles();
}
document.getElementById('askF').onsubmit=e=>{e.preventDefault();const v=document.getElementById('askI').value.trim();if(v)runAI({question:v,region:REG});};
const sel=document.getElementById('lang');let start='';
try{start=localStorage.getItem('vayla-lang')||''}catch(e){}
if(!start)start=(navigator.language||'fi').slice(0,2);
if(!T[start])start='en';
if(sel){sel.value=start;sel.addEventListener('change',()=>{apply(sel.value);runAI(aiPreset?{preset:aiPreset}:{preset:'first_pilot'});});}
apply(start);map3d();
setTimeout(()=>runAI({preset:'first_pilot'}),700);
</script>
