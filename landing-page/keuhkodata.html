<html lang="fi" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polku hoitoon – Keuhkodata</title>
<meta name="description" content="Keuhkosyöpä Suomessa: missä ero on, ketä se koskee ja mitä tehdään. Tekoälyanalyytikko ja 3D-kartta hyvinvointialueittain.">
<meta property="og:title" content="Polku hoitoon – Keuhkodata">

<link href="/fonts/fonts.css" rel="stylesheet">

<style>
main.dash{padding-bottom:var(--s8);background:#FAFBFB}
.hidden{display:none!important}
.wide{max-width:1480px;margin:0 auto;padding:0 var(--s4)}
@media (max-width:640px){.wide{padding:0 var(--s2)}}

/* ---- top: title + AI ---- */
.top{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:var(--s2) var(--s5);align-items:start;padding-top:var(--s5);padding-bottom:var(--s3)}
.top h1{font-size:clamp(28px,2.6vw,40px);max-width:20ch}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin:0 0 var(--s1)}
.ask{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:999px;padding:6px 6px 6px 16px;background:#fff;box-shadow:0 12px 30px -22px rgba(15,26,36,.4);transition:border-color .2s,box-shadow .2s}
.ask:focus-within{border-color:var(--teal);box-shadow:0 0 0 4px var(--accent-t)}
.ask input{flex:1;min-width:0;border:0!important;box-shadow:none!important;outline:none;min-height:44px;padding:0;font-size:17px;background:none}
.ask .btn{border-radius:999px;min-height:44px}
.brain{width:22px;height:22px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8FDCD4,var(--teal) 55%,var(--accent-d));animation:breathe 2.6s ease-in-out infinite}
.brain.think{animation:think .8s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(43,163,154,.35)}50%{box-shadow:0 0 0 8px rgba(43,163,154,0)}}
@keyframes think{0%,100%{transform:scale(1)}50%{transform:scale(.78)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{font:inherit;font-size:13.5px;min-height:32px;padding:0 12px;border:1px solid var(--line-2);background:#fff;border-radius:999px;cursor:pointer;color:var(--ink)}
.chips button:hover{border-color:var(--ink)}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.aibar{margin-top:var(--s2);display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:start;min-height:56px}
.aibar .tk{grid-column:1/-1;font-family:var(--mono);font-size:12px;color:var(--sec);display:flex;align-items:center;gap:8px;min-height:18px}
.tk .sp{width:11px;height:11px;border-radius:50%;border:2px solid var(--teal);border-right-color:transparent;animation:spin .8s linear infinite}
.tk .ok{width:13px;height:13px;border-radius:50%;background:var(--teal);color:#fff;font-size:8px;display:grid;place-items:center}
@keyframes spin{to{transform:rotate(360deg)}}
.aibar .ans{grid-column:1/-1;font-size:16px;line-height:1.5;margin:0;color:var(--ink)}
.aibar .rk{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.rk button{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13.5px;padding:5px 12px 5px 5px;border-radius:999px;border:1px solid var(--line-2);background:#fff;cursor:pointer;opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s,border-color .2s}
.rk button.in{opacity:1;transform:none}
.rk button:hover,.rk button[aria-current=true]{border-color:var(--ink)}
.rk .n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;font-size:12px;font-weight:700}
.rk small{color:var(--sec)}

/* ---- stage: map with region overlay | ranking ---- */
.stage{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(360px,1fr);gap:var(--s2);height:min(760px,calc(100vh - 80px));min-height:620px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;position:relative;overflow:hidden}
.mapbox .gl{position:absolute;inset:0}
.mapbox canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.mapbox .still{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.lbl{position:absolute;transform:translate(-50%,calc(-100% - 8px));pointer-events:none;white-space:nowrap;background:rgba(255,255,255,.96);border:1px solid var(--line-2);border-radius:6px;padding:3px 8px;font-size:12.5px;font-weight:600;opacity:0;transition:opacity .4s}
.lbl.on{opacity:1}
.lbl small{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--sec)}
.lbl .r{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--teal);color:#fff;font-size:10.5px;margin-inline-end:5px;vertical-align:-3px}
.lbl.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.legend{position:absolute;right:var(--s2);bottom:var(--s2);display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--sec);background:rgba(255,255,255,.92);padding:8px 10px;border-radius:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px;vertical-align:-1px}
/* region overlay on the map */
.hud{position:absolute;left:var(--s2);top:var(--s2);width:min(330px,calc(100% - 32px));background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;box-shadow:0 18px 40px -26px rgba(15,26,36,.45)}
.hud .h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hud h2{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.1}
.vd{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.vd i{width:7px;height:7px;border-radius:50%;background:currentColor}
.vd.bus{color:#8A5A12;background:#FBF0DF}.vd.hosp{color:var(--accent-d);background:var(--accent-t)}.vd.watch{color:#9B2318;background:var(--worse-t)}.vd.none{color:var(--sec);background:var(--surf-2)}.vd.low{color:#1F4E86;background:var(--better-t)}
.hud .nums{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.hud .nums b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.hud .nums b.w{color:var(--worse)}.hud .nums b.b{color:var(--better)}
.hud .nums span{display:block;font-size:12px;color:var(--sec);margin-top:3px;line-height:1.3}
.ring{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.ring svg{flex:none}
.ring p{margin:0;font-size:13px;line-height:1.4}
.ring p b{font-size:14px}
.hud .act{font-size:13.5px;line-height:1.45;margin:10px 0 0}
.hud .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hud .btn{min-height:40px;font-size:14px;padding:0 14px}
.hud select{margin-top:8px;min-height:34px;font-size:13.5px;width:100%}
/* ranking: forest plot */
.rank{display:flex;flex-direction:column;padding:var(--s3) var(--s3) var(--s2)}
.rank h3,.tile h3{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sec)}
.rank .lead{font-size:14px;color:var(--sec);margin:4px 0 8px}
.forest{flex:1;min-height:0;position:relative}
.forest svg{display:block;width:100%;height:100%}
.forest .row{cursor:pointer}
.forest .row:hover .bg,.forest .row.sel .bg{fill:#F2F4F4}
.forest .row.sel .bg{fill:#FBF0DF}
.forest text{font-family:var(--sans);font-size:12px;fill:var(--ink)}
.forest .ax{font-family:var(--mono);font-size:10.5px;fill:var(--sec)}

/* ---- charts ---- */
.charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);margin-top:var(--s2)}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:var(--s3);display:flex;flex-direction:column;min-width:0}
.tile.span2{grid-column:span 2}
.tile .big{font-size:38px;font-weight:600;letter-spacing:-.03em;line-height:1;margin-top:8px}
.tile .big.w{color:var(--worse)}
.tile .big small{font-size:15px;font-weight:500;color:var(--sec);letter-spacing:0;margin-inline-start:6px}
.tile p{font-size:14.5px;line-height:1.45;margin:8px 0 0}
.viz{margin-top:auto;padding-top:var(--s2)}
.viz svg{display:block;width:100%;height:auto;overflow:visible}
.viz text{font-family:var(--sans);font-size:12px;fill:var(--ink)}
.viz .ax{font-family:var(--mono);font-size:10.5px;fill:var(--sec)}
.viz .lab{font-size:12px;font-weight:600;fill:#fff}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sec);margin-top:10px}
.key i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px}
.b3{position:relative;height:250px}
.b3 canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.b3v,.b3n,.b3g{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap}
.b3v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;transition:opacity .3s}
.b3n{font-size:11.5px;color:var(--sec)}
.b3g{font-size:11.5px;font-weight:600;margin-top:16px}
.waf{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.waf h4{font-size:13px;font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between}
.waf h4 span{color:var(--sec);font-weight:500}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--surf-3);transition:background-color .25s}
.srcline{font-size:12.5px;color:var(--sec);margin-top:var(--s3)}

@media (max-width:1100px){
  .top{grid-template-columns:1fr}
  .stage{grid-template-columns:1fr;height:auto;min-height:0}
  .mapbox{height:min(130vw,700px)}
  .rank{height:620px}
  .charts{grid-template-columns:1fr 1fr}
  .tile.span2{grid-column:1/-1}
}
@media (max-width:640px){
  .charts{grid-template-columns:1fr}
  .hud{position:relative;left:auto;top:auto;width:auto;margin:var(--s2);box-shadow:none}
  .mapbox{height:auto;min-height:0}
  .mapbox .gl{position:relative;inset:auto;height:110vw}
  .legend{position:relative;right:auto;bottom:auto;flex-direction:row;flex-wrap:wrap;margin:0 var(--s2) var(--s2)}
  .waf{gap:var(--s2)}
}
@media (prefers-reduced-motion:reduce){.brain,.tk .sp{animation:none}.rk button{transition:none}}
</style>
</head>

     <circle class="pt" cx="${X(1)}" cy="${y+12}" r="5" fill="${s}" stroke="#fff" stroke-width="2" data-x="${X(r[1])}"/>

function animAttr(n,a,from,to,ms){const t0=performance.now();const st=now=>{const p=Math.max(0,Math.min(1,(now-t0)/ms)),e=1-Math.pow(1-p,3);n.setAttribute(a,from+(to-from)*e);if(p<1)requestAnimationFrame(st);};requestAnimationFrame(st);}

  document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>runAI({preset:b.dataset.p}));}
async function runAI(req){
  const L=t(),my=++aiRun,brain=document.getElementById('brain'),tk=document.getElementById('tk'),an=document.getElementById('ans'),rk=document.getElementById('rk');
  aiPreset=req.preset||null;document.querySelectorAll('#chips button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===aiPreset));
  brain.classList.add('think');tk.innerHTML=`<span class="sp"></span>${L.run}`;an.textContent='';rk.innerHTML='';
  let j;try{const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...req,lang})});
    if(my!==aiRun)return;if(!r.ok)throw 0;j=await r.json();}catch(e){if(my!==aiRun)return;brain.classList.remove('think');tk.textContent='';an.textContent=L.off;return;}
  if(my!==aiRun)return;
  const STEP=RM?0:420;
  j.steps.forEach((st,i)=>setTimeout(()=>{if(my===aiRun)tk.innerHTML=`<span class="sp"></span>${esc(stepText(st))}`;},i*STEP));
  setTimeout(()=>{if(my!==aiRun)return;brain.classList.remove('think');
    const n=Math.max(0,...j.steps.map(s=>s.n||0));
    tk.innerHTML=`<span class="ok">✓</span>${L.done(n,j.steps.length,j.seconds<0.1?(lang==='en'?'0.1':'0,1'):String(j.seconds).replace('.',lang==='en'?'.':','))}`;

  },j.steps.length*STEP);
}

  let i=0;const st=()=>{if(my!==aiRun)return;i=Math.min(text.length,i+Math.max(2,Math.round(text.length/55)));node.textContent=text.slice(0,i);if(i<text.length)requestAnimationFrame(st);else done();};st();}

function apply(l){
  lang=T[l]?l:'en';document.documentElement.lang=lang;
  const L=t();document.title='Polku hoitoon – '+{fi:'Keuhkodata',sv:'Lungdata',en:'Lung data'}[lang];
  document.querySelectorAll('[data-k]').forEach(e=>{const v=L[e.dataset.k];if(typeof v==='string')e.textContent=v;});
  const i=document.getElementById('askI');i.placeholder=L.ph;i.setAttribute('aria-label',L.ph);
  try{localStorage.setItem('vayla-lang',lang)}catch(e){}
  chips();legend();hud();labels();forest();charts();
}
document.getElementById('askF').onsubmit=e=>{e.preventDefault();const v=document.getElementById('askI').value.trim();if(v)runAI({question:v,region:REG});};
const sel=document.getElementById('lang');let start='';
try{start=localStorage.getItem('vayla-lang')||''}catch(e){}
if(!start)start=(navigator.language||'fi').slice(0,2);
if(!T[start])start='en';
if(sel){sel.value=start;sel.addEventListener('change',()=>{apply(sel.value);runAI(aiPreset?{preset:aiPreset}:{preset:'first_pilot'});});}
apply(start);map3d();
setTimeout(()=>runAI({preset:'first_pilot'}),700);
</script>
</body>
</html>
