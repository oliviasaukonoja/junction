<!DOCTYPE html>
<html lang="fi" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polku hoitoon – päättäjille</title>
<meta name="description" content="Missä keuhkosyöpäpotilas menettää aikaa ja mitä hyvinvointialue voi tehdä.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213D;--muted:#4A5872;--blue:#1F5FD6;--blue-d:#123E91;--sky:#EAF1FF;--bg:#F5F7FB;--line:#E3E8F0;--orange:#D9730D;--orange-bg:#FFF3E6;--orange-ink:#8A3B00}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.55;font-size:17px}
a{color:var(--blue)}a:hover{color:var(--blue-d)}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;line-height:1.15;margin:0;letter-spacing:-.01em}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;flex-wrap:wrap;padding:8px 0}
.logo{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:24px;color:var(--ink);text-decoration:none}
.bar-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
select{font:inherit;font-size:15px;min-height:44px;padding:0 12px;border:1px solid #C9D2E0;border-radius:10px;background:#fff;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;font-size:16px;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--blue-d);color:#fff}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px}
.hero{background:var(--bg);padding:56px 0 48px}
.hero-g{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center}
.badge{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--orange-bg);color:var(--orange-ink);font-weight:700;font-size:14px;margin-bottom:16px}
.hero h1{font-size:clamp(34px,5vw,54px)}
.lead{font-size:19px;color:var(--muted);margin:18px 0 26px;max-width:36em}
.bus{width:100%;height:auto}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:-28px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 2px 8px rgba(20,33,61,.05)}
.faq{border-bottom:1px solid var(--line);padding:14px 0}.faq summary{font-weight:600;cursor:pointer;font-size:17px}.faq p{margin:8px 0 0;color:var(--muted)}
.stat-cap{grid-column:1/-1;justify-self:start;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.stat b{display:block;font-family:"Space Grotesk",sans-serif;font-size:34px;color:var(--blue-d)}
.stat span{font-size:15px;color:var(--muted)}
section{padding:56px 0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}
.list{margin:16px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.list li{display:flex;gap:12px;align-items:flex-start}
.dot{flex:none;width:10px;height:10px;border-radius:5px;background:var(--blue);margin-top:9px}
.uk{background:var(--ink);color:#fff}
.uk h2{color:#fff}
.uk p{color:#DCE3F0}
.uk .src{font-size:14px;color:#AAB6CC}
.uk a{color:#9EC1FF}
.warn{background:var(--orange-bg);border:1px solid #F5B97A;border-radius:18px;padding:22px 24px;color:var(--orange-ink)}
.warn h3{color:var(--orange-ink);font-size:22px;margin-bottom:6px}
form{display:flex;flex-direction:column;gap:16px}
label{font-weight:600;font-size:15px;display:block;margin-bottom:6px}
input[type=text],input[type=tel]{width:100%;font:inherit;min-height:48px;padding:0 14px;border:1px solid #C9D2E0;border-radius:10px;color:var(--ink)}
input:focus,select:focus,.btn:focus,.opt:focus-within{outline:3px solid #9EC1FF;outline-offset:2px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid #C9D2E0;border-radius:10px;font-weight:500;cursor:pointer}
.opt input{width:18px;height:18px;accent-color:var(--blue)}
.consent{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:15px}
.consent input{width:20px;height:20px;margin-top:2px;accent-color:var(--blue);flex:none}
.msg{padding:14px 16px;border-radius:12px;font-size:16px}
.msg.ok{background:var(--sky);color:var(--blue-d)}
.msg.err{background:#FDECEC;color:#9B1C1C}
.msg.demo{background:var(--orange-bg);color:var(--orange-ink)}
.team{background:var(--bg)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line)}
footer{padding:32px 0 48px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
footer p{margin:0;max-width:46em;padding:16px 18px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:16px;color:var(--ink)}
.hidden{display:none}
[dir=rtl] .list li,[dir=rtl] .consent{flex-direction:row}
@media (max-width:780px){.hero-g,.g2{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:minmax(0,1fr);margin-top:20px}.hero{padding:36px 0}.bus{max-width:360px}}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}.tab{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted);text-decoration:none}.tab:hover{color:var(--ink)}.tab.on{background:#fff;color:var(--blue-d);box-shadow:0 1px 3px rgba(20,33,61,.12)}
@media (max-width:780px){.tabs{order:3;width:100%}.tab{flex:1;justify-content:center}}
@media (max-width:780px){.tabs{display:grid;grid-template-columns:1fr 1fr}.tab{padding:0 8px;font-size:14px;min-height:38px}}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.kpi b{display:block;font-family:"Space Grotesk",sans-serif;font-size:30px;color:var(--blue-d);line-height:1.1}
.kpi p{margin:8px 0;font-size:15px}.kpi small{color:var(--muted);font-size:12.5px;display:block}
.bar{display:flex;border-radius:14px;overflow:hidden;margin-top:18px;min-height:96px}
.seg{padding:14px;color:#fff;font-size:14px}.seg b{display:block;font-size:16px;margin-bottom:4px}
.seg.p{background:#D9730D;flex:50}.seg.h{background:#1F5FD6;flex:41}.seg.s{background:#14213D;flex:58}.seg.o{background:#C9D2E0;flex:6}
table.act{width:100%;border-collapse:collapse;margin-top:16px;font-size:15px;background:#fff;border-radius:14px;overflow:hidden}
table.act th{background:var(--bg);font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
table.act td,table.act th{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;text-align:start}
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:18px}
.sl label{font-weight:600;font-size:15px;display:flex;justify-content:space-between;gap:10px}
.sl input{width:100%;accent-color:var(--blue);margin:8px 0 18px}
.rbars{display:grid;gap:10px}
.rb{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:15px}
.rb .t{height:22px;border-radius:6px;background:var(--line);position:relative;overflow:hidden}
.rb .f{position:absolute;inset:0 auto 0 0;border-radius:6px;transition:width .25s}
.big{font-family:"Space Grotesk",sans-serif;font-size:44px;font-weight:700;color:#14532D}
.sum{background:var(--sky);border-radius:16px;padding:18px 20px;color:var(--blue-d);font-weight:600;margin-top:18px}
.assume{background:var(--orange-bg);border:1px solid #F5B97A;border-radius:14px;padding:14px 16px;color:var(--orange-ink);font-size:14px;margin-top:16px}
.assume ul{margin:6px 0 0;padding-inline-start:18px}
.src{font-size:13px;color:var(--muted);margin-top:10px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.sim{grid-template-columns:minmax(0,1fr)}.bar{flex-direction:column}.rb{grid-template-columns:110px minmax(0,1fr) 60px}table.act{font-size:14px}}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="logo" href="/" data-t="brand">Polku hoitoon</a>
    <div class="bar-r">
      <nav class="tabs" aria-label="Polku hoitoon"><a class="tab" href="/" data-t="nav_bus"></a><a class="tab" href="/sovellus" data-t="nav_app"></a></nav>
      <label for="lang" class="hidden" id="langLbl">Language</label>
      <select id="lang" aria-labelledby="langLbl"><option value="fi">Suomi</option><option value="en">English</option></select>
    </div>
  </div>
</header>
<main>
  <div class="hero" style="padding-bottom:40px">
    <div class="wrap">
      <span class="badge" data-t="badge"></span>
      <h1 data-t="h1" style="max-width:20em;font-size:clamp(30px,4.4vw,48px)"></h1>
      <p class="lead" data-t="lead"></p>
      <h2 style="font-size:24px;margin-top:8px" data-t="q1_h"></h2>
      <div class="kpis">
        <div class="kpi"><b data-t="k1"></b><p data-t="k1t"></p><small data-t="k1s"></small></div>
        <div class="kpi"><b data-t="k2"></b><p data-t="k2t"></p><small data-t="k2s"></small></div>
        <div class="kpi"><b data-t="k3"></b><p data-t="k3t"></p><small data-t="k3s"></small></div>
        <div class="kpi"><b data-t="k4"></b><p data-t="k4t"></p><small data-t="k4s"></small></div>
      </div>
    </div>
  </div>

  <section>
    <div class="wrap">
      <h2 style="font-size:28px" data-t="q2_h"></h2>
      <p style="color:var(--muted);margin:8px 0 0" data-t="q2_p"></p>
      <div class="bar" role="img" aria-label="Delay: patient 50+, primary care 41, specialist care 58 days">
        <div class="seg p"><b data-t="seg_p"></b><span data-t="seg_p2"></span></div>
        <div class="seg h"><b data-t="seg_h"></b><span data-t="seg_h2"></span></div>
        <div class="seg s"><b data-t="seg_s"></b><span data-t="seg_s2"></span></div>
        <div class="seg o"></div>
      </div>
      <p class="src" data-t="seg_src"></p>
    </div>
  </section>

  <section style="background:var(--bg)">
    <div class="wrap">
      <h2 style="font-size:28px" data-t="q3_h"></h2>
      <div style="overflow-x:auto"><table class="act">
        <thead><tr><th data-t="th1"></th><th data-t="th2"></th><th data-t="th3"></th><th data-t="th4"></th></tr></thead>
        <tbody>
          <tr><td data-t="a1"></td><td data-t="a1b"></td><td data-t="a1c"></td><td data-t="a1d"></td></tr>
          <tr><td data-t="a2"></td><td data-t="a2b"></td><td data-t="a2c"></td><td data-t="a2d"></td></tr>
          <tr><td data-t="a3"></td><td data-t="a3b"></td><td data-t="a3c"></td><td data-t="a3d"></td></tr>
          <tr><td data-t="a4"></td><td data-t="a4b"></td><td data-t="a4c"></td><td data-t="a4d"></td></tr>
        </tbody>
      </table></div>
      <p class="sum" style="margin-top:16px" data-t="prov"></p>
    </div>
  </section>

  <section id="sim">
    <div class="wrap">
      <h2 style="font-size:28px" data-t="sim_h"></h2>
      <p style="color:var(--muted);margin:8px 0 0" data-t="sim_p"></p>
      <div class="sim">
        <div class="card sl">
          <label for="s1"><span data-t="s1"></span><b id="v1"></b></label><input id="s1" type="range" min="0" max="100" step="10" value="50">
          <label for="s2"><span data-t="s2"></span><b id="v2"></b></label><input id="s2" type="range" min="0" max="60" step="5" value="20">
          <label for="s3"><span data-t="s3"></span><b id="v3"></b></label><input id="s3" type="range" min="0" max="100" step="10" value="30">
          <div class="assume"><b data-t="as_h"></b><ul><li data-t="as1"></li><li data-t="as2"></li><li data-t="as3"></li><li data-t="as4"></li></ul></div>
        </div>
        <div class="card">
          <div><span class="big" id="saved">0</span> <span data-t="r_saved"></span></div>
          <div class="rbars" style="margin-top:16px">
            <div class="rb"><span data-t="r_now"></span><div class="t"><div class="f" id="bNow" style="background:#D9730D"></div></div><b id="nNow"></b></div>
            <div class="rb"><span data-t="r_new"></span><div class="t"><div class="f" id="bNew" style="background:#1F5FD6"></div></div><b id="nNew"></b></div>
            <div class="rb"><span data-t="r_se"></span><div class="t"><div class="f" id="bSe" style="background:#9AA6BA"></div></div><b>107</b></div>
            <div class="rb"><span data-t="r_dk"></span><div class="t"><div class="f" id="bDk" style="background:#9AA6BA"></div></div><b>67</b></div>
          </div>
          <div class="sum"><div style="font-size:13px;text-transform:uppercase;letter-spacing:.04em;opacity:.8;margin-bottom:6px" data-t="sum_h"></div><div id="sumT"></div></div>
        </div>
      </div>
    </div>
  </section>

  <section style="background:var(--bg)">
    <div class="wrap g2">
      <div>
        <h2 style="font-size:26px" data-t="why_h"></h2>
        <ul class="list"><li><span class="dot"></span><span data-t="why1"></span></li><li><span class="dot"></span><span data-t="why2"></span></li><li><span class="dot"></span><span data-t="why3"></span></li></ul>
        <p class="src" data-t="why_src"></p>
      </div>
      <div class="card">
        <h2 style="font-size:22px" data-t="lim_h"></h2>
        <ul class="list"><li><span class="dot" style="background:#D9730D"></span><span data-t="lim1"></span></li><li><span class="dot" style="background:#D9730D"></span><span data-t="lim2"></span></li><li><span class="dot" style="background:#D9730D"></span><span data-t="lim3"></span></li></ul>
      </div>
    </div>
  </section>
</main>
<footer>
  <div class="wrap">
    <p data-t="note"></p>
    <div style="margin-top:14px;font-size:15px"><b style="color:var(--ink)">Polku Labs</b> · Junction 2026 · <a href="mailto:info@polkuhoitoon.fi">info@polkuhoitoon.fi</a></div>
    <div style="margin-top:10px;font-size:14px;color:var(--muted)"><a href="/ammattilaisille" data-t="nav_pro"></a> · <a href="/paattajille" data-t="nav_dm"></a></div>
  </div>
</footer>

var lang = "fi";
var BASE = {patient: 50, primary: 41, specialist: 58, total: 155};
function el(id){ return document.getElementById(id); }
function calc(){
  var s1 = +el("s1").value, s2 = +el("s2").value, s3 = +el("s3").value;

  var d = Math.round(saved), now = BASE.total, nw = now - d, max = 160;
  el("v1").textContent = s1 + " %"; el("v2").textContent = s2 + " %"; el("v3").textContent = s3 + " %";
  el("saved").textContent = d;
  el("nNow").textContent = now + " " + T[lang].r_days; el("nNew").textContent = nw + " " + T[lang].r_days;
  el("bNow").style.width = (now / max * 100) + "%"; el("bNew").style.width = (nw / max * 100) + "%";
  el("bSe").style.width = (107 / max * 100) + "%"; el("bDk").style.width = (67 / max * 100) + "%";

}
