<!DOCTYPE html>
<html lang="fi" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polku hoitoon – keuhkotarkastus lähellä</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213D;--muted:#4A5872;--blue:#1F5FD6;--blue-d:#123E91;--sky:#EAF1FF;--bg:#F5F7FB;--line:#E3E8F0;--orange:#D9730D;--orange-bg:#FFF3E6;--orange-ink:#8A3B00}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.55;font-size:17px}
a{color:var(--blue)}a:hover{color:var(--blue-d)}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;line-height:1.15;margin:0;letter-spacing:-.01em}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;flex-wrap:wrap;padding:8px 0}
.logo{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:24px;color:var(--ink);text-decoration:none}
.bar-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
select{font:inherit;font-size:15px;min-height:44px;padding:0 12px;border:1px solid #C9D2E0;border-radius:10px;background:#fff;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;font-size:16px;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--blue-d);color:#fff}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px}
.hero{background:var(--bg);padding:56px 0 48px}
.hero-g{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center}
.badge{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--orange-bg);color:var(--orange-ink);font-weight:700;font-size:14px;margin-bottom:16px}
.hero h1{font-size:clamp(34px,5vw,54px)}
.lead{font-size:19px;color:var(--muted);margin:18px 0 26px;max-width:36em}
.bus{width:100%;height:auto}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:-28px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 2px 8px rgba(20,33,61,.05)}
.faq{border-bottom:1px solid var(--line);padding:14px 0}.faq summary{font-weight:600;cursor:pointer;font-size:17px}.faq p{margin:8px 0 0;color:var(--muted)}
.stat-cap{grid-column:1/-1;justify-self:start;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.stat b{display:block;font-family:"Space Grotesk",sans-serif;font-size:34px;color:var(--blue-d)}
.stat span{font-size:15px;color:var(--muted)}
section{padding:56px 0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}
.list{margin:16px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.list li{display:flex;gap:12px;align-items:flex-start}
.dot{flex:none;width:10px;height:10px;border-radius:5px;background:var(--blue);margin-top:9px}
.uk{background:var(--ink);color:#fff}
.uk h2{color:#fff}
.uk p{color:#DCE3F0}
.uk .src{font-size:14px;color:#AAB6CC}
.uk a{color:#9EC1FF}
.warn{background:var(--orange-bg);border:1px solid #F5B97A;border-radius:18px;padding:22px 24px;color:var(--orange-ink)}
.warn h3{color:var(--orange-ink);font-size:22px;margin-bottom:6px}
form{display:flex;flex-direction:column;gap:16px}
label{font-weight:600;font-size:15px;display:block;margin-bottom:6px}
input[type=text],input[type=tel]{width:100%;font:inherit;min-height:48px;padding:0 14px;border:1px solid #C9D2E0;border-radius:10px;color:var(--ink)}
input:focus,select:focus,.btn:focus,.opt:focus-within{outline:3px solid #9EC1FF;outline-offset:2px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid #C9D2E0;border-radius:10px;font-weight:500;cursor:pointer}
.opt input{width:18px;height:18px;accent-color:var(--blue)}
.consent{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:15px}
.consent input{width:20px;height:20px;margin-top:2px;accent-color:var(--blue);flex:none}
.msg{padding:14px 16px;border-radius:12px;font-size:16px}
.msg.ok{background:var(--sky);color:var(--blue-d)}
.msg.err{background:#FDECEC;color:#9B1C1C}
.msg.demo{background:var(--orange-bg);color:var(--orange-ink)}
.team{background:var(--bg)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line)}
footer{padding:32px 0 48px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
footer p{margin:0;max-width:46em;padding:16px 18px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:16px;color:var(--ink)}
.hidden{display:none}
[dir=rtl] .list li,[dir=rtl] .consent{flex-direction:row}
@media (max-width:780px){.hero-g,.g2{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:minmax(0,1fr);margin-top:20px}.hero{padding:36px 0}.bus{max-width:360px}}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}.tab{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted);text-decoration:none}.tab:hover{color:var(--ink)}.tab.on{background:#fff;color:var(--blue-d);box-shadow:0 1px 3px rgba(20,33,61,.12)}
@media (max-width:780px){.tabs{order:3;width:100%}.tab{flex:1;justify-content:center}}
@media (max-width:780px){.tabs{display:grid;grid-template-columns:1fr 1fr}.tab{padding:0 8px;font-size:14px;min-height:38px}}
.menu{position:relative}.menu summary{list-style:none;cursor:pointer;min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;border:1px solid #C9D2E0;border-radius:10px;font-size:20px;background:#fff;color:var(--ink)}.menu summary::-webkit-details-marker{display:none}
.menu-p{position:absolute;inset-inline-end:0;top:52px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(20,33,61,.14);padding:8px;min-width:230px;display:flex;flex-direction:column;z-index:20}
.menu-p a{padding:11px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;font-size:16px}.menu-p a:hover{background:var(--bg)}
/* spacing v2 */
body{line-height:1.6}
.wrap{padding:0 24px}
header .bar{padding:12px 24px;gap:16px;min-height:72px}
.bar-r{gap:12px}
section{padding:80px 0}
.hero{padding:72px 0 64px}
.lead{margin:20px 0 30px}
.g2{gap:48px}
.card{padding:28px}
form{gap:20px}
.stats{gap:20px}
.list{gap:14px;margin-top:20px}
.faq{padding:18px 0}
footer{padding:40px 0 56px}
@media (max-width:780px){.wrap{padding:0 20px}header .bar{padding:12px 20px;gap:12px}.bar-r{display:contents}.logo{order:1;flex:1;font-size:22px}header select{order:2;padding:0 8px;font-size:14px}.menu{order:3}.tabs{order:4;width:100%}header .btn.sm{display:none}section{padding:56px 0}.hero{padding:40px 0 44px}.g2{gap:32px}}
</style>
</head>

<script>
var T = {
fi:{jx:"Mikä on Junction? Junction on Helsingissä vuosittain järjestettävä kansainvälinen hackathon, jossa tiimit kehittävät viikonlopun aikana ratkaisuja yritysten ja organisaatioiden antamiin haasteisiin. Tämä konsepti on syntynyt siellä AstraZenecan haasteessa.",app_link:"Tutustu myös Polku hoitoon -sovellukseen",brand:"Polku hoitoon",who_lbl:"Kenet ilmoitat?",me:"Itseni",rel:"Läheiseni",rel_help:"Kirjoita läheisesi puhelinnumero, tai omasi, jos välität tiedon hänelle.",count_t:"ihmistä jonossa",top_h:"Eniten ilmoittautumisia",vote_p:"Jokainen ilmoittautuminen on ääni sille, että bussi tulee teidän alueellenne.",area:"postinumeroalue",share_h:"Tunnetko jonkun, jolle tämä sopisi?",share_p:"Lähetä linkki esimerkiksi vanhemmallesi. Hänen kielensä valitaan sivulla automaattisesti.",wa:"Lähetä WhatsAppilla",copy:"Kopioi linkki",copied:"Linkki kopioitu",share_msg:"Ilmainen keuhkotarkastus voi olla tulossa lähellesi. Ilmoittaudu jonoon:",faq_h:"Usein kysyttyä",q1:"Maksaako tämä jotain?",a1:"Suunnitelmana on, että tarkastus olisi maksuton. Jonoon ilmoittautuminen on aina maksutonta.",q2:"Onko kuvaus turvallinen?",a2:"Keuhkojen seulonnassa käytetään matala-annoksista TT-kuvausta, jonka säteilyannos on pieni. Hoitaja kertoo hyödyt ja haitat ennen kuvausta.",q3:"Kuka näkee tietoni?",a3:"Vain Junction 2026 -tiimi. Käytämme tietoja vain kiinnostuksen mittaamiseen ja yhteydenottoon, jos pilotti alkaa. Poistamme tiedot pyynnöstä. info@polkuhoitoon.fi",q4:"Tarvitsenko lähetteen?",a4:"Et. Jos sinulla on jo oireita, älä odota bussia vaan ota yhteyttä terveysasemaan.",stats_h:"Iso-Britannia: NHS:n keuhkotarkastusautot 2019–2023",err_net:"Tallennus epäonnistui. Yritä hetken päästä uudelleen.",nav:"Liity jonoon",badge:"Pilottikonsepti",h1:"Ilmainen keuhkotarkastus tulee lähellesi",lead:"Polku hoitoon -bussi tuo nopean keuhkotarkastuksen kotisi lähelle alueille, joilla keuhkosyöpä vie eniten henkiä ja sairaalaan on pitkä matka. Liity jonotuslistalle, niin kerromme, kun bussi tulee lähellesi.",cta:"Liity jonotuslistalle",s1:"löydetty varhain (vaihe 1–2)",s2:"keuhkosyöpää löydetty",s3:"autot liikkeellä vuodesta",why_h:"Miksi keuhkot?",why1:"Varhainen keuhkosyöpä on usein oireeton. Kun oireet alkavat, se on yleensä jo levinnyt.",why2:"Ajoissa löydetty syöpä voidaan usein parantaa leikkauksella.",why3:"Suomessa vain 17 % keuhkosyöpää sairastavista miehistä on elossa 5 vuoden päästä. Norjassa luku on 30 %.",uk_h:"Isossa-Britanniassa tämä toimii jo",uk_p:"Vuodesta 2019 NHS:n keuhkotarkastusautot ovat pysähtyneet kauppojen ja urheilukenttien parkkipaikoille alueilla, joilla keuhkosyöpäkuolleisuus on suurinta. Ne ovat löytäneet yli 5 000 keuhkosyöpää, joista 76 % varhaisessa vaiheessa.",uk_p2:"Sosioekonomisesti heikommassa asemassa olevilla alueilla asuvat saavat nyt todennäköisemmin diagnoosin ajoissa.",who_h:"Kenelle?",who_p:"55–74-vuotiaille, jotka tupakoivat tai ovat tupakoineet.",sym_h:"Älä odota bussia, jos sinulla on oireita",sym_p:"Ota yhteyttä terveysasemaan, jos olet yskinyt yli 3 viikkoa, yskit verta tai painosi laskee itsestään.",form_h:"Liity jonotuslistalle",f_name:"Etunimi",f_contact:"Puhelin tai sähköposti",f_post:"Postinumero",f_age:"Oletko 55–74-vuotias ja tupakoitko tai oletko tupakoinut?",yes:"Kyllä",no:"Ei",unsure:"En ole varma",f_consent:"Polku hoitoon saa ottaa minuun yhteyttä keuhkotarkastuksesta. Voin pyytää tietojeni poistoa milloin tahansa.",submit:"Liity jonotuslistalle",ok:"Kiitos! Olet listalla. Otamme yhteyttä omalla kielelläsi.",err_fill:"Täytä yhteystieto ja postinumero ja rastita ruutu.",demo:"Esittelytila: ilmoittautumista ei tallennettu. Tallennus toimii tiimin jäsenille, joilla on muokkausoikeus.",note:"Tämä ei ole vielä oikea palvelu, mutta se voi olla tulossa. Keräämme tällä jonotuslistalla kiinnostusta: kannattaako tällainen palvelu toteuttaa? Konseptin on tehnyt Junction 2026 -tiimi, eikä aikoja varata vielä."},
sv:{jx:"Vad är Junction? Junction är ett internationellt hackathon som ordnas varje år i Helsingfors. Under en helg utvecklar team lösningar på utmaningar från företag och organisationer. Det här konceptet har tagits fram där, i AstraZenecas utmaning.",app_link:"Se även appen Polku hoitoon",brand:"Screening av lungcancer",who_lbl:"Vem anmäler du?",me:"Mig själv",rel:"En närstående",rel_help:"Skriv din närståendes telefonnummer, eller ditt eget om du förmedlar informationen.",count_t:"personer i kön",top_h:"Flest anmälningar",vote_p:"Varje anmälan är en röst för att bussen kommer till ert område.",area:"postnummerområde",share_h:"Känner du någon som det här passar?",share_p:"Skicka länken till exempel till din förälder. Sidan väljer språket automatiskt.",wa:"Skicka med WhatsApp",copy:"Kopiera länken",copied:"Länken kopierad",share_msg:"En gratis lungkontroll kan vara på väg nära dig. Ställ dig i kön:",faq_h:"Vanliga frågor",q1:"Kostar det något?",a1:"Planen är att kontrollen ska vara gratis. Att anmäla sig till kön är alltid gratis.",q2:"Är undersökningen säker?",a2:"Vid lungscreening används lågdos-datortomografi med liten stråldos. En sjukskötare berättar om för- och nackdelar före undersökningen.",q3:"Vem ser mina uppgifter?",a3:"Bara Junction 2026-teamet. Vi använder uppgifterna bara för att mäta intresset och kontakta dig om en pilot startar. Vi raderar dem på begäran. info@polkuhoitoon.fi",q4:"Behöver jag remiss?",a4:"Nej. Om du redan har symtom, vänta inte på bussen utan kontakta hälsostationen.",stats_h:"Storbritannien: NHS lungkontrollbilar 2019–2023",err_net:"Det gick inte att spara. Försök igen om en stund.",nav:"Ställ dig i kön",badge:"Pilotkoncept",h1:"En gratis lungkontroll kommer till ditt område",lead:"Bussen för screening av lungcancer tar en snabb lungkontroll nära ditt hem, i områden där lungcancer tar flest liv och sjukhuset ligger långt bort. Anmäl dig till väntelistan så berättar vi när bussen kommer nära dig.",cta:"Anmäl dig till väntelistan",s1:"hittade tidigt (stadium 1–2)",s2:"lungcancrar hittade",s3:"bilar på vägarna sedan",why_h:"Varför lungorna?",why1:"Tidig lungcancer ger ofta inga symtom. När symtomen kommer har den oftast redan spridit sig.",why2:"Upptäcks den tidigt kan den ofta botas med operation.",why3:"I Finland lever bara 17 % av männen med lungcancer efter 5 år. I Norge är siffran 30 %.",uk_h:"Det fungerar redan i Storbritannien",uk_p:"Sedan 2019 har NHS lungkontrollbilar stått på parkeringar vid butiker och idrottsplatser i områden med flest dödsfall i lungcancer. De har hittat över 5 000 lungcancrar, 76 % i ett tidigt skede.",uk_p2:"Personer i områden med lägre socioekonomisk status får nu oftare diagnosen i tid.",who_h:"För vem?",who_p:"Personer i åldern 55–74 som röker eller har rökt.",sym_h:"Vänta inte på bussen om du har symtom",sym_p:"Kontakta hälsostationen om du har hostat i över 3 veckor, hostar blod eller går ner i vikt utan att försöka.",form_h:"Anmäl dig till väntelistan",f_name:"Förnamn",f_contact:"Telefon eller e-post",f_post:"Postnummer",f_age:"Är du 55–74 år och röker eller har rökt?",yes:"Ja",no:"Nej",unsure:"Vet inte",f_consent:"Ni får kontakta mig om lungkontrollen. Jag kan när som helst be att mina uppgifter raderas.",submit:"Anmäl mig",ok:"Tack! Du står på listan. Vi kontaktar dig på ditt språk.",err_fill:"Fyll i kontaktuppgift och postnummer och kryssa i rutan.",demo:"Demoläge: anmälan sparades inte. Sparandet fungerar för teammedlemmar med redigeringsrätt.",note:"Det här är ännu ingen riktig tjänst, men den kan vara på väg. Med väntelistan mäter vi intresset: lönar det sig att bygga en sådan tjänst? Konceptet är gjort av ett Junction 2026-team, och inga tider bokas ännu."},
en:{jx:"What is Junction? Junction is an international hackathon held every year in Helsinki, where teams spend a weekend building solutions to challenges set by companies and organisations. This concept was created there, for AstraZeneca's challenge.",app_link:"See also the Polku hoitoon app",brand:"Polku hoitoon",who_lbl:"Who are you signing up?",me:"Myself",rel:"A relative",rel_help:"Enter your relative's phone number, or your own if you will pass it on.",count_t:"people on the waitlist",top_h:"Most sign-ups",vote_p:"Every sign-up is a vote to bring the bus to your area.",area:"postal area",share_h:"Know someone this is for?",share_p:"Send the link to a parent, for example. The page picks their language automatically.",wa:"Send on WhatsApp",copy:"Copy link",copied:"Link copied",share_msg:"A free lung check may be coming near you. Join the waitlist:",faq_h:"Questions",q1:"Does it cost anything?",a1:"The plan is that the check would be free. Joining the waitlist is always free.",q2:"Is the scan safe?",a2:"Lung screening uses a low-dose CT scan with a small radiation dose. A nurse explains the benefits and risks before the scan.",q3:"Who sees my details?",a3:"Only the Junction 2026 team. We use them only to measure interest and to contact you if a pilot starts. We delete them on request. info@polkuhoitoon.fi",q4:"Do I need a referral?",a4:"No. If you already have symptoms, don't wait for the bus. Contact your health center.",stats_h:"United Kingdom: NHS lung-check trucks, 2019–2023",err_net:"Could not save. Please try again in a moment.",nav:"Join the waitlist",badge:"Pilot concept",h1:"A free lung check is coming to your neighbourhood",lead:"The Polku hoitoon bus brings a quick lung check close to home, in areas where lung cancer takes the most lives and the hospital is far away. Join the waitlist and we'll tell you when the bus comes near you.",cta:"Join the waitlist",s1:"found early (stage 1–2)",s2:"lung cancers found",s3:"trucks on the road since",why_h:"Why lungs?",why1:"Early lung cancer is often silent. By the time it causes symptoms, it has usually spread.",why2:"Found early, it can often be cured with surgery.",why3:"In Finland, only 17% of men with lung cancer are alive after 5 years. In Norway it is 30%.",uk_h:"It already works in the UK",uk_p:"Since 2019, NHS lung-check trucks have parked at supermarkets and sports grounds in the areas with the most lung cancer deaths. They have found over 5,000 lung cancers, 76% at an early stage.",uk_p2:"People in areas with lower socioeconomic status are now more likely to be diagnosed early.",who_h:"Who is it for?",who_p:"People aged 55–74 who smoke or used to smoke.",sym_h:"Don't wait for the bus if you have symptoms",sym_p:"Contact your health center if you have had a cough for over 3 weeks, cough up blood, or lose weight without trying.",form_h:"Join the waitlist",f_name:"First name",f_contact:"Phone or email",f_post:"Postcode",f_age:"Are you 55–74 and do you smoke or used to?",yes:"Yes",no:"No",unsure:"Not sure",f_consent:"Polku hoitoon may contact me about the lung check. I can ask to remove my details at any time.",submit:"Join the waitlist",ok:"Thank you! You're on the list. We'll contact you in your language.",err_fill:"Please fill in your contact and postcode, and tick the box.",demo:"Demo mode: your sign-up was not stored. Saving works for team members with edit access.",note:"This is not a real service yet, but it may be coming. With this waitlist we are measuring interest: is a service like this worth building? Concept by a Junction 2026 team; no appointments are booked yet."},
ru:{jx:"Что такое Junction? Junction — международный хакатон, который ежегодно проходит в Хельсинки. За выходные команды разрабатывают решения задач, поставленных компаниями и организациями. Этот концепт создан там для задачи от AstraZeneca.",app_link:"Смотрите также приложение Polku hoitoon",brand:"Polku hoitoon",who_lbl:"Кого вы записываете?",me:"Себя",rel:"Близкого человека",rel_help:"Укажите телефон близкого человека или свой, если вы передадите ему информацию.",count_t:"человек в листе ожидания",top_h:"Больше всего записей",vote_p:"Каждая запись — это голос за то, чтобы автобус приехал в ваш район.",area:"почтовый район",share_h:"Знаете, кому это подойдёт?",share_p:"Отправьте ссылку, например, родителям. Язык страницы выберется автоматически.",wa:"Отправить в WhatsApp",copy:"Скопировать ссылку",copied:"Ссылка скопирована",share_msg:"Бесплатная проверка лёгких может скоро появиться рядом с вами. Запишитесь в лист ожидания:",faq_h:"Частые вопросы",q1:"Это платно?",a1:"Планируется, что проверка будет бесплатной. Запись в лист ожидания всегда бесплатна.",q2:"Безопасно ли обследование?",a2:"При скрининге лёгких используется низкодозовая КТ с небольшой дозой облучения. Медсестра расскажет о пользе и рисках до обследования.",q3:"Кто видит мои данные?",a3:"Только команда Junction 2026. Мы используем их только для оценки интереса и чтобы связаться с вами, если начнётся пилот. Удалим их по запросу. info@polkuhoitoon.fi",q4:"Нужно ли направление?",a4:"Нет. Если у вас уже есть симптомы, не ждите автобуса — обратитесь в поликлинику.",stats_h:"Великобритания: передвижные пункты проверки лёгких NHS, 2019–2023",err_net:"Не удалось сохранить. Попробуйте ещё раз чуть позже.",nav:"В лист ожидания",badge:"Пилотный проект",h1:"Бесплатная проверка лёгких приезжает в ваш район",lead:"Автобус Polku hoitoon привозит быструю проверку лёгких ближе к дому — в районы, где рак лёгких уносит больше всего жизней, а до больницы далеко. Запишитесь в лист ожидания, и мы сообщим, когда автобус будет рядом.",cta:"Записаться в лист ожидания",s1:"выявлено на ранней стадии (1–2)",s2:"случаев рака лёгких выявлено",s3:"пункты работают с",why_h:"Почему лёгкие?",why1:"Ранний рак лёгких часто протекает без симптомов. Когда они появляются, болезнь обычно уже распространилась.",why2:"Если обнаружить его рано, его часто можно вылечить операцией.",why3:"В Финляндии только 17 % мужчин с раком лёгких живы через 5 лет. В Норвегии — 30 %.",uk_h:"В Великобритании это уже работает",uk_p:"С 2019 года передвижные пункты проверки лёгких NHS стоят на парковках у супермаркетов и стадионов в районах с наибольшей смертностью от рака лёгких. Они выявили более 5 000 случаев рака лёгких, 76 % — на ранней стадии.",uk_p2:"Жители районов с более низким социально-экономическим статусом теперь чаще получают диагноз вовремя.",who_h:"Для кого?",who_p:"Для людей 55–74 лет, которые курят или курили раньше.",sym_h:"Если есть симптомы — не ждите автобуса",sym_p:"Обратитесь в поликлинику (terveysasema), если кашель длится больше 3 недель, вы кашляете кровью или худеете без причины.",form_h:"Записаться в лист ожидания",f_name:"Имя",f_contact:"Телефон или e-mail",f_post:"Почтовый индекс",f_age:"Вам 55–74 года и вы курите или курили?",yes:"Да",no:"Нет",unsure:"Не уверен(а)",f_consent:"Polku hoitoon может связаться со мной по поводу проверки лёгких. Я могу в любой момент попросить удалить мои данные.",submit:"Записаться",ok:"Спасибо! Вы в списке. Мы свяжемся с вами на вашем языке.",err_fill:"Укажите контакт и индекс и отметьте согласие.",demo:"Демо-режим: запись не сохранена. Сохранение работает для участников команды с правом редактирования.",note:"Это пока не настоящая услуга, но она может появиться. С помощью этого листа ожидания мы изучаем интерес: стоит ли создавать такую услугу? Концепт команды Junction 2026, запись на приём пока не ведётся."},
et:{jx:"Mis on Junction? Junction on igal aastal Helsingis toimuv rahvusvaheline häkaton, kus meeskonnad töötavad nädalavahetuse jooksul välja lahendusi ettevõtete ja organisatsioonide väljakutsetele. See kontseptsioon sündis seal AstraZeneca väljakutse raames.",app_link:"Vaata ka Polku hoitoon rakendust",brand:"Polku hoitoon",who_lbl:"Keda sa registreerid?",me:"Ennast",rel:"Lähedast",rel_help:"Kirjuta oma lähedase telefoninumber või enda oma, kui annad info edasi.",count_t:"inimest ootenimekirjas",top_h:"Kõige rohkem registreerimisi",vote_p:"Iga registreerimine on hääl selle eest, et buss tuleks teie piirkonda.",area:"postiindeksi piirkond",share_h:"Kas tead kedagi, kellele see sobiks?",share_p:"Saada link näiteks oma vanemale. Leht valib keele automaatselt.",wa:"Saada WhatsAppiga",copy:"Kopeeri link",copied:"Link kopeeritud",share_msg:"Tasuta kopsukontroll võib tulla sinu lähedale. Liitu ootenimekirjaga:",faq_h:"Korduma kippuvad küsimused",q1:"Kas see maksab midagi?",a1:"Plaan on, et kontroll oleks tasuta. Ootenimekirjaga liitumine on alati tasuta.",q2:"Kas uuring on ohutu?",a2:"Kopsu sõeluuringul kasutatakse väikese kiirgusdoosiga madaladoosilist KT-uuringut. Õde räägib enne uuringut kasust ja riskidest.",q3:"Kes näeb minu andmeid?",a3:"Ainult Junction 2026 meeskond. Kasutame andmeid ainult huvi mõõtmiseks ja sinuga ühenduse võtmiseks, kui pilootprojekt algab. Kustutame need soovi korral. info@polkuhoitoon.fi",q4:"Kas mul on saatekirja vaja?",a4:"Ei. Kui sul on juba sümptomid, ära oota bussi, vaid pöördu terviseasutusse.",stats_h:"Ühendkuningriik: NHS-i kopsukontrolli bussid 2019–2023",err_net:"Salvestamine ebaõnnestus. Proovi hetke pärast uuesti.",nav:"Ootenimekirja",badge:"Pilootprojekt",h1:"Tasuta kopsukontroll tuleb sinu lähedale",lead:"Polku hoitoon buss toob kiire kopsukontrolli kodu lähedale piirkondadesse, kus kopsuvähk nõuab kõige rohkem elusid ja haiglasse on pikk maa. Liitu ootenimekirjaga ja anname teada, kui buss on sinu lähedal.",cta:"Liitu ootenimekirjaga",s1:"avastatud varakult (staadium 1–2)",s2:"kopsuvähki avastatud",s3:"bussid teel alates",why_h:"Miks kopsud?",why1:"Varajane kopsuvähk on sageli sümptomiteta. Kui sümptomid tekivad, on haigus tavaliselt juba levinud.",why2:"Varakult avastatuna saab seda sageli operatsiooniga ravida.",why3:"Soomes on kopsuvähiga meestest 5 aasta pärast elus vaid 17 %. Norras on see 30 %.",uk_h:"Ühendkuningriigis see juba toimib",uk_p:"Alates 2019. aastast on NHS-i kopsukontrolli bussid peatunud kaupluste ja spordiväljakute parklates piirkondades, kus kopsuvähi suremus on suurim. Need on avastanud üle 5000 kopsuvähi, neist 76 % varajases staadiumis.",uk_p2:"Madalama sotsiaalmajandusliku staatusega piirkondade elanikud saavad nüüd sagedamini diagnoosi õigel ajal.",who_h:"Kellele?",who_p:"55–74-aastastele, kes suitsetavad või on suitsetanud.",sym_h:"Ära oota bussi, kui sul on sümptomid",sym_p:"Pöördu terviseasutusse, kui oled köhinud üle 3 nädala, köhid verd või kaotad kaalu ilma põhjuseta.",form_h:"Liitu ootenimekirjaga",f_name:"Eesnimi",f_contact:"Telefon või e-post",f_post:"Postiindeks",f_age:"Kas oled 55–74-aastane ja suitsetad või oled suitsetanud?",yes:"Jah",no:"Ei",unsure:"Ei tea",f_consent:"Polku hoitoon võib minuga kopsukontrolli asjus ühendust võtta. Võin igal ajal paluda oma andmed kustutada.",submit:"Liitu",ok:"Aitäh! Oled nimekirjas. Võtame sinuga ühendust sinu keeles.",err_fill:"Täida kontakt ja postiindeks ning märgi nõusolek.",demo:"Demorežiim: registreerimist ei salvestatud. Salvestamine toimib muutmisõigusega meeskonnaliikmetele.",note:"See ei ole veel päris teenus, kuid see võib tulla. Selle ootenimekirjaga mõõdame huvi: kas sellist teenust tasub luua? Kontseptsioon on Junction 2026 meeskonnalt, aegu veel ei broneerita."},
ar:{jx:"ما هو Junction؟ Junction هاكاثون دولي يُقام سنويًا في هلسنكي، تطوّر فيه الفرق خلال عطلة نهاية الأسبوع حلولًا لتحديات تطرحها شركات ومنظمات. وُلدت هذه الفكرة هناك ضمن تحدي AstraZeneca.",app_link:"شاهد أيضًا تطبيق Polku hoitoon",brand:"Polku hoitoon",who_lbl:"من تسجّل؟",me:"نفسي",rel:"أحد أقاربي",rel_help:"أدخل رقم هاتف قريبك، أو رقمك إذا كنت ستنقل المعلومات إليه.",count_t:"شخصًا في قائمة الانتظار",top_h:"أكثر المناطق تسجيلًا",vote_p:"كل تسجيل هو صوت لجلب الحافلة إلى منطقتك.",area:"المنطقة البريدية",share_h:"هل تعرف شخصًا يناسبه هذا؟",share_p:"أرسل الرابط إلى أحد والديك مثلًا. تختار الصفحة لغته تلقائيًا.",wa:"أرسل عبر واتساب",copy:"انسخ الرابط",copied:"تم نسخ الرابط",share_msg:"قد يكون فحص مجاني للرئتين قادمًا بالقرب منك. انضم إلى قائمة الانتظار:",faq_h:"أسئلة شائعة",q1:"هل هناك تكلفة؟",a1:"الخطة أن يكون الفحص مجانيًا. الانضمام إلى قائمة الانتظار مجاني دائمًا.",q2:"هل الفحص آمن؟",a2:"يستخدم فحص الرئة تصويرًا مقطعيًا منخفض الجرعة بجرعة إشعاع صغيرة. تشرح لك الممرضة الفوائد والمخاطر قبل الفحص.",q3:"من يرى بياناتي؟",a3:"فريق Junction 2026 فقط. نستخدمها فقط لقياس الاهتمام وللتواصل معك إذا بدأ مشروع تجريبي. نحذفها عند الطلب. info@polkuhoitoon.fi",q4:"هل أحتاج إلى إحالة؟",a4:"لا. إذا كانت لديك أعراض بالفعل، لا تنتظر الحافلة وتواصل مع المركز الصحي.",stats_h:"المملكة المتحدة: شاحنات فحص الرئة التابعة لـ NHS، 2019–2023",err_net:"تعذّر الحفظ. يرجى المحاولة مرة أخرى بعد قليل.",nav:"قائمة الانتظار",badge:"مشروع تجريبي",h1:"فحص مجاني للرئتين قادم إلى منطقتك",lead:"تجلب حافلة Polku hoitoon فحصًا سريعًا للرئتين بالقرب من منزلك، في المناطق التي يحصد فيها سرطان الرئة أكبر عدد من الأرواح ويكون المستشفى بعيدًا. انضم إلى قائمة الانتظار وسنخبرك عندما تقترب الحافلة منك.",cta:"انضم إلى قائمة الانتظار",s1:"اكتُشفت مبكرًا (المرحلة 1–2)",s2:"حالة سرطان رئة اكتُشفت",s3:"الشاحنات تعمل منذ",why_h:"لماذا الرئتان؟",why1:"غالبًا ما يكون سرطان الرئة المبكر بلا أعراض. وعندما تظهر الأعراض يكون قد انتشر عادةً.",why2:"إذا اكتُشف مبكرًا، يمكن غالبًا علاجه بالجراحة.",why3:"في فنلندا، 17٪ فقط من الرجال المصابين بسرطان الرئة على قيد الحياة بعد 5 سنوات. وفي النرويج 30٪.",uk_h:"هذا يعمل بالفعل في المملكة المتحدة",uk_p:"منذ عام 2019، تقف شاحنات فحص الرئة التابعة لـ NHS في مواقف السوبرماركت والملاعب في المناطق الأعلى وفيات بسرطان الرئة. وقد اكتشفت أكثر من 5000 حالة سرطان رئة، 76٪ منها في مرحلة مبكرة.",uk_p2:"أصبح سكان المناطق ذات الوضع الاجتماعي والاقتصادي الأدنى الآن أكثر عرضة للتشخيص المبكر.",who_h:"لمن هذا الفحص؟",who_p:"للأشخاص بين 55 و74 عامًا الذين يدخنون أو كانوا يدخنون.",sym_h:"لا تنتظر الحافلة إذا كانت لديك أعراض",sym_p:"تواصل مع المركز الصحي إذا استمر السعال أكثر من 3 أسابيع، أو سعلت دمًا، أو فقدت وزنك دون سبب.",form_h:"انضم إلى قائمة الانتظار",f_name:"الاسم الأول",f_contact:"الهاتف أو البريد الإلكتروني",f_post:"الرمز البريدي",f_age:"هل عمرك بين 55 و74 عامًا وتدخن أو كنت تدخن؟",yes:"نعم",no:"لا",unsure:"لست متأكدًا",f_consent:"أوافق على أن تتواصل معي Polku hoitoon بشأن فحص الرئة. يمكنني طلب حذف بياناتي في أي وقت.",submit:"انضم",ok:"شكرًا! أنت في القائمة. سنتواصل معك بلغتك.",err_fill:"يرجى إدخال وسيلة التواصل والرمز البريدي ووضع علامة على الموافقة.",demo:"وضع العرض التجريبي: لم يُحفظ تسجيلك. الحفظ متاح لأعضاء الفريق الذين لديهم صلاحية التعديل.",note:"هذه ليست خدمة حقيقية بعد، لكنها قد تأتي قريبًا. نقيس من خلال قائمة الانتظار هذه مدى الاهتمام: هل تستحق خدمة كهذه أن تُنشأ؟ الفكرة من فريق Junction 2026، ولا يتم حجز مواعيد بعد."},
so:{jx:"Waa maxay Junction? Junction waa hackathon caalami ah oo sannad kasta lagu qabto Helsinki, halkaas oo kooxuhu dhammaadka toddobaadka ku dhisaan xalal loogu talagalay caqabadaha ay soo bandhigaan shirkadaha iyo hay'adaha. Fikraddan halkaas ayay ka dhalatay, caqabadda AstraZeneca.",app_link:"Sidoo kale eeg app-ka Polku hoitoon",brand:"Polku hoitoon",who_lbl:"Yaad diiwaangelinaysaa?",me:"Naftayda",rel:"Qof qoyskayga ah",rel_help:"Qor lambarka telefoonka qofka qoyskaaga ah, ama kaaga haddii aad warka u gudbin doonto.",count_t:"qof ayaa ku jira liiska",top_h:"Diiwaangelinta ugu badan",vote_p:"Diiwaangelin kastaa waa cod in baska la keeno aaggiinna.",area:"aagga boostada",share_h:"Ma taqaannaa qof ay tani ku habboon tahay?",share_p:"U dir xiriirka tusaale ahaan waalidkaa. Boggu wuxuu si toos ah u doortaa luqaddiisa.",wa:"Ku dir WhatsApp",copy:"Koobiyee xiriirka",copied:"Xiriirka waa la koobiyeeyay",share_msg:"Baaritaan sambabada oo bilaash ah ayaa laga yaabaa inuu kuu soo dhowaado. Ku biir liiska sugitaanka:",faq_h:"Su'aalaha caadiga ah",q1:"Lacag ma ku baxaysaa?",a1:"Qorshuhu waa in baaritaanku noqdo bilaash. Ku biiridda liiska sugitaanka had iyo jeer waa bilaash.",q2:"Baaritaanku ma ammaan baa?",a2:"Baaritaanka sambabada waxaa loo isticmaalaa CT-scan shucaac yar leh. Kalkaalisadu waxay kuu sharxi doontaa faa'iidooyinka iyo khataraha ka hor baaritaanka.",q3:"Yaa arkaya xogtayda?",a3:"Kaliya kooxda Junction 2026. Waxaan u isticmaalnaa oo kaliya cabbirka xiisaha iyo inaan kula soo xiriirno haddii mashruuc tijaabo ah bilaabmo. Waan tirtiraynaa markaad codsato. info@polkuhoitoon.fi",q4:"Ma u baahanahay gudbin?",a4:"Maya. Haddii aad horey calaamado u qabto, ha sugin baska ee la xiriir xarunta caafimaadka.",stats_h:"UK: gawaarida baaritaanka sambabada ee NHS, 2019–2023",err_net:"Lama kaydin karin. Fadlan isku day mar kale wax yar kadib.",nav:"Liiska sugitaanka",badge:"Mashruuc tijaabo ah",h1:"Baaritaan sambabada oo bilaash ah ayaa imanaya xaafaddaada",lead:"Baska Polku hoitoon wuxuu baaritaan degdeg ah oo sambabada ah u keenaa meel u dhow gurigaaga, meelaha uu kansarka sambabadu dilo dad badan isbitaalkuna fog yahay. Ku biir liiska sugitaanka, waxaanan kuu sheegi doonnaa marka baska kuu soo dhowaado.",cta:"Ku biir liiska sugitaanka",s1:"goor hore la helay (marxaladda 1–2)",s2:"kansar sambabada la helay",s3:"gawaaridu waxay shaqaynayeen tan iyo",why_h:"Maxay sambabada?",why1:"Kansarka sambabada ee hore inta badan calaamado ma leh. Marka calaamaduhu soo baxaan, badanaa wuu faafay.",why2:"Haddii goor hore la helo, inta badan waxaa lagu daaweyn karaa qalliin.",why3:"Finland, kaliya 17% ragga qaba kansarka sambabada ayaa nool 5 sano kadib. Norway waa 30%.",uk_h:"Waxay horey uga shaqaysaa UK",uk_p:"Laga soo bilaabo 2019, gawaarida baaritaanka sambabada ee NHS waxay istaagaan baarkinka suuqyada iyo garoomada meelaha uu kansarka sambabadu ugu dhimasho badan yahay. Waxay heleen in ka badan 5,000 kansar sambabada, 76% marxaladda hore.",uk_p2:"Dadka ku nool meelaha xaaladda dhaqan-dhaqaale ee hoose hadda waxay u badan yihiin in goor hore la ogaado.",who_h:"Yaa loogu talagalay?",who_p:"Dadka da'doodu tahay 55–74 ee sigaar cabba ama horey u cabbi jiray.",sym_h:"Ha sugin baska haddii aad calaamado qabto",sym_p:"La xiriir xarunta caafimaadka haddii aad qufac qabtay in ka badan 3 toddobaad, aad dhiig qufacdo, ama miisaankaagu hoos u dhaco adigoon isku dayin.",form_h:"Ku biir liiska sugitaanka",f_name:"Magaca koowaad",f_contact:"Telefoon ama iimayl",f_post:"Koodka boostada",f_age:"Ma tahay 55–74 jir oo sigaar cabba ama horey u cabbi jiray?",yes:"Haa",no:"Maya",unsure:"Ma hubo",f_consent:"Waxaan oggolahay in Polku hoitoon ila soo xiriirto baaritaanka sambabada. Waxaan codsan karaa in xogtayda la tirtiro waqti kasta.",submit:"Ku biir",ok:"Mahadsanid! Waxaad ku jirtaa liiska. Waxaan kugula soo xiriiri doonnaa luqaddaada.",err_fill:"Fadlan buuxi xiriirka iyo koodka boostada, oo calaamadee oggolaanshaha.",demo:"Hab tijaabo: diiwaangelintaada lama kaydin. Kaydintu waxay u shaqaysaa xubnaha kooxda ee leh fasax wax-ka-beddel.",note:"Tani weli ma aha adeeg dhab ah, laakiin wuu iman karaa. Liiskan sugitaanka waxaan ku cabbirnaa xiisaha: ma mudan tahay in adeeg noocan oo kale la sameeyo? Fikradda waxaa sameeyay koox Junction 2026, ballamo weli lama qabanayo."},
uk:{jx:"Що таке Junction? Junction — міжнародний хакатон, який щороку проходить у Гельсінкі. За вихідні команди створюють рішення для завдань від компаній та організацій. Цей концепт народився там у межах завдання від AstraZeneca.",app_link:"Дивіться також застосунок Polku hoitoon",brand:"Polku hoitoon",who_lbl:"Кого ви записуєте?",me:"Себе",rel:"Близьку людину",rel_help:"Вкажіть телефон близької людини або свій, якщо ви передасте їй інформацію.",count_t:"людей у списку очікування",top_h:"Найбільше записів",vote_p:"Кожен запис — це голос за те, щоб автобус приїхав у ваш район.",area:"поштовий район",share_h:"Знаєте, кому це підійде?",share_p:"Надішліть посилання, наприклад, батькам. Сторінка сама вибере їхню мову.",wa:"Надіслати у WhatsApp",copy:"Скопіювати посилання",copied:"Посилання скопійовано",share_msg:"Безкоштовна перевірка легень може незабаром з'явитися поруч із вами. Запишіться до списку очікування:",faq_h:"Часті запитання",q1:"Це платно?",a1:"Планується, що перевірка буде безкоштовною. Запис до списку очікування завжди безкоштовний.",q2:"Чи безпечне обстеження?",a2:"Під час скринінгу легень використовують низькодозову КТ з невеликою дозою опромінення. Медсестра розповість про користь і ризики перед обстеженням.",q3:"Хто бачить мої дані?",a3:"Лише команда Junction 2026. Ми використовуємо їх лише для оцінки інтересу та щоб зв'язатися з вами, якщо почнеться пілот. Видалимо їх на запит. info@polkuhoitoon.fi",q4:"Чи потрібне направлення?",a4:"Ні. Якщо у вас уже є симптоми, не чекайте автобуса — зверніться до медичного центру.",stats_h:"Велика Британія: пересувні пункти перевірки легень NHS, 2019–2023",err_net:"Не вдалося зберегти. Спробуйте ще раз трохи пізніше.",nav:"До списку",badge:"Пілотний проєкт",h1:"Безкоштовна перевірка легень їде до вашого району",lead:"Автобус Polku hoitoon привозить швидку перевірку легень ближче до дому — у райони, де рак легень забирає найбільше життів, а до лікарні далеко. Запишіться до списку очікування, і ми повідомимо, коли автобус буде поруч.",cta:"Записатися до списку очікування",s1:"виявлено на ранній стадії (1–2)",s2:"випадків раку легень виявлено",s3:"пункти працюють з",why_h:"Чому легені?",why1:"Ранній рак легень часто не має симптомів. Коли вони з'являються, хвороба зазвичай уже поширилася.",why2:"Якщо виявити його рано, його часто можна вилікувати операцією.",why3:"У Фінляндії лише 17 % чоловіків з раком легень живі через 5 років. У Норвегії — 30 %.",uk_h:"У Великій Британії це вже працює",uk_p:"З 2019 року пересувні пункти перевірки легень NHS стоять на парковках супермаркетів і стадіонів у районах з найвищою смертністю від раку легень. Вони виявили понад 5000 випадків раку легень, 76 % — на ранній стадії.",uk_p2:"Мешканці районів із нижчим соціально-економічним статусом тепер частіше отримують діагноз вчасно.",who_h:"Для кого?",who_p:"Для людей 55–74 років, які курять або курили.",sym_h:"Якщо є симптоми — не чекайте автобуса",sym_p:"Зверніться до медичного центру, якщо кашель триває понад 3 тижні, ви кашляєте кров'ю або худнете без причини.",form_h:"Записатися до списку очікування",f_name:"Ім'я",f_contact:"Телефон або e-mail",f_post:"Поштовий індекс",f_age:"Вам 55–74 роки і ви курите або курили?",yes:"Так",no:"Ні",unsure:"Не впевнений(а)",f_consent:"Polku hoitoon може зв'язатися зі мною щодо перевірки легень. Я можу будь-коли попросити видалити мої дані.",submit:"Записатися",ok:"Дякуємо! Ви в списку. Ми зв'яжемося з вами вашою мовою.",err_fill:"Вкажіть контакт та індекс і позначте згоду.",demo:"Демо-режим: запис не збережено. Збереження працює для членів команди з правом редагування.",note:"Це ще не справжня послуга, але вона може з'явитися. За допомогою цього списку очікування ми вимірюємо інтерес: чи варто створювати таку послугу? Концепт команди Junction 2026, запис на прийом поки не ведеться."}

var TEAMT = {"fi": {"team_h": "Keitä me olemme", "team_p": "Olemme Polku Labs: Olivia Saukonoja ja Ida Oittinen. Kehitimme Polku hoitoon -konseptin Junction 2026 -hackathonissa AstraZenecan haasteeseen. Olivia on ohjelmistokehittäjä ja tekoälyasiantuntija ja opiskelee kestävää yrittäjyyttä Aalto-yliopistossa. Ida opiskelee tuotantotaloutta Aalto-yliopistossa. Hän teki opinnäytetyönsä julkisen terveydenhuollon jonotusajoista ja on tutkinut tekoälyn käyttöönottoa julkisessa terveydenhuollossa. Konsepti perustuu julkisiin tilastoihin ja AstraZenecan asiantuntijoiden haastatteluihin."}, "sv": {"team_h": "Vilka vi är", "team_p": "Vi är Polku Labs: Olivia Saukonoja och Ida Oittinen. Vi tog fram konceptet Polku hoitoon vid hackathonet Junction 2026, för AstraZenecas utmaning. Olivia är mjukvaruutvecklare och AI-expert och studerar hållbart företagande vid Aalto-universitetet. Ida studerar produktionsekonomi vid Aalto-universitetet. Hon skrev sitt lärdomsprov om väntetider i den offentliga vården och har forskat i införandet av AI i den offentliga hälso- och sjukvården. Konceptet bygger på offentlig statistik och intervjuer med AstraZenecas experter."}, "en": {"team_h": "Who we are", "team_p": "We are Polku Labs: Olivia Saukonoja and Ida Oittinen. We created the Polku hoitoon concept at the Junction 2026 hackathon, for AstraZeneca's challenge. Olivia is a software developer and AI specialist studying sustainable entrepreneurship at Aalto University. Ida studies industrial engineering and management at Aalto University. She wrote her thesis on waiting times in Finnish public healthcare and has researched the adoption of AI in public healthcare. The concept is based on public statistics and interviews with AstraZeneca's experts."}, "ru": {"team_h": "Кто мы", "team_p": "Мы — Polku Labs: Оливия Сауконоя и Ида Ойттинен. Мы создали концепт Polku hoitoon на хакатоне Junction 2026 для задачи AstraZeneca. Оливия — разработчик программного обеспечения и специалист по ИИ, изучает устойчивое предпринимательство в университете Аалто. Ида изучает промышленную инженерию и менеджмент в университете Аалто. Она написала дипломную работу о сроках ожидания в государственном здравоохранении и исследовала внедрение ИИ в государственном здравоохранении. Концепт основан на открытой статистике и интервью с экспертами AstraZeneca."}, "et": {"team_h": "Kes me oleme", "team_p": "Oleme Polku Labs: Olivia Saukonoja ja Ida Oittinen. Lõime Polku hoitoon kontseptsiooni Junction 2026 häkatonil AstraZeneca väljakutse jaoks. Olivia on tarkvaraarendaja ja tehisintellekti ekspert ning õpib Aalto ülikoolis jätkusuutlikku ettevõtlust. Ida õpib Aalto ülikoolis tööstustehnikat ja juhtimist. Ta kirjutas lõputöö avaliku tervishoiu ootejärjekordadest ning on uurinud tehisintellekti kasutuselevõttu avalikus tervishoius. Kontseptsioon põhineb avalikul statistikal ja AstraZeneca ekspertide intervjuudel."}, "ar": {"team_h": "من نحن", "team_p": "نحن Polku Labs: أوليفيا ساوكونويا وإيدا أويتينن. طوّرنا فكرة Polku hoitoon في هاكاثون Junction 2026 ضمن تحدي AstraZeneca. أوليفيا مطوّرة برمجيات ومتخصصة في الذكاء الاصطناعي وتدرس ريادة الأعمال المستدامة في جامعة آلتو. تدرس إيدا الهندسة الصناعية والإدارة في جامعة آلتو. كتبت أطروحتها عن أوقات الانتظار في الرعاية الصحية العامة، وأجرت أبحاثًا حول اعتماد الذكاء الاصطناعي في الرعاية الصحية العامة. تستند الفكرة إلى إحصاءات عامة ومقابلات مع خبراء AstraZeneca."}, "so": {"team_h": "Annaga waa kuma", "team_p": "Waxaan nahay Polku Labs: Olivia Saukonoja iyo Ida Oittinen. Fikradda Polku hoitoon waxaan ku samaynay hackathon-ka Junction 2026, caqabadda AstraZeneca. Olivia waa horumariye software iyo khabiir AI ah, waxayna Jaamacadda Aalto ka barataa ganacsiga waara. Ida waxay Jaamacadda Aalto ka barataa injineeriyadda warshadaha iyo maamulka. Waxay qortay qoraalkeeda waxbarasho ee ku saabsan waqtiyada sugitaanka daryeelka caafimaadka dadweynaha, waxayna cilmi-baaris ku samaysay adeegsiga AI ee daryeelka caafimaadka dadweynaha. Fikraddu waxay ku salaysan tahay tirakoob dadweyne iyo wareysiyo khubarada AstraZeneca."}, "uk": {"team_h": "Хто ми", "team_p": "Ми — Polku Labs: Олівія Сауконоя та Іда Ойттінен. Ми створили концепт Polku hoitoon на хакатоні Junction 2026 для завдання AstraZeneca. Олівія — розробниця програмного забезпечення та фахівчиня зі ШІ, вивчає стале підприємництво в університеті Аалто. Іда вивчає промислову інженерію та менеджмент в університеті Аалто. Вона написала дипломну роботу про час очікування в державній охороні здоров'я та досліджувала впровадження ШІ в державній охороні здоров'я. Концепт базується на відкритій статистиці та інтерв'ю з експертами AstraZeneca."}};

var APPQ = {"fi": {"aq1": "Maksaako sovellus jotain?", "aa1": "Ei maksa. Sovellus on asiakkaille ja potilaille maksuton, ja myös jonoon ilmoittautuminen on maksutonta. Alustavassa mallissa palvelun tarjoaa hyvinvointialue osana julkista terveydenhuoltoa.", "aq2": "Tekeekö sovellus diagnoosin?", "aa2": "Ei. Sovellus kerää oireesi ja välittää ne hoitajalle. Hoitaja tai lääkäri päättää aina jatkosta.", "aq3": "Millä kielillä sovellus toimii?", "aa3": "Tavoitteena on suomi, ruotsi, saame ja suurimmat muut kielet, kuten venäjä, viro, arabia, somali ja ukraina.", "aq4": "Miten tiedot haetaan OmaKannasta?", "aa4": "Kanta-palveluissa on rajapinta, jonka kautta käyttäjä voi omalla luvallaan hakea Kantaan tallennetut potilastietonsa sovellukseen. Luvan voi perua milloin tahansa OmaKannassa. Sovelluksen pitää läpäistä tietoturvasertifiointi ennen käyttöä.", "aq5": "Kuka näkee tietoni?", "aa5": "Vain Junction 2026 -tiimi. Käytämme tietoja vain kiinnostuksen mittaamiseen ja yhteydenottoon, jos pilotti alkaa. Poistamme tiedot pyynnöstä: info@polkuhoitoon.fi"}, "sv": {"aq1": "Kostar appen något?", "aa1": "Nej. Appen är gratis för klienter och patienter, och det är också gratis att anmäla sig till kön. I den preliminära modellen erbjuds tjänsten av välfärdsområdet som en del av den offentliga hälso- och sjukvården.", "aq2": "Ställer appen en diagnos?", "aa2": "Nej. Appen samlar dina symtom och skickar dem till sjukskötaren. En sjukskötare eller läkare beslutar alltid om fortsättningen.", "aq3": "Vilka språk fungerar appen på?", "aa3": "Målet är finska, svenska, samiska och de största andra språken, som ryska, estniska, arabiska, somaliska och ukrainska.", "aq4": "Hur hämtas uppgifterna från Kanta?", "aa4": "Kanta-tjänsterna har ett gränssnitt där användaren med sitt eget tillstånd kan hämta sina patientuppgifter till en app. Tillståndet kan återkallas när som helst på Mina Kanta-sidor. Appen måste klara en datasäkerhetscertifiering innan den tas i bruk.", "aq5": "Vem ser mina uppgifter?", "aa5": "Bara Junction 2026-teamet. Vi använder uppgifterna bara för att mäta intresset och kontakta dig om en pilot startar. Vi raderar dem på begäran: info@polkuhoitoon.fi"}, "en": {"aq1": "Does the app cost anything?", "aa1": "No. The app is free for clients and patients, and joining the waitlist is free too. In the preliminary model, the service is provided by the wellbeing services county as part of public healthcare.", "aq2": "Does the app diagnose me?", "aa2": "No. The app collects your symptoms and passes them to a nurse. A nurse or doctor always decides what happens next.", "aq3": "Which languages will it support?", "aa3": "The goal is Finnish, Swedish, Sámi and the largest other languages, such as Russian, Estonian, Arabic, Somali and Ukrainian.", "aq4": "How is data fetched from Kanta?", "aa4": "Kanta Services has an interface through which users can, with their own permission, fetch their patient records into an app. Permission can be withdrawn at any time in MyKanta. The app must pass a security certification before use.", "aq5": "Who sees my details?", "aa5": "Only the Junction 2026 team. We use them only to measure interest and to contact you if a pilot starts. We delete them on request: info@polkuhoitoon.fi"}, "ru": {"aq1": "Приложение платное?", "aa1": "Нет. Приложение бесплатно для клиентов и пациентов, запись в лист ожидания тоже бесплатна. В предварительной модели услугу предоставляет регион благосостояния (hyvinvointialue) в рамках государственного здравоохранения.", "aq2": "Ставит ли приложение диагноз?", "aa2": "Нет. Приложение собирает ваши симптомы и передаёт их медсестре. Решение всегда принимает медсестра или врач.", "aq3": "На каких языках работает приложение?", "aa3": "Цель — финский, шведский, саамский и крупнейшие другие языки: русский, эстонский, арабский, сомалийский и украинский.", "aq4": "Как данные загружаются из OmaKanta?", "aa4": "В сервисах Kanta есть интерфейс, через который пользователь со своего разрешения может загрузить свои медицинские данные в приложение. Разрешение можно отозвать в любой момент в OmaKanta. Приложение должно пройти сертификацию безопасности.", "aq5": "Кто видит мои данные?", "aa5": "Только команда Junction 2026. Мы используем их только для оценки интереса и чтобы связаться с вами, если начнётся пилот. Удалим их по запросу: info@polkuhoitoon.fi"}, "et": {"aq1": "Kas rakendus maksab midagi?", "aa1": "Ei. Rakendus on klientidele ja patsientidele tasuta, ka ootenimekirjaga liitumine on tasuta. Esialgse mudeli järgi pakub teenust heaoluteenuste piirkond (hyvinvointialue) osana avalikku tervishoidu.", "aq2": "Kas rakendus paneb diagnoosi?", "aa2": "Ei. Rakendus kogub sinu sümptomid ja edastab need õele. Edasise üle otsustab alati õde või arst.", "aq3": "Mis keeltes rakendus töötab?", "aa3": "Eesmärk on soome, rootsi, saami ja suurimad muud keeled, nagu vene, eesti, araabia, somaali ja ukraina.", "aq4": "Kuidas andmed OmaKantast tuuakse?", "aa4": "Kanta teenustel on liides, mille kaudu kasutaja saab oma loal tuua Kantasse salvestatud patsiendiandmed rakendusse. Loa saab igal ajal OmaKantas tagasi võtta. Rakendus peab enne kasutamist läbima turvasertifitseerimise.", "aq5": "Kes näeb minu andmeid?", "aa5": "Ainult Junction 2026 meeskond. Kasutame andmeid ainult huvi mõõtmiseks ja sinuga ühenduse võtmiseks, kui pilootprojekt algab. Kustutame need soovi korral: info@polkuhoitoon.fi"}, "ar": {"aq1": "هل التطبيق مدفوع؟", "aa1": "لا. التطبيق مجاني للعملاء والمرضى، والانضمام إلى قائمة الانتظار مجاني أيضًا. في النموذج الأولي، تقدم الخدمةَ منطقةُ خدمات الرفاه (hyvinvointialue) كجزء من الرعاية الصحية العامة.", "aq2": "هل يشخّص التطبيق حالتي؟", "aa2": "لا. يجمع التطبيق أعراضك ويرسلها إلى الممرضة. الممرضة أو الطبيب يقرر دائمًا الخطوة التالية.", "aq3": "ما اللغات التي يدعمها التطبيق؟", "aa3": "الهدف هو الفنلندية والسويدية والسامية وأكبر اللغات الأخرى مثل الروسية والإستونية والعربية والصومالية والأوكرانية.", "aq4": "كيف تُجلب البيانات من OmaKanta؟", "aa4": "لدى خدمات Kanta واجهة يمكن للمستخدم من خلالها، بإذنه، جلب بياناته الصحية إلى التطبيق. يمكن سحب الإذن في أي وقت في OmaKanta. يجب أن يجتاز التطبيق شهادة أمان قبل الاستخدام.", "aq5": "من يرى بياناتي؟", "aa5": "فريق Junction 2026 فقط. نستخدمها فقط لقياس الاهتمام وللتواصل معك إذا بدأ مشروع تجريبي. نحذفها عند الطلب: info@polkuhoitoon.fi"}, "so": {"aq1": "Lacag ma ku baxaysaa app-ka?", "aa1": "Maya. App-ku waa bilaash macaamiisha iyo bukaannada, ku biiridda liiska sugitaankuna waa bilaash. Qaabka hordhaca ah, adeegga waxaa bixiya gobolka adeegyada daryeelka (hyvinvointialue) iyadoo qayb ka ah daryeelka caafimaadka dadweynaha.", "aq2": "App-ku ma i baarayaa (diagnosis)?", "aa2": "Maya. App-ku wuxuu ururiyaa calaamadahaaga oo u gudbiyaa kalkaalisada. Kalkaalisada ama dhakhtarka ayaa had iyo jeer go'aamiya waxa xiga.", "aq3": "Luqadee ayuu app-ku ku shaqeeyaa?", "aa3": "Hadafku waa Finnish, Swedish, Sámi iyo luqadaha kale ee ugu waaweyn sida Ruush, Estonian, Carabi, Soomaali iyo Ukrainian.", "aq4": "Sidee xogta looga keenaa OmaKanta?", "aa4": "Adeegyada Kanta waxay leeyihiin interface uu isticmaaluhu, oggolaanshihiisa, ku keeni karo xogtiisa caafimaad app-ka. Oggolaanshaha waqti kasta waa laga noqon karaa OmaKanta. App-ku waa inuu dhaafaa shahaado ammaan ka hor isticmaalka.", "aq5": "Yaa arkaya xogtayda?", "aa5": "Kaliya kooxda Junction 2026. Waxaan u isticmaalnaa oo kaliya cabbirka xiisaha iyo inaan kula soo xiriirno haddii mashruuc tijaabo ah bilaabmo. Waan tirtiraynaa markaad codsato: info@polkuhoitoon.fi"}, "uk": {"aq1": "Застосунок платний?", "aa1": "Ні. Застосунок безкоштовний для клієнтів і пацієнтів, запис до списку очікування теж безкоштовний. У попередній моделі послугу надає регіон добробуту (hyvinvointialue) у межах державної охорони здоров'я.", "aq2": "Чи ставить застосунок діагноз?", "aa2": "Ні. Застосунок збирає ваші симптоми й передає їх медсестрі. Рішення завжди ухвалює медсестра або лікар.", "aq3": "Якими мовами працює застосунок?", "aa3": "Мета — фінська, шведська, саамська та найпоширеніші інші мови: російська, естонська, арабська, сомалійська й українська.", "aq4": "Як дані завантажуються з OmaKanta?", "aa4": "У сервісах Kanta є інтерфейс, через який користувач зі свого дозволу може завантажити свої медичні дані в застосунок. Дозвіл можна відкликати будь-коли в OmaKanta. Застосунок має пройти сертифікацію безпеки перед використанням.", "aq5": "Хто бачить мої дані?", "aa5": "Лише команда Junction 2026. Ми використовуємо їх лише для оцінки інтересу та щоб зв'язатися з вами, якщо почнеться пілот. Видалимо їх на запит: info@polkuhoitoon.fi"}};
