<script>
var T = {"fi": {"h1": "Tietoa meistä", "p": "Olemme Polku Labs: Olivia Saukonoja ja Ida Oittinen. Kehitimme Polku hoitoon -konseptin Junction 2026 -hackathonissa AstraZenecan haasteeseen. Olivia on ohjelmistokehittäjä ja tekoälyasiantuntija ja opiskelee kestävää yrittäjyyttä Aalto-yliopistossa. Ida opiskelee tuotantotaloutta Aalto-yliopistossa. Hän teki opinnäytetyönsä julkisen terveydenhuollon jonotusajoista ja on tutkinut tekoälyn käyttöönottoa julkisessa terveydenhuollossa. Konsepti perustuu julkisiin tilastoihin ja AstraZenecan asiantuntijoiden haastatteluihin.", "bus": "Seulontabussi", "app": "Sovellus", "jx": "Mikä on Junction? Junction on Helsingissä vuosittain järjestettävä kansainvälinen hackathon, jossa tiimit kehittävät viikonlopun aikana ratkaisuja yritysten ja organisaatioiden antamiin haasteisiin. Tämä konsepti on syntynyt siellä AstraZenecan haasteessa."}, "sv": {"h1": "Om oss", "p": "Vi är Polku Labs: Olivia Saukonoja och Ida Oittinen. Vi tog fram konceptet Polku hoitoon vid hackathonet Junction 2026, för AstraZenecas utmaning. Olivia är mjukvaruutvecklare och AI-expert och studerar hållbart företagande vid Aalto-universitetet. Ida studerar produktionsekonomi vid Aalto-universitetet. Hon skrev sitt lärdomsprov om väntetider i den offentliga vården och har forskat i införandet av AI i den offentliga hälso- och sjukvården. Konceptet bygger på offentlig statistik och intervjuer med AstraZenecas experter.", "bus": "Screeningbussen", "app": "Appen", "jx": "Vad är Junction? Junction är ett internationellt hackathon som ordnas varje år i Helsingfors. Under en helg utvecklar team lösningar på utmaningar från företag och organisationer. Det här konceptet har tagits fram där, i AstraZenecas utmaning."}, "en": {"h1": "About us", "p": "We are Polku Labs: Olivia Saukonoja and Ida Oittinen. We created the Polku hoitoon concept at the Junction 2026 hackathon, for AstraZeneca's challenge. Olivia is a software developer and AI specialist studying sustainable entrepreneurship at Aalto University. Ida studies industrial engineering and management at Aalto University. She wrote her thesis on waiting times in Finnish public healthcare and has researched the adoption of AI in public healthcare. The concept is based on public statistics and interviews with AstraZeneca's experts.", "bus": "Screening bus", "app": "App", "jx": "What is Junction? Junction is an international hackathon held every year in Helsinki, where teams spend a weekend building solutions to challenges set by companies and organisations. This concept was created there, for AstraZeneca's challenge."}, "ru": {"h1": "О нас", "p": "Мы — Polku Labs: Оливия Сауконоя и Ида Ойттинен. Мы создали концепт Polku hoitoon на хакатоне Junction 2026 для задачи AstraZeneca. Оливия — разработчик программного обеспечения и специалист по ИИ, изучает устойчивое предпринимательство в университете Аалто. Ида изучает промышленную инженерию и менеджмент в университете Аалто. Она написала дипломную работу о сроках ожидания в государственном здравоохранении и исследовала внедрение ИИ в государственном здравоохранении. Концепт основан на открытой статистике и интервью с экспертами AstraZeneca.", "bus": "Автобус скрининга", "app": "Приложение", "jx": "Что такое Junction? Junction — международный хакатон, который ежегодно проходит в Хельсинки. За выходные команды разрабатывают решения задач, поставленных компаниями и организациями. Этот концепт создан там для задачи от AstraZeneca."}, "et": {"h1": "Meist", "p": "Oleme Polku Labs: Olivia Saukonoja ja Ida Oittinen. Lõime Polku hoitoon kontseptsiooni Junction 2026 häkatonil AstraZeneca väljakutse jaoks. Olivia on tarkvaraarendaja ja tehisintellekti ekspert ning õpib Aalto ülikoolis jätkusuutlikku ettevõtlust. Ida õpib Aalto ülikoolis tööstustehnikat ja juhtimist. Ta kirjutas lõputöö avaliku tervishoiu ootejärjekordadest ning on uurinud tehisintellekti kasutuselevõttu avalikus tervishoius. Kontseptsioon põhineb avalikul statistikal ja AstraZeneca ekspertide intervjuudel.", "bus": "Sõeluuringubuss", "app": "Rakendus", "jx": "Mis on Junction? Junction on igal aastal Helsingis toimuv rahvusvaheline häkaton, kus meeskonnad töötavad nädalavahetuse jooksul välja lahendusi ettevõtete ja organisatsioonide väljakutsetele. See kontseptsioon sündis seal AstraZeneca väljakutse raames."}, "ar": {"h1": "من نحن", "p": "نحن Polku Labs: أوليفيا ساوكونويا وإيدا أويتينن. طوّرنا فكرة Polku hoitoon في هاكاثون Junction 2026 ضمن تحدي AstraZeneca. أوليفيا مطوّرة برمجيات ومتخصصة في الذكاء الاصطناعي وتدرس ريادة الأعمال المستدامة في جامعة آلتو. تدرس إيدا الهندسة الصناعية والإدارة في جامعة آلتو. كتبت أطروحتها عن أوقات الانتظار في الرعاية الصحية العامة، وأجرت أبحاثًا حول اعتماد الذكاء الاصطناعي في الرعاية الصحية العامة. تستند الفكرة إلى إحصاءات عامة ومقابلات مع خبراء AstraZeneca.", "bus": "حافلة الفحص", "app": "التطبيق", "jx": "ما هو Junction؟ Junction هاكاثون دولي يُقام سنويًا في هلسنكي، تطوّر فيه الفرق خلال عطلة نهاية الأسبوع حلولًا لتحديات تطرحها شركات ومنظمات. وُلدت هذه الفكرة هناك ضمن تحدي AstraZeneca."}, "so": {"h1": "Nagu saabsan", "p": "Waxaan nahay Polku Labs: Olivia Saukonoja iyo Ida Oittinen. Fikradda Polku hoitoon waxaan ku samaynay hackathon-ka Junction 2026, caqabadda AstraZeneca. Olivia waa horumariye software iyo khabiir AI ah, waxayna Jaamacadda Aalto ka barataa ganacsiga waara. Ida waxay Jaamacadda Aalto ka barataa injineeriyadda warshadaha iyo maamulka. Waxay qortay qoraalkeeda waxbarasho ee ku saabsan waqtiyada sugitaanka daryeelka caafimaadka dadweynaha, waxayna cilmi-baaris ku samaysay adeegsiga AI ee daryeelka caafimaadka dadweynaha. Fikraddu waxay ku salaysan tahay tirakoob dadweyne iyo wareysiyo khubarada AstraZeneca.", "bus": "Baska baaritaanka", "app": "App-ka", "jx": "Waa maxay Junction? Junction waa hackathon caalami ah oo sannad kasta lagu qabto Helsinki, halkaas oo kooxuhu dhammaadka toddobaadka ku dhisaan xalal loogu talagalay caqabadaha ay soo bandhigaan shirkadaha iyo hay'adaha. Fikraddan halkaas ayay ka dhalatay, caqabadda AstraZeneca."}, "uk": {"h1": "Про нас", "p": "Ми — Polku Labs: Олівія Сауконоя та Іда Ойттінен. Ми створили концепт Polku hoitoon на хакатоні Junction 2026 для завдання AstraZeneca. Олівія — розробниця програмного забезпечення та фахівчиня зі ШІ, вивчає стале підприємництво в університеті Аалто. Іда вивчає промислову інженерію та менеджмент в університеті Аалто. Вона написала дипломну роботу про час очікування в державній охороні здоров'я та досліджувала впровадження ШІ в державній охороні здоров'я. Концепт базується на відкритій статистиці та інтерв'ю з експертами AstraZeneca.", "bus": "Автобус скринінгу", "app": "Застосунок", "jx": "Що таке Junction? Junction — міжнародний хакатон, який щороку проходить у Гельсінкі. За вихідні команди створюють рішення для завдань від компаній та організацій. Цей концепт народився там у межах завдання від AstraZeneca."}};
var sel = document.getElementById("lang");
function apply(l){
  if (!T[l]) l = "fi";
  document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(function(e){ e.textContent = T[l][e.getAttribute("data-t")]; });
  document.title = "Polku hoitoon – " + T[l].h1;
  try { localStorage.setItem("vayla-lang", l); } catch (e) {}
  sel.value = l;
}
var start = "";
try { start = localStorage.getItem("vayla-lang") || ""; } catch (e) {}
if (!start) start = (navigator.language || "fi").slice(0, 2);
apply(start);
sel.addEventListener("change", function(){ apply(sel.value); });
</script>
