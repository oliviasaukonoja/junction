<!DOCTYPE html>
<html lang="fi" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polku hoitoon – Pilottikartta</title>
<meta name="description" content="Keuhkosyövän TT-seulontapilottien ehdotetut alueet ja bussireitti Lapissa, Kymenlaaksossa ja Satakunnassa. Havaittu data, mallinnetut arviot ja oletukset eroteltu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/leaflet.css">
<style>
:root{color-scheme:light;--ink:#14213D;--muted:#4A5872;--blue:#1F5FD6;--blue-d:#123E91;--sky:#EAF1FF;--bg:#F5F7FB;--line:#E3E8F0;--orange-bg:#FFF3E6;--orange-ink:#8A3B00;
  --obs:#1F5FD6;--obs-bg:#EAF1FF;--mod:#C2570C;--mod-bg:#FFF3E6;--ass:#7A5A00;--ass-bg:#FFF7DB;--mis:#B42318;--mis-bg:#FEECEA;--hosp:#2A78D6;--bus:#E8731A}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;font-size:16px}
a{color:var(--blue)}a:hover{color:var(--blue-d)}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;line-height:1.15;margin:0;letter-spacing:-.01em}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;flex-wrap:wrap;padding:8px 0}
.logo{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:24px;color:var(--ink);text-decoration:none}
.bar-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
select,input[type=password]{font:inherit;font-size:15px;min-height:44px;padding:0 12px;border:1px solid #C9D2E0;border-radius:10px;background:#fff;color:var(--ink)}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted);text-decoration:none}
.tab:hover{color:var(--ink)}
.menu{position:relative;order:3}
.menu summary{list-style:none;cursor:pointer;min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;border:1px solid #C9D2E0;border-radius:10px;font-size:20px;background:#fff;color:var(--ink)}
.menu summary::-webkit-details-marker{display:none}
.menu-p{position:absolute;inset-inline-end:0;top:52px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(20,33,61,.14);padding:8px;min-width:230px;display:flex;flex-direction:column}
.menu-p a{padding:11px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
.menu-p a:hover{background:var(--bg)}
select:focus,.tab:focus,.menu summary:focus,button:focus,input:focus,summary:focus{outline:3px solid #9EC1FF;outline-offset:2px}
@media (max-width:780px){header{position:static}.bar-r>.tabs{order:3;width:100%;display:grid;grid-template-columns:1fr 1fr}.tab{justify-content:center;padding:0 8px;font-size:14px}.legend .d{display:none}}
.hero{padding:22px 0 2px}
.badge{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--orange-bg);color:var(--orange-ink);font-weight:700;font-size:14px;margin-bottom:10px}
.hero h1{font-size:clamp(26px,3.6vw,38px)}
.lead{font-size:16.5px;color:var(--muted);margin:8px 0 14px;max-width:54em}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:6px 0 12px}
.seg{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{font:inherit;font-size:15px;font-weight:600;min-height:40px;padding:0 16px;border:0;border-radius:9px;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff}
.btn{font:inherit;font-size:15px;font-weight:600;min-height:40px;padding:0 14px;border:1px solid #C9D2E0;border-radius:10px;background:#fff;color:var(--ink);cursor:pointer}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.lockbtn{margin-inline-start:auto}
.adv{position:relative}
.adv .pop{position:absolute;inset-inline-end:0;top:48px;z-index:900;width:min(360px,92vw);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(20,33,61,.16);padding:14px 16px}
.pop h3{font-family:Inter,sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 6px}
.pop h3:first-child{margin-top:0}
.pop label{display:flex;gap:8px;align-items:center;font-size:15px;padding:3px 0;cursor:pointer}
.pop input[type=checkbox]{accent-color:var(--blue);width:16px;height:16px}
.pop input[type=range]{width:100%;accent-color:var(--blue)}
.hint{font-size:12.5px;color:var(--muted)}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13.5px;color:var(--muted);align-items:center;margin-bottom:10px}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;vertical-align:middle;white-space:nowrap}
.chip.obs{background:var(--obs-bg);color:var(--obs)}.chip.mod{background:var(--mod-bg);color:var(--mod)}.chip.ass{background:var(--ass-bg);color:var(--ass)}
.chip.mis{background:var(--mis-bg);color:var(--mis);border:1px solid #F3B8B2}
.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(360px,.95fr);gap:18px;align-items:start;padding-bottom:50px}
@media (max-width:980px){.layout{grid-template-columns:1fr}}
.mapcol{position:sticky;top:78px}
@media (max-width:980px){.mapcol{position:static}}
#map{height:min(72vh,680px);min-height:420px;border:1px solid var(--line);border-radius:18px;background:#E8EDF5;overflow:hidden}
@media (max-width:640px){#map{height:62vh;min-height:360px}}
.leaflet-tile-pane{filter:grayscale(.85) contrast(.92) brightness(1.04)}
.mapnote{font-size:12.5px;color:var(--muted);margin:8px 2px 0}
.mapwrap{position:relative}
.maplegend{position:absolute;z-index:500;inset-inline-start:10px;bottom:10px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:12px;max-width:240px;line-height:1.35}
.maplegend summary{cursor:pointer;font-weight:700;font-size:12px;list-style:none}.maplegend summary::-webkit-details-marker{display:none}
.maplegend summary::after{content:' ▾';color:var(--muted)}.maplegend:not([open]) summary::after{content:' ▸'}
.maplegend .row{display:flex;align-items:center;gap:7px;margin:3px 0}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none}.sw.sq{border-radius:2px}.sw.hollow{background:#fff!important;border:2px dashed #14213D}
.playbar{position:absolute;z-index:500;inset-inline-end:10px;top:10px;display:flex;gap:6px}
.playbar .btn{min-height:36px;padding:0 12px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0}
.card h2{font-size:19px;margin-bottom:2px}
.sub{color:var(--muted);font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.tile{border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:#fff}
.tile .v{font-family:"Space Grotesk",sans-serif;font-size:23px;font-weight:700;color:var(--blue-d);line-height:1.1}
.tile.m .v{color:var(--mod)}
.tile .l{font-size:13.5px;margin-top:3px}.tile .s{font-size:12px;color:var(--muted);margin-top:3px}
.pilot{border-radius:16px;padding:14px 16px;border:1px solid var(--line);background:#fff}
.pilot.h{border-inline-start:6px solid var(--hosp)}.pilot.b{border-inline-start:6px solid var(--bus)}
.pilot h2{font-size:18px}
.pilot h3{font-size:15px;margin:12px 0 4px;font-family:Inter,sans-serif;font-weight:700}
.notice{border-radius:12px;padding:9px 12px;font-size:14px;margin-top:10px}
.notice.warn{background:var(--ass-bg);border:1px solid #EBD38A}.notice.info{background:var(--sky)}
table{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:6px}
th,td{text-align:end;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th:first-child,td:first-child{text-align:start}th{color:var(--muted);font-weight:600;font-size:12.5px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}
details.fold{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
details.fold>summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none;padding:6px 0}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:'▾';margin-inline-start:8px;color:var(--muted)}details.fold[open]>summary::after{content:'▴'}
.fold ul{margin:4px 0 6px;padding-inline-start:18px;font-size:14px}.fold li{margin:5px 0}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13.5px}.kv span:nth-child(even){text-align:end;font-weight:600}
.stops{max-height:520px;overflow:auto;margin-top:8px;padding-inline-end:2px}
.stop{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff}
.stop>summary{cursor:pointer;list-style:none;padding:9px 12px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.stop>summary::-webkit-details-marker{display:none}
.stop.active{border-color:var(--bus);box-shadow:0 0 0 2px #FBD9BE}
.stop.pending{opacity:.45}
.stop .n{width:24px;height:24px;border-radius:50%;background:var(--bus);color:#fff;font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;flex:none}
.stop .n.far{background:#9C2B00}.stop .n.ct{background:#fff;color:var(--bus);border:2px dashed var(--bus)}
.stop .nm{font-weight:700}.stop .meta{margin-inline-start:auto;font-size:12.5px;color:var(--muted)}
.stop .body{padding:2px 12px 12px;font-size:13.5px}.stop .body li{margin:4px 0}.stop .body ul{margin:4px 0;padding-inline-start:18px}
.role{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px}
.role.far{background:#FDE3D2;color:#8A3B00}.role.ct{background:#E8EDF7;color:#123E91}.role.mid{background:#F1F3F7;color:#4A5872}
.flag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--ass-bg);color:var(--ass);margin-inline-end:4px}
.num{width:24px;height:24px;border-radius:50%;background:var(--bus);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.num.far{background:#9C2B00}.num.ct{background:#fff;color:var(--bus);border:2px dashed var(--bus)}
.bus{width:22px;height:22px;border-radius:6px;background:#14213D;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.5)}
.ctsq{width:16px;height:16px;border-radius:3px;background:#123E91;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.ctsq.likely{background:#fff;border:2px dashed #123E91;box-shadow:0 0 0 2px #fff}.ctsq.ctx{width:11px;height:11px;opacity:.7}
.ctlab{font-size:11.5px;font-weight:600;color:#14213D;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap}
.leaflet-popup-content{font:14px/1.45 Inter,system-ui,sans-serif;margin:12px 14px}
.leaflet-popup-content h4{margin:0 0 4px;font-family:"Space Grotesk",sans-serif;font-size:16px}
footer{padding:26px 0 40px;color:var(--muted);font-size:14px;border-top:1px solid var(--line);background:#fff}
.hidden{display:none}
</style>
</head>
<body>

  <div class="wrap bar">
    <a class="logo" href="/" data-t="brand">Polku hoitoon</a>
    <div class="bar-r">
      <nav class="tabs" aria-label="Polku hoitoon"><a class="tab" href="/" data-t="nav_bus"></a><a class="tab" href="/sovellus" data-t="nav_app"></a></nav>
      <label for="lang" class="hidden" id="langLbl">Language</label>

</header>
<main>
  <div class="wrap hero">
    <span class="badge" data-t="badge"></span>
    <h1 data-t="h1"></h1>
    <p class="lead" data-t="lead"></p>
    <div class="toolbar">
      <div class="seg" role="group" id="regionSeg"></div>
      <div class="adv lockbtn" id="adv">
        <button class="btn" id="advBtn" type="button" aria-expanded="false"><span aria-hidden="true" id="lockIcon">🔒</span> <span id="advLabel"></span></button>
        <div class="pop hidden" id="advPop"></div>
      </div>
    </div>
    <div class="legend" id="statusLegend"></div>
  </div>
  <div class="wrap layout">
    <div class="mapcol">
      <div class="mapwrap">
        <div id="map" role="application" aria-label="Map"></div>
        <div class="playbar"><button class="btn p" id="playBtn" type="button"></button><button class="btn" id="replayBtn" type="button"></button></div>
        <details class="maplegend" id="maplegend" open><summary id="lgsum"></summary><div id="lgbody"></div></details>
      </div>
      <p class="mapnote" data-t="mapnote"></p>
    </div>
    <div class="panel" id="panel"></div>
  </div>
</main>
<footer><div class="wrap"><span data-t="footer"></span></div></footer>

function ready(){
  map=L.map('map',{zoomControl:true,scrollWheelZoom:false,minZoom:5,maxZoom:12});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:12,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
  ['hull','bubbles','ct','route','stops','bus'].forEach(k=>G[k]=L.layerGroup().addTo(map));

const lerp=(a,b,u)=>a.map((x,i)=>Math.round(x+(b[i]-x)*u));
function ramp(stops,u){u=Math.max(0,Math.min(1,u));const k=(stops.length-1)*u,i=Math.min(stops.length-2,Math.floor(k));return 'rgb('+lerp(stops[i],stops[i+1],k-i).join(',')+')'}
const BLUE=[[198,219,239],[66,146,198],[8,69,148]],ORG=[[254,230,206],[253,141,60],[140,45,4]];
const munis=()=>D.municipalities.filter(m=>m.county===cur);
const cls=m=>m.tt_ct_min<=thresh?'hospital':'bus';
function fill(m){
  const c=O.colour;
  if(c==='elig')return ramp(BLUE,Math.sqrt(m.eligible/1700));
  if(c==='tt')return ramp(ORG,m.tt_ct_min/150);
  if(c==='lang')return ramp(ORG,m.foreign_share/0.12);
  if(c==='edu')return ramp(ORG,((m.basic_share||0)-0.08)/0.2);
  return cls(m)==='hospital'?'#2A78D6':'#E8731A';
}

const hav=(a,b)=>{const p=Math.PI/180,x=Math.sin((b[0]-a[0])*p/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin((b[1]-a[1])*p/2)**2;return 12742*Math.asin(Math.sqrt(x))};
function roleText(s){return t(s.kind==='far'?'role_far':s.kind==='ct_town'?'role_ct':'role_mid')}
function stopPopup(s){return `<h4>${s.n}. ${esc(s.name)}</h4><div class="sub">${esc(roleText(s))}</div>`}
function stopMarker(s){

  return L.marker([s.lat,s.lon],{icon:L.divIcon({className:'',html:`<div class="num ${kind}">${s.n}</div>`,iconSize:[24,24],iconAnchor:[12,12]}),zIndexOffset:700,title:s.name,keyboard:true}).bindPopup(stopPopup(s));
}
function stopCards(){document.querySelectorAll('.stop').forEach(el=>{const n=+el.dataset.n,pend=A&&A.playing&&n>A.shown;el.classList.toggle('pending',!!pend);el.classList.toggle('active',!!(A&&A.playing&&n===A.active))})}
function stopAnim(){if(A){cancelAnimationFrame(A.raf);A.playing=false}}
function drawFull(){
  G.route.clearLayers();G.stops.clearLayers();G.bus.clearLayers();
  const b=D.counties[cur].bus;
  b.legs.forEach(l=>L.polyline(l.coords,{color:'#C2570C',weight:3,opacity:.9,interactive:false}).addTo(G.route));
  b.stops.forEach(s=>stopMarker(s).addTo(G.stops));
}
function startAnim(){
  stopAnim();
  const b=D.counties[cur].bus,n=b.stops.length;
  if(reduce||!n){drawFull();A={playing:false,shown:n,active:0,done:true,raf:0};$('playBtn').textContent=t('play');stopCards();return}
  G.route.clearLayers();G.stops.clearLayers();G.bus.clearLayers();
  const legLen=b.legs.map(l=>{let d=0;for(let i=1;i<l.coords.length;i++)d+=hav(l.coords[i-1],l.coords[i]);return d||.1});
  const totalL=legLen.reduce((a,x)=>a+x,0),MOVE=Math.min(24,10+n*0.7),DWELL=0.55,segs=[];
  b.legs.forEach((l,i)=>{segs.push({k:'dwell',i,dur:DWELL});segs.push({k:'move',i,dur:Math.max(.35,MOVE*legLen[i]/totalL)})});
  const marker=L.marker(b.legs[0].coords[0],{icon:L.divIcon({className:'',html:'<div class="bus">🚌</div>',iconSize:[22,22],iconAnchor:[11,11]}),zIndexOffset:900,interactive:false}).addTo(G.bus);
  const live=L.polyline([],{color:'#C2570C',weight:3.5,opacity:.95,interactive:false}).addTo(G.route);
  A={playing:true,shown:0,active:0,done:false,raf:0,idx:0};
  const me=A;$('playBtn').textContent=t('pause');
  const reveal=i=>{if(i<n&&me.shown<i+1){me.shown=i+1;stopMarker(b.stops[i]).addTo(G.stops)}};
  const t0=performance.now();
  const step=now=>{
    if(A!==me||!me.playing)return;
    const el=(now-t0)/1000;let i=0,acc=0;
    while(i<segs.length&&el>=acc+segs[i].dur){acc+=segs[i].dur;i++}
    for(let k=me.idx;k<i;k++){const s=segs[k];if(s.k==='move'){L.polyline(b.legs[s.i].coords,{color:'#C2570C',weight:3,opacity:.9,interactive:false}).addTo(G.route);live.setLatLngs([])}if(s.k==='dwell')reveal(s.i)}
    me.idx=i;
    if(i>=segs.length){me.done=true;me.playing=false;me.active=0;drawFull();$('playBtn').textContent=t('play');stopCards();return}
    const s=segs[i],f=(el-acc)/s.dur;
    if(s.k==='dwell'){me.active=s.i+1;reveal(s.i);marker.setLatLng(b.legs[s.i].coords[0])}
    else{
      const cs=b.legs[s.i].coords,want=f*legLen[s.i];let d=0,j=1;
      for(;j<cs.length-1;j++){const seg=hav(cs[j-1],cs[j]);if(d+seg>=want)break;d+=seg}
      const sg=hav(cs[j-1],cs[j])||1e-6,u=Math.min(1,Math.max(0,(want-d)/sg));
      const pos=[cs[j-1][0]+(cs[j][0]-cs[j-1][0])*u,cs[j-1][1]+(cs[j][1]-cs[j-1][1])*u];
      marker.setLatLng(pos);live.setLatLngs(cs.slice(0,j).concat([pos]));me.active=s.i+1<=n?s.i+1:0;
    }
    stopCards();
    const act=document.getElementById('stop'+me.active);
    if(act&&me.lastScrolled!==me.active){me.lastScrolled=me.active;const box=$('stopList');if(box){const top=act.offsetTop-box.offsetTop;box.scrollTo({top:Math.max(0,top-40),behavior:'smooth'})}}
    me.raf=requestAnimationFrame(step);
  };
  me.raf=requestAnimationFrame(step);stopCards();
}

  return `<section class="card"><h2>${t('scen_h')} <span class="chip ass">🔓</span></h2><div class="sub">${t('scen_sub')}</div>
   <div style="margin-top:8px">${sel('gamma')}${sel('lam')}${sel('mu')}${sel('spare')}</div>
   <div class="notice info">${t('scen_res',{s:r.stops.length,a:n0(r.additional),d:n1(r.days)})}</div>
   <div class="sub" style="margin-top:8px"><b>${t('scen_added')}:</b> ${add.length?add.map(esc).join(', '):t('scen_none')}<br><b>${t('scen_removed')}:</b> ${rem.length?rem.map(esc).join(', '):t('scen_none')}</div>
   <div class="sub" style="margin-top:8px"><b>${t('scen_v1')}:</b> ${v1.stops.length} · ${n0(v1.additional)} · ${n1(v1.days)} d<br>${v1.stops.map(x=>esc(x[0])).join(', ')}</div>
   <details class="fold"><summary>${t('scen_cor')}</summary><div class="kv">${cor}</div><div class="hint">n = ${ADV.n_municipalities_corr}</div></details></section>`;
}
function advPopHTML(){
  if(!token)return `<h3>${t('adv_label')}</h3><p class="hint" style="margin:0 0 8px">${t('adv_intro')}</p>
   <form id="pwForm" class="row2"><input type="password" id="pw" autocomplete="current-password" placeholder="${t('adv_pw')}" aria-label="${t('adv_pw')}" style="flex:1;min-width:0"><button class="btn p" type="submit">${t('adv_go')}</button></form><div class="hint" id="pwMsg" role="status" style="margin-top:6px"></div>`;
  return `<h3>${t('s_layers')}</h3>
   <label><input type="checkbox" data-o="bubbles" ${O.bubbles?'checked':''}>${t('l_bubbles')}</label><label><input type="checkbox" data-o="ct" ${O.ct?'checked':''}>${t('l_ct')}</label>
   <label><input type="checkbox" data-o="likely" ${O.likely?'checked':''}>${t('l_likely')}</label><label><input type="checkbox" data-o="ctx" ${O.ctx?'checked':''}>${t('l_ctx')}</label><label><input type="checkbox" data-o="hull" ${O.hull?'checked':''}>${t('l_hull')}</label>
   <h3>${t('s_colour')}</h3><select id="colour" style="width:100%">${['class','elig','tt','lang','edu'].map(k=>`<option value="${k}" ${O.colour===k?'selected':''}>${t('c_'+k)}</option>`).join('')}</select>
   <h3>${t('s_thresh')} ${chip('ass')}</h3><input type="range" id="thresh" min="15" max="120" step="5" value="${thresh}"><div class="hint"><b id="thresh_v">${thresh} min</b></div>
   <div style="margin-top:10px"><button class="btn" id="lockNow" type="button">${t('adv_lock')}</button></div>`;
}
function bindAdvPop(){
  const f=$('pwForm');
  if(f)f.addEventListener('submit',async e=>{e.preventDefault();const msg=$('pwMsg');msg.textContent='…';
    try{const r=await fetch('/api/map/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});
      if(r.status===401){msg.textContent=t('adv_bad');return}if(r.status===429){msg.textContent=t('adv_wait');return}if(r.status===503||r.status===404){msg.textContent=t('adv_off');return}
      if(!r.ok){msg.textContent=t('adv_err');return}
      const j=await r.json();token=j.token;try{sessionStorage.setItem('polku-map-token',token)}catch(e){}
      await loadAdv();if(!ADV){msg.textContent=t('adv_err');return}
      $('lockIcon').textContent='🔓';openAdv(true);panel()}catch(err){msg.textContent=t('adv_err')}});
  document.querySelectorAll('[data-o]').forEach(c=>c.addEventListener('change',()=>{O[c.dataset.o]=c.checked;renderStatic()}));
  const col=$('colour');if(col)col.addEventListener('change',()=>{O.colour=col.value;renderStatic()});
  const th=$('thresh');if(th)th.addEventListener('input',()=>{thresh=+th.value;$('thresh_v').textContent=thresh+' min';renderStatic();panel()});
  const lk=$('lockNow');if(lk)lk.addEventListener('click',()=>{token=null;ADV=null;try{sessionStorage.removeItem('polku-map-token')}catch(e){}thresh=D.meta.thresholds.hospital_invite_min;Object.assign(O,{bubbles:true,ct:true,likely:true,ctx:true,hull:true,colour:'class'});$('lockIcon').textContent='🔒';renderStatic();panel();openAdv(false)});
}
function openAdv(show){const p=$('advPop');p.innerHTML=advPopHTML();p.classList.toggle('hidden',!show);$('advBtn').setAttribute('aria-expanded',show?'true':'false');bindAdvPop()}
async function loadAdv(){
  try{const r=await fetch('/api/map/advanced',{headers:{'X-Map-Token':token}});
    if(!r.ok){token=null;ADV=null;try{sessionStorage.removeItem('polku-map-token')}catch(e){}return}
    ADV=await r.json()}catch(e){token=null;ADV=null}
}

/* ---------- orchestration ---------- */
function fit(){const h=hullOf(cur),ms=munis();map.fitBounds(L.latLngBounds(h||ms.map(m=>[m.lat,m.lon])),{padding:[28,28],maxZoom:9})}
function setRegion(c){stopAnim();cur=c;buildSegs();renderStatic();panel();fit();startAnim()}
document.addEventListener('click',e=>{const c=e.target.closest('[data-c]');if(c)setRegion(c.getAttribute('data-c'))});
$('lang').addEventListener('change',e=>{lang=e.target.value;applyLang()});
$('advBtn').addEventListener('click',()=>{openAdv($('advPop').classList.contains('hidden'))});
$('playBtn').addEventListener('click',()=>{if(A&&A.playing){stopAnim();drawFull();$('playBtn').textContent=t('play')}else startAnim()});
$('replayBtn').addEventListener('click',()=>startAnim());
let start='';try{start=localStorage.getItem('vayla-lang')||''}catch(e){}
if(T[start])lang=start;
ready();applyLang();if(innerWidth<700)$('maplegend').removeAttribute('open');
fetch('/pilot_map.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(async j=>{
  D=j;thresh=D.meta.thresholds.hospital_invite_min;
  try{token=sessionStorage.getItem('polku-map-token')}catch(e){}
  if(token)await loadAdv();
  applyLang();fit();startAnim();
}).catch(()=>{$('panel').innerHTML=`<div class="card">${t('err')}</div>`});
</script>
</body>
</html>
