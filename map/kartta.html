<!DOCTYPE html>
<html lang="fi" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polku hoitoon – Pilottikartta</title>
<meta name="description" content="Keuhkosyövän TT-seulontapilottien ehdotetut alueet ja bussireitit Lapissa, Kymenlaaksossa ja Satakunnassa.">
<link href="/fonts/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="/vendor/leaflet.css">
<style>
:root{color-scheme:dark;--bg:#0E131D;--panel:#151C29;--panel2:#1B2434;--line:#263147;--ink:#E7ECF5;--muted:#93A0B8;--acc:#F07F2F;--acc2:#FFB37A;--blue:#4C8DF6;
  --obs:#7FB2FF;--obs-bg:#14284A;--mod:#FFB37A;--mod-bg:#3A2412;--ass:#F2D27A;--ass-bg:#352B10;--warn-bg:#2E2610;--warn-line:#5B4A17}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
a{color:var(--acc2)}
button,select,input,textarea{font:inherit;color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.pagebar{display:flex;align-items:center;gap:14px;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pagebar h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap}
.pagebar .tag{color:var(--muted);font-size:13px}
.pagebar .right{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
/* shared site header and footer (layout.js): keep the light look of the other pages */
#site-header,#site-footer{--ink:#14213D;--muted:#4A5872;--line:#E3E8F0;--blue:#1F5FD6;--blue-d:#123E91;color:#14213D}
#site-header header{z-index:1100}
#site-footer footer{padding:28px 0 40px;color:#4A5872;font-size:14px;border-top:1px solid #E3E8F0;background:#fff}
#site-footer a{color:#1F5FD6}
select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.banner{margin:8px 16px 0;padding:8px 12px;border-radius:8px;background:var(--warn-bg);border:1px solid var(--warn-line);font-size:13px}
.app{display:grid;grid-template-columns:minmax(420px,540px) minmax(0,1fr) minmax(260px,330px);gap:12px;padding:12px 16px;height:calc(100vh - 150px);min-height:560px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;padding:12px 14px}
.mapbox{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);min-height:420px}
#map{position:absolute;inset:0;background:#1d2534}
.leaflet-tile-pane{filter:saturate(.75) brightness(.95)}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;font-weight:700}
h2:first-child{margin-top:2px}
h3{font-size:15px;margin:0 0 4px}
.sub{color:var(--muted);font-size:12.5px}
.routes{display:flex;flex-direction:column;gap:8px}
.rc{display:block;width:100%;text-align:start;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;border-inline-start:5px solid var(--c,#666)}
.rc:hover{border-color:#3a4a68}.rc[aria-pressed=true]{background:#202c42;border-color:var(--c)}
.rc .t{display:flex;justify-content:space-between;gap:8px;font-weight:700}.rc .m{color:var(--muted);font-size:12.5px;margin-top:2px}
.picker{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.pk{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;display:inline-flex;gap:6px;align-items:center;line-height:1.4}
.pk .dot{width:8px;height:8px;border-radius:50%;background:var(--c,#8e9bb3)}
.pk[aria-pressed=true]{background:#2a3550;border-color:var(--c,#8e9bb3);color:#fff}
.hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.hk{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.hk .n{font-size:27px;font-weight:700;color:var(--mod);line-height:1.1;white-space:nowrap}
.hk .l{font-size:12.5px;margin-top:3px;font-weight:600}.hk .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.cvrow{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;font-size:12px;margin:5px 0}
.cvtrack{height:10px;background:#0E131D;border-radius:5px;overflow:hidden;border:1px solid var(--line)}.cvtrack span{display:block;height:100%}
table.cmp td,table.cmp th{padding:6px 5px}table.cmp tr.click{cursor:pointer}table.cmp tr.click:hover td{background:#1f2a3e}
@media (max-width:760px){.hero{grid-template-columns:1fr 1fr}}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi .n{font-size:20px;font-weight:700}.kpi .l{font-size:12.5px;color:var(--ink)}.kpi .s{font-size:11.5px;color:var(--muted)}
.kpi.m .n{color:var(--mod)}.kpi.o .n{color:var(--obs)}
.chip{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:0 6px;vertical-align:middle;white-space:nowrap}
.chip.obs{background:var(--obs-bg);color:var(--obs)}.chip.mod{background:var(--mod-bg);color:var(--mod)}.chip.ass{background:var(--ass-bg);color:var(--ass)}
.ins{margin:0;padding:0;list-style:none}.ins li{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 7px;border-inline-start:4px solid var(--c,var(--acc))}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:5px 5px;border-bottom:1px solid var(--line);text-align:end;vertical-align:top}th:first-child,td:first-child{text-align:start}th{color:var(--muted);font-weight:600}
.stop{background:var(--panel2);border:1px solid var(--line);border-radius:10px;margin:0 0 7px}
.stop>summary{list-style:none;cursor:pointer;padding:7px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stop>summary::-webkit-details-marker{display:none}
.stop .nb{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11.5px;color:#111;background:var(--c);flex:none}
.stop .nb.ct{background:transparent;color:var(--c);border:2px dashed var(--c)}
.stop .nm{font-weight:700}.stop .meta{margin-inline-start:auto;color:var(--muted);font-size:12px}
.stop .body{padding:0 10px 9px}.stop ul{margin:4px 0;padding-inline-start:18px}.stop li{margin:3px 0}
.stop.active{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.role{font-size:10.5px;font-weight:700;border-radius:5px;padding:0 6px;background:#263147;color:#c9d4ea}.role.far{background:#4a2410;color:#ffc79d}
.flag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:0 6px;background:var(--ass-bg);color:var(--ass);margin:2px 4px 0 0}
details.fold{border-top:1px solid var(--line);margin-top:12px;padding-top:6px}
details.fold>summary{cursor:pointer;font-weight:700;list-style:none;padding:5px 0}details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:' ▾';color:var(--muted)}details.fold[open]>summary::after{content:' ▴'}
.fold ul{margin:4px 0;padding-inline-start:18px}.fold li{margin:4px 0}
.notice{border-radius:9px;padding:8px 10px;background:var(--warn-bg);border:1px solid var(--warn-line);margin:8px 0;font-size:13px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn.p{background:var(--acc);border-color:var(--acc);color:#1a0d02}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form label{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.form input[type=range]{width:55%}.form input[type=number],.form input[type=password],.form select{width:55%;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 7px}
.checks{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;max-height:130px;overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px}
.checks label{display:flex;gap:4px;align-items:center;margin:0}
.mapctl{position:absolute;z-index:500;top:10px;inset-inline-end:10px;display:flex;gap:6px}
.mapctl .btn{box-shadow:0 1px 4px rgba(0,0,0,.4)}
.legend{position:absolute;z-index:500;bottom:10px;inset-inline-start:10px;background:rgba(14,19,29,.92);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px;max-width:250px}
.legend summary{cursor:pointer;font-weight:700;list-style:none}.legend summary::-webkit-details-marker{display:none}
.legend .row{display:flex;gap:7px;align-items:center;margin:3px 0}
.sw{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}.sw.sq{border-radius:2px}.sw.hol{background:transparent!important;border:2px dashed #cfd8ea}
.ln{display:inline-block;width:18px;border-top:3px solid}
.num{width:20px;height:20px;border-radius:50%;color:#111;font-weight:700;font-size:10.5px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.num.big{width:24px;height:24px;font-size:12px}.num.ct{background:#fff!important}
.bus{width:20px;height:20px;border-radius:5px;background:#0E131D;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.ctsq{width:13px;height:13px;border-radius:3px;background:#4C8DF6;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}.ctsq.likely{background:#0E131D;border:2px dashed #9cc1ff}
.ctlab{font-size:11px;font-weight:700;color:#0E131D;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#151C29;color:var(--ink);border:1px solid var(--line)}
.leaflet-popup-content{margin:10px 12px;font-size:13px;line-height:1.4}.leaflet-popup-content h4{margin:0 0 4px;font-size:15px}
.leaflet-popup-content ul{margin:4px 0;padding-inline-start:16px}
.chat{display:flex;flex-direction:column;min-height:0}
.chat .log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:8px 0;min-height:120px}
.msg{padding:8px 10px;border-radius:10px;max-width:92%;white-space:pre-wrap}.msg.u{align-self:flex-end;background:#2a3550}.msg.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.msg.sys{align-self:stretch;background:var(--warn-bg);border:1px solid var(--warn-line);font-size:12.5px}
.chat textarea{width:100%;min-height:62px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
.qchips{display:flex;flex-wrap:wrap;gap:6px}.qchips button{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:12.5px;text-align:start}
.legendchips{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--muted);margin:6px 0 2px}
.hidden{display:none!important}
@media (max-width:1150px){.app{grid-template-columns:minmax(380px,480px) minmax(0,1fr);height:auto}.chatp{grid-column:1/-1}.mapbox{min-height:70vh}}
@media (max-width:760px){.app{grid-template-columns:1fr;padding:8px}.mapbox{min-height:60vh;order:-1}.panel{max-height:none}.pagebar h1{font-size:15px}.pagebar .tag{display:none}}
</style>
</head>
<body data-languages="fi,sv,en">
<div id="site-header"></div><script src="/layout.js"></script>
<div class="pagebar">
  <h1 data-t="title"></h1>
  <span class="tag" data-t="tagline"></span>
  <span class="right"><button class="btn" id="lockTop" type="button"><span id="lockIcon">🔒</span> <span data-t="adv"></span></button></span>
</div>
<div class="banner" data-t="banner"></div>
<div class="app">
  <aside class="panel" id="left" aria-label="Routes"></aside>
  <div class="mapbox">
    <div id="map" role="application" aria-label="Map"></div>
    <div class="mapctl"><button class="btn" id="allBtn" type="button" data-t="all_fi"></button><button class="btn p" id="replayBtn" type="button" data-t="replay"></button></div>
    <details class="legend" id="legend"><summary data-t="legend"></summary><div id="legendBody"></div></details>
  </div>
  <aside class="panel chat chatp" id="chatPanel" aria-label="Chat">
    <h2 data-t="chat_h"></h2>
    <div class="sub" data-t="chat_sub"></div>
    <div class="log" id="chatLog" aria-live="polite"></div>
    <div class="qchips" id="qchips"></div>
    <form id="chatForm" style="margin-top:8px"><label for="chatIn" class="hidden">Question</label><textarea id="chatIn" maxlength="2000"></textarea>
      <div style="display:flex;gap:8px;align-items:center;margin-top:6px"><button class="btn p" type="submit" id="chatSend" data-t="send"></button><span class="sub" id="chatNote"></span></div></form>
  </aside>
</div>
<div id="site-footer"></div>
<script src="/vendor/leaflet.js"></script>

const LOC={fi:'fi-FI',sv:'sv-FI',en:'en-GB'};
const COL={HVA21:'#F07F2F',HVA10:'#A78BFA',HVA06:'#2DD4BF',custom:'#F472B6'};

let lang='fi',D=null,ADV=null,token=null,sel=null,CUSTOM=null,HS=null,thresh=45,map,G={},anims=[],chat=[],chatOK=null,scen=null,reduce=false;
const O={bub:true,ct:true,hull:true};
const $=id=>document.getElementById(id);
const t=(k,v)=>{let s=(T[lang][k]??T.fi[k]??k);if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n0=v=>v==null?'–':Math.round(v).toLocaleString(LOC[lang]);
const n1=v=>v==null?'–':(+v).toLocaleString(LOC[lang],{maximumFractionDigits:1});
const n2=v=>v==null?'–':(+v).toLocaleString(LOC[lang],{minimumFractionDigits:2,maximumFractionDigits:2});
const pc=v=>Math.round((v||0)*100);
const chip=k=>`<span class="chip ${k}">${t(k)}</span>`;
const cn=c=>D.counties[c].names[lang];
try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}

/* ---------------- map ---------------- */
function initMap(){
  map=L.map('map',{zoomControl:true,minZoom:4,maxZoom:12}).fitBounds(FIN);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:12,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
  ['hull','bub','hs','ct','r_HVA21','r_HVA10','r_HVA06','custom'].forEach(k=>G[k]=L.layerGroup().addTo(map));
  new ResizeObserver(()=>map.invalidateSize()).observe($('map'));
}
const munis=c=>D.municipalities.filter(m=>!c||m.county===c);
const isHosp=m=>m.tt_ct_min<=thresh;
function hullOf(pts){pts=pts.map(p=>[p[1],p[0]]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);if(pts.length<3)return null;const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]),lo=[],up=[];
  for(const p of pts){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}
  for(const p of pts.slice().reverse()){while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}
  return lo.slice(0,-1).concat(up.slice(0,-1)).map(p=>[p[1],p[0]])}
function drawStatic(){
  ['hull','bub','ct'].forEach(k=>G[k].clearLayers());
  D.meta.priority.forEach(c=>{
    if(O.hull){const h=hullOf(munis(c).map(m=>[m.lat,m.lon]));if(h)L.polygon(h,{color:COL[c],weight:sel===c?2:1,opacity:.7,dashArray:'4 4',fillColor:COL[c],fillOpacity:.04,interactive:false}).addTo(G.hull)}
    if(O.bub)munis(c).forEach(m=>{const h=isHosp(m),unc=h&&m.ct_status!=='confirmed';
      L.circleMarker([m.lat,m.lon],{radius:3+Math.sqrt(m.eligible)*.42,color:unc?'#cfd8ea':'#0E131D',weight:unc?1.2:.8,dashArray:unc?'2 3':null,fillColor:h?HOSP_COL:COL[c],fillOpacity:(sel&&sel!==c&&sel!=='custom')?.18:.5})
       .addTo(G.bub).bindPopup(()=>muniPop(m)).bindTooltip(esc(m.name),{direction:'top'})});
  });
  if(O.ct)D.ct_towns.forEach(x=>{const mine=D.meta.priority.includes(x.county);
    L.marker([x.lat,x.lon],{icon:L.divIcon({className:'',html:`<div class="ctsq${x.status==='likely'?' likely':''}" style="${mine?'':'opacity:.55;transform:scale(.8)'}"></div>`,iconSize:[13,13],iconAnchor:[6,6]}),zIndexOffset:300,title:x.town,keyboard:true})
      .addTo(G.ct).bindPopup(()=>ctPop(x))});
  legend();
}
function muniPop(m){return `<h4>${esc(m.name)}</h4><div>${isHosp(m)?t('lg_hosp',{m:thresh}):t('lg_bus',{m:thresh})}</div><ul>
 <li>${t('th_pop50')}: ${n0(m.pop_50_74)} ${chip('obs')}</li><li>${t('th_elig')}: ${n0(m.eligible)} ${chip('mod')}</li>
 <li>${t('why_tt',{m:n0(m.tt_ct_min),town:esc(m.nearest_ct),st:t('st_'+m.ct_status)})} ${chip('mod')}</li>

/* ---------------- routes + animation ---------------- */
const hav=(a,b)=>{const p=Math.PI/180,x=Math.sin((b[0]-a[0])*p/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin((b[1]-a[1])*p/2)**2;return 12742*Math.asin(Math.sqrt(x))};
function routeOf(k){return k==='custom'?CUSTOM:(D.counties[k]&&D.counties[k].bus)}
function stopIcon(s,col,big){const ct=s.kind==='ct_town';return L.divIcon({className:'',html:`<div class="num${big?' big':''}${ct?' ct':''}" style="background:${col};${ct?`color:${col};border:2px dashed ${col}`:''}">${s.n}</div>`,iconSize:big?[24,24]:[20,20],iconAnchor:big?[12,12]:[10,10]})}
function stopPop(k,s){const c=k==='custom'?null:D.counties[k];return `<h4>${s.n}. ${esc(s.name)}</h4><div><span class="role ${s.kind==='far'?'far':''}">${roleTxt(s)}</span></div>${whyList(s,k)}`}
function roleTxt(s){return t(s.kind==='far'?'role_far':s.kind==='ct_town'?'role_ct':'role_mid')}
function drawRoute(k,full=true){
  const g=k==='custom'?G.custom:G['r_'+k],r=routeOf(k);if(!g||!r)return;g.clearLayers();
  const dim=sel&&sel!==k,col=COL[k],big=sel===k;
  if(!full)return;
  r.legs.forEach(l=>L.polyline(l.coords,{color:col,weight:big?4:3,opacity:dim?.25:.95,dashArray:k==='custom'?'8 6':null}).addTo(g).on('click',()=>select(k)));
  r.stops.forEach(s=>L.marker([s.lat,s.lon],{icon:stopIcon(s,col,big),zIndexOffset:big?800:600,opacity:dim?.35:1,title:s.name,keyboard:true}).addTo(g)
    .bindPopup(()=>stopPop(k,s),{maxWidth:320}).on('click',()=>{if(sel!==k)select(k,{keepView:true});setActive(s.n)}));
}
function stopAnims(){anims.forEach(a=>{a.stop=true;cancelAnimationFrame(a.raf)});anims=[]}
function animate(keys){
  stopAnims();keys.forEach(k=>drawRoute(k,false));
  if(reduce){keys.forEach(k=>drawRoute(k));return}
  keys.forEach(k=>{
    const r=routeOf(k);if(!r||!r.stops.length)return;
    const g=k==='custom'?G.custom:G['r_'+k],col=COL[k],big=sel===k,n=r.stops.length;
    const lens=r.legs.map(l=>{let d=0;for(let i=1;i<l.coords.length;i++)d+=hav(l.coords[i-1],l.coords[i]);return d||.1}),tot=lens.reduce((a,b)=>a+b,0)||1;
    const MOVE=sel===k?Math.min(22,8+n*.6):11,DW=sel===k?.45:.15,segs=[];
    for(let i=0;i<n;i++){segs.push({k:'d',i,dur:DW});if(i<r.legs.length)segs.push({k:'m',i,dur:Math.max(.25,MOVE*lens[i]/tot)})}
    const bus=L.marker([r.stops[0].lat,r.stops[0].lon],{icon:L.divIcon({className:'',html:'<div class="bus">🚌</div>',iconSize:[20,20],iconAnchor:[10,10]}),zIndexOffset:900,interactive:false}).addTo(g);
    const live=L.polyline([],{color:col,weight:big?4:3,opacity:.95,dashArray:k==='custom'?'8 6':null,interactive:false}).addTo(g);
    const a={stop:false,raf:0,shown:0,idx:0};anims.push(a);const t0=performance.now();
    const show=i=>{if(a.shown<=i){a.shown=i+1;const s=r.stops[i];L.marker([s.lat,s.lon],{icon:stopIcon(s,col,big),zIndexOffset:big?800:600,title:s.name}).addTo(g);if(sel===k)setActive(s.n,false)}};
    const step=now=>{
      if(a.stop)return;const el=(now-t0)/1000;let i=0,acc=0;
      while(i<segs.length&&el>=acc+segs[i].dur){acc+=segs[i].dur;i++}
      for(let q=a.idx;q<i;q++){const s=segs[q];if(s.k==='m'){L.polyline(r.legs[s.i].coords,{color:col,weight:big?4:3,opacity:.95,dashArray:k==='custom'?'8 6':null,interactive:false}).addTo(g);live.setLatLngs([])}else show(s.i)}
      a.idx=i;
      if(i>=segs.length){a.stop=true;drawRoute(k);if(sel===k)setActive(null);return}
      const s=segs[i],f=(el-acc)/s.dur;
      if(s.k==='d'){show(s.i);bus.setLatLng([r.stops[s.i].lat,r.stops[s.i].lon])}
      else{const cs=r.legs[s.i].coords,want=f*lens[s.i];let d=0,j=1;for(;j<cs.length-1;j++){const sg=hav(cs[j-1],cs[j]);if(d+sg>=want)break;d+=sg}
        const sg=hav(cs[j-1],cs[j])||1e-6,u=Math.min(1,Math.max(0,(want-d)/sg)),pos=[cs[j-1][0]+(cs[j][0]-cs[j-1][0])*u,cs[j-1][1]+(cs[j][1]-cs[j-1][1])*u];
        bus.setLatLng(pos);live.setLatLngs(cs.slice(0,j).concat([pos]))}
      a.raf=requestAnimationFrame(step)};
    a.raf=requestAnimationFrame(step);
  });
}
function boundsOf(k){const r=routeOf(k);const pts=[];if(r)r.legs.forEach(l=>l.coords.forEach(p=>pts.push(p)));if(r)r.stops.forEach(s=>pts.push([s.lat,s.lon]));
  if(k!=='custom')munis(k).forEach(m=>pts.push([m.lat,m.lon]));return pts.length?L.latLngBounds(pts):null}

    <label><span>${t('thr')} <b id="thr_v">${thresh}</b> ${chip('ass')}</span><input type="range" id="thr" min="15" max="120" step="5" value="${thresh}"></label></div></details>
   <details class="fold" open><summary>${t('mk_h')}</summary><form class="form" id="mkForm">
    <div class="sub">${t('mk_regions')}</div><div class="checks">${P.map(c=>`<label><input type="checkbox" name="mk_c" value="${c}" ${SP.counties.includes(c)?'checked':''}>${esc(cn(c))}</label>`).join('')}</div>
    <label><span>${t('mk_start')}</span><select id="mk_start"><option value="">${t('mk_auto')}</option>${names.map(n=>`<option ${SP.start===n?'selected':''}>${esc(n)}</option>`).join('')}</select></label>
    <div class="sub">${t('mk_excl')}</div><div class="checks">${names.map(n=>`<label><input type="checkbox" name="mk_x" value="${esc(n)}" ${SP.exclude.includes(n)?'checked':''}>${esc(n)}</label>`).join('')}</div>
    ${rng('mk_work_days','mk_wd',10,SP.work_days)}${rng('mk_interval','mk_int',0.5,SP.interval)}${rng('mk_lam','mk_lam',0.25,SP.lam)}${rng('mk_gamma','mk_gamma',0.25,SP.gamma)}${rng('mk_mu','mk_mu',0.05,SP.mu)}${rng('mk_spare','mk_spare',0.01,SP.spare)}${rng('mk_k_elig','mk_k',0.05,SP.k_elig)}
    <label><span>${t('mk_ct')}</span><select id="mk_ct"><option value="confirmed+likely">${t('mk_ctl')}</option><option value="confirmed" ${SP.ct_mode==='confirmed'?'selected':''}>${t('mk_ctc')}</option></select></label>
    <button class="btn p" type="submit" id="mkGo">${t('mk_go')}</button> ${CUSTOM?`<button class="btn" type="button" id="mkClear">${t('mk_clear')}</button>`:''}<div class="sub" id="mkMsg" role="status">${t('mk_note')}</div></form></details>
   <details class="fold" open><summary>${t('hs_h')}</summary><form class="form" id="hsForm">
    <label><span>${t('hs_town')}</span><select id="hs_town">${towns.map(x=>`<option ${HS&&HS.town===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label>
    <label><span>${t('hs_min')} <b id="hs_min_v">${HS?HS.minutes:thresh}</b></span><input type="range" id="hs_min" min="15" max="120" step="5" value="${HS?HS.minutes:thresh}"></label>
    <label><span>${t('hs_slots')}</span><input type="number" id="hs_slots" min="0" max="500" step="1" value="${HS&&HS.user_slots_per_week||''}"></label>
    <button class="btn p" type="submit">${t('hs_go')}</button><div id="hsOut">${HS?hsHTML():''}</div></form></details>`;
  if(ADV){const g=ADV.grid;scen=scen||Object.assign({},ADV.base);const k0=sel&&sel!=='custom'?sel:'HVA21';
    const rec=ADV.scenarios.find(x=>Object.keys(scen).every(q=>x.params[q]===scen[q])),base=ADV.scenarios.find(x=>Object.keys(ADV.base).every(q=>x.params[q]===ADV.base[q]));
    const rr=rec.counties[k0],b0=base.counties[k0],nn=rr.stops.map(x=>x[0]),bn=b0.stops.map(x=>x[0]);
    h+=`<details class="fold"><summary>${t('sc_h')} · ${esc(cn(k0))}</summary><div class="sub">${t('sc_sub')}</div><div class="form">${['gamma','lam','mu','spare'].map(q=>`<label><span>${t('mk_'+q)}</span><select data-s="${q}">${g[q].map(v=>`<option ${v===scen[q]?'selected':''}>${v}</option>`).join('')}</select></label>`).join('')}</div>
     <div class="notice">${t('sc_res',{s:rr.stops.length,a:n0(rr.additional),d:n1(rr.days)})}<br>${t('sc_add')}: ${nn.filter(x=>!bn.includes(x)).map(esc).join(', ')||t('sc_none')} · ${t('sc_rem')}: ${bn.filter(x=>!nn.includes(x)).map(esc).join(', ')||t('sc_none')}</div></details>`}
  h+=`<div style="margin-top:10px"><button class="btn" type="button" id="lockBtn">${t('lock')}</button></div>`;
  return h;
}
function hsHTML(){const x=HS;let s=`<div class="notice">${t('hs_res',{t:esc(x.town),st:t('st_'+x.ct_status),n:x.municipalities.length,e:n0(x.eligible),inv:n0(x.invitations_per_year),sc:n0(x.expected_scans_year),w:n1(x.expected_scans_week)})} ${chip('mod')}`;
  if(x.user_slots_per_week)s+=`<br>${t('hs_slots_res',{s:n0(x.user_slots_per_week),wk:n0(x.weeks_to_cover_one_round),p:pc(x.share_of_demand_covered)})} ${chip('ass')}`;
  s+=`<br><span class="sub">${t('hs_cap')}${esc(x.capacity.needed_data.join('; '))}.</span></div><table><tbody>${x.municipalities.map(m=>`<tr><td>${esc(m.name)}</td><td>${m.minutes} min</td><td>${n0(m.eligible)}</td><td>${n1(m.scans_year)}</td></tr>`).join('')}</tbody></table>`;return s}
function bindTools(){
  const f=$('pwForm');
  if(f)f.addEventListener('submit',async e=>{e.preventDefault();const msg=$('pwMsg');msg.textContent='…';
    try{const r=await fetch('/api/map/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});
      if(r.status===401){msg.textContent=t('pw_bad');return}if(r.status===429){msg.textContent=t('pw_wait');return}if(r.status===503||r.status===404){msg.textContent=t('pw_off');return}if(!r.ok){msg.textContent=t('pw_err');return}
      token=(await r.json()).token;try{sessionStorage.setItem('polku-map-token',token)}catch(e){}await loadAdv();if(!ADV){msg.textContent=t('pw_err');return}
      $('lockIcon').textContent='🔓';renderLeft();$('toolsSec').scrollIntoView({block:'start'})}catch(err){msg.textContent=t('pw_err')}});
  $('left').querySelectorAll('[data-o]').forEach(c=>c.addEventListener('change',()=>{O[c.dataset.o]=c.checked;drawStatic()}));
  const thr=$('thr');if(thr)thr.addEventListener('input',()=>{thresh=+thr.value;$('thr_v').textContent=thresh;drawStatic()}),thr.addEventListener('change',()=>renderLeft());
  $('left').querySelectorAll('#mkForm input[type=range]').forEach(r=>r.addEventListener('input',()=>{$(r.id+'_v').textContent=r.value}));
  const hm=$('hs_min');if(hm)hm.addEventListener('input',()=>{$('hs_min_v').textContent=hm.value});
  const mk=$('mkForm');if(mk)mk.addEventListener('submit',async e=>{e.preventDefault();const msg=$('mkMsg');$('mkGo').disabled=true;msg.textContent=t('mk_busy');
    const spec={counties:[...document.querySelectorAll('input[name=mk_c]:checked')].map(x=>x.value),exclude:[...document.querySelectorAll('input[name=mk_x]:checked')].map(x=>x.value),
      start:$('mk_start').value||null,work_days:+$('mk_work_days').value,interval:+$('mk_interval').value,lam:+$('mk_lam').value,gamma:+$('mk_gamma').value,mu:+$('mk_mu').value,spare:+$('mk_spare').value,k_elig:+$('mk_k_elig').value,ct_mode:$('mk_ct').value};
    try{const r=await fetch('/api/map/route',{method:'POST',headers:{'Content-Type':'application/json','X-Map-Token':token},body:JSON.stringify(spec)});
      if(r.status===401){token=null;ADV=null;renderLeft();return}
      const j=await r.json();if(!r.ok){msg.textContent=(j.detail||t('mk_err'));$('mkGo').disabled=false;return}
      CUSTOM=j;select('custom')}catch(err){msg.textContent=t('mk_err');$('mkGo').disabled=false}});
  const mc=$('mkClear');if(mc)mc.addEventListener('click',()=>{CUSTOM=null;G.custom.clearLayers();select(null)});
  const hs=$('hsForm');if(hs)hs.addEventListener('submit',async e=>{e.preventDefault();const out=$('hsOut');out.textContent='…';
    try{const r=await fetch('/api/map/hospital',{method:'POST',headers:{'Content-Type':'application/json','X-Map-Token':token},body:JSON.stringify({town:$('hs_town').value,hospital_minutes:+$('hs_min').value,slots_per_week:+$('hs_slots').value||null})});
      const j=await r.json();if(!r.ok){out.textContent=j.detail||'error';return}HS=j;drawHS();renderLeft()}catch(err){out.textContent='error'}});
  $('left').querySelectorAll('[data-s]').forEach(s=>s.addEventListener('change',()=>{scen[s.dataset.s]=+s.value;renderLeft()}));
  const lb=$('lockBtn');if(lb)lb.addEventListener('click',()=>{token=null;ADV=null;HS=null;G.hs.clearLayers();try{sessionStorage.removeItem('polku-map-token')}catch(e){}$('lockIcon').textContent='🔒';thresh=D.meta.thresholds.hospital_invite_min;Object.assign(O,{bub:true,ct:true,hull:true});drawStatic();renderLeft()});
}
function drawHS(){G.hs.clearLayers();if(!HS)return;const tw=D.ct_towns.find(x=>x.town===HS.town),pts=[];
  HS.municipalities.forEach(m=>{const mm=D.municipalities.find(q=>q.name===m.name);if(!mm)return;pts.push([mm.lat,mm.lon]);
    L.circleMarker([mm.lat,mm.lon],{radius:6+Math.sqrt(m.eligible)*.45,color:'#fff',weight:2,dashArray:'3 3',fill:false}).addTo(G.hs).bindTooltip(esc(m.name)+': '+n0(m.eligible));
    if(tw)L.polyline([[tw.lat,tw.lon],[mm.lat,mm.lon]],{color:'#fff',weight:1,opacity:.6,interactive:false}).addTo(G.hs)});
  if(tw)pts.push([tw.lat,tw.lon]);if(pts.length)map.flyToBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:9,duration:.7});legend()}
async function loadAdv(){try{const r=await fetch('/api/map/advanced',{headers:{'X-Map-Token':token}});if(!r.ok){token=null;ADV=null;try{sessionStorage.removeItem('polku-map-token')}catch(e){}return}ADV=await r.json()}catch(e){token=null;ADV=null}}

/* ---------------- chat ---------------- */
function chatRender(){
  const log=$('chatLog');log.innerHTML='';
  if(chatOK===false){const d=document.createElement('div');d.className='msg sys';d.textContent=t('chat_off');log.appendChild(d)}
  chat.forEach(m=>{const d=document.createElement('div');d.className='msg '+(m.role==='user'?'u':'a');if(m.role==='user')d.textContent=m.content;else d.innerHTML=esc(m.content).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#+\s*/gm,'');log.appendChild(d)});
  log.scrollTop=log.scrollHeight;
  $('qchips').innerHTML=['q1','q2','q3'].map(q=>`<button type="button" data-q="${q}">${t(q)}</button>`).join('');
  $('qchips').querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{$('chatIn').value=t(b.dataset.q);$('chatIn').focus()}));
  $('chatSend').disabled=chatOK===false;$('chatNote').textContent=chatOK?t('chat_note'):'';
}
function selection(){
  if(sel===null)return {view:'all routes'};
  const r=routeOf(sel);return {view:sel==='custom'?'custom route':cn(sel),start:r.start,end:r.end,stops:r.stops.map(s=>s.name),totals:r.totals,spec:sel==='custom'?r.spec:undefined,threshold_min:thresh};
}
async function sendChat(e){
  e.preventDefault();const q=$('chatIn').value.trim();if(!q||chatOK===false)return;
  chat.push({role:'user',content:q});$('chatIn').value='';chat.push({role:'assistant',content:t('chat_wait')});chatRender();
  try{const r=await fetch('/api/map/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:chat.slice(0,-1),selection:selection()})});
    chat.pop();
    if(r.status===503){chatOK=false;chat.pop();chatRender();return}
    if(r.status===429){chat.push({role:'assistant',content:t('chat_rate')});chatRender();return}
    const j=await r.json();chat.push({role:'assistant',content:r.ok?j.answer:t('chat_err')})}catch(err){chat.pop();chat.push({role:'assistant',content:t('chat_err')})}
  chatRender();
}

/* ---------------- boot ---------------- */
function applyLang(){
  document.documentElement.lang=lang;$('lang').value=lang;try{localStorage.setItem('vayla-lang',lang)}catch(e){}
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.title=t('title');
  $('chatIn').placeholder=t('q2');if(D){drawStatic();renderLeft()}chatRender();
}
$('lang').addEventListener('change',e=>{lang=e.target.value;applyLang()});
$('allBtn').addEventListener('click',()=>select(null));
$('replayBtn').addEventListener('click',()=>{if(sel===null)animate([...D.meta.priority,...(CUSTOM?['custom']:[])]);else animate([sel])});
$('lockTop').addEventListener('click',()=>{const s=$('toolsSec');if(s){$('left').scrollTo({top:s.offsetTop-$('left').offsetTop-8,behavior:'smooth'});const p=$('pw');if(p)setTimeout(()=>p.focus(),400)}});
$('chatForm').addEventListener('submit',sendChat);
$('chatIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('chatForm').requestSubmit()}});
try{const s=localStorage.getItem('vayla-lang');if(T[s])lang=s}catch(e){}
initMap();applyLang();
fetch('/api/map/chat').then(r=>r.ok?r.json():{configured:false}).then(j=>{chatOK=!!j.configured;chatRender()}).catch(()=>{chatOK=false;chatRender()});
fetch('/pilot_map.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(async j=>{
  D=j;thresh=D.meta.thresholds.hospital_invite_min;
  try{token=sessionStorage.getItem('polku-map-token')}catch(e){}
  if(token)await loadAdv();if(token&&ADV)$('lockIcon').textContent='🔓';
  drawStatic();select(null);
}).catch(()=>{$('left').innerHTML=`<div class="notice">${t('err')}</div>`});
</script>
</body>
</html>
